function sortedOrders(){return [...S.orders].sort((a,b)=>a.seq-b.seq)}
/* ── LP DRAG-AND-DROP ─────────────────────────────────────────────
   Перетаскивание заказов и изделий в левой панели Ганта для приоритезации.
   • Заказы тянутся между собой (изменяется order.seq).
   • Изделия тянутся только внутри своего заказа (меняется порядок в
     order.suborders массиве).
   Разные «kind» (order vs sub:<orderId>) изолированы — нельзя перетащить
   изделие из одного заказа в другой и нельзя перетащить заказ туда, где
   принимают изделия. */
function setupLPDrag(rowEl,kind,id,onReorder){
  rowEl.draggable=true;
  rowEl.addEventListener('dragstart',e=>{
    window._lpDragInfo={kind,id};
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain',kind+':'+id);
    rowEl.classList.add('lp-dragging');
  });
  rowEl.addEventListener('dragend',()=>{
    window._lpDragInfo=null;
    rowEl.classList.remove('lp-dragging');
  });
  rowEl.addEventListener('dragover',e=>{
    const info=window._lpDragInfo;
    if(!info||info.kind!==kind||info.id===id)return;
    e.preventDefault();
    e.dataTransfer.dropEffect='move';
    const rect=rowEl.getBoundingClientRect();
    const before=e.clientY<rect.top+rect.height/2;
    rowEl.classList.toggle('lp-drag-before',before);
    rowEl.classList.toggle('lp-drag-after',!before);
  });
  rowEl.addEventListener('dragleave',()=>{
    rowEl.classList.remove('lp-drag-before','lp-drag-after');
  });
  rowEl.addEventListener('drop',e=>{
    const info=window._lpDragInfo;
    if(!info||info.kind!==kind||info.id===id)return;
    e.preventDefault();
    e.stopPropagation();
    const before=rowEl.classList.contains('lp-drag-before');
    rowEl.classList.remove('lp-drag-before','lp-drag-after');
    onReorder(info.id,id,before);
  });
}
function reorderOrders(srcId,dstId,before){
  const list=sortedOrders();
  const srcIdx=list.findIndex(o=>o.id===srcId);
  if(srcIdx===-1)return;
  const [src]=list.splice(srcIdx,1);
  let dstIdx=list.findIndex(o=>o.id===dstId);
  if(dstIdx===-1){list.splice(srcIdx,0,src);return}
  if(!before)dstIdx++;
  list.splice(dstIdx,0,src);
  list.forEach((o,i)=>o.seq=i);
  render();
}
function reorderSubs(order,srcId,dstId,before){
  const arr=order.suborders;
  const srcIdx=arr.findIndex(s=>s.id===srcId);
  if(srcIdx===-1)return;
  const [src]=arr.splice(srcIdx,1);
  let dstIdx=arr.findIndex(s=>s.id===dstId);
  if(dstIdx===-1){arr.splice(srcIdx,0,src);return}
  if(!before)dstIdx++;
  arr.splice(dstIdx,0,src);
  render();
}
/* Kanban sort: earliest deadline first; orders without deadline sink to the
   bottom and are ordered among themselves by creation date (start). */
function kbSortOrders(orders){
  return [...orders].sort((a,b)=>{
    const aDl=deadlineDate(a.deadline,a.start);
    const bDl=deadlineDate(b.deadline,b.start);
    if(aDl&&bDl){const d=aDl-bDl;if(d)return d}
    else if(aDl&&!bDl)return -1;
    else if(!aDl&&bDl)return 1;
    return new Date(a.start)-new Date(b.start);
  });
}
/* Orders visible on the Gantt diagram: from 'inwork' (idx 1) up to but not
   including 'delivered' (last). New ('new', idx 0) and 'delivered' are hidden.
   When an order moves out of these statuses and back, its full state is
   preserved untouched in S.orders — only visibility on the Gantt changes. */
function ganttVisibleOrders(){
  return sortedOrders().filter(o=>{
    const idx=KB_COLS.findIndex(c=>c.id===o.kbCol);
    return idx>=1&&idx<KB_COLS.length-1;
  });
}
/* Validate a kanban move. Returns true if applied, false if rejected.
   Going from any non-'new' column back to 'new' is forbidden with a warning. */
function attemptKbMove(order,newColId){
  const fromIdx=KB_COLS.findIndex(c=>c.id===order.kbCol);
  const toIdx=KB_COLS.findIndex(c=>c.id===newColId);
  if(toIdx===-1)return false;
  if(fromIdx>=1&&toIdx===0){
    alert('Заказ уже принят в работу — возврат в «Новые» невозможен.');
    return false;
  }
  /* leaving 'new' for any active column requires an assignee — but only for
     orders flagged as needing extra info (those that show the inline form). */
  if(fromIdx===0&&toIdx>0&&order.needsInfo){
    if(!order.assignee||!order.assignee.trim()){
      alert('Невозможно перевести заказ из «Новые» — не назначен ответственный.');
      return false;
    }
  }
  order.kbCol=newColId;
  order.kbColEnteredAt=dk(TODAY);
  /* If the order just left 'Новые' for any active column, plan its stages
     now (it was excluded from planning while in 'new'). */
  if(fromIdx===0&&toIdx>0){
    const dlDate=deadlineDate(order.deadline,order.start);
    if(dlDate){
      const dlStr=dk(dlDate);
      order.suborders.forEach(sub=>{
        const ids=sub.stages.map(s=>s.id);
        const stMap=buildStagesBackwards(ids,dlStr,{},order.start);
        sub.stages.forEach(stage=>{
          if(stMap[stage.id]){
            stage.start=stMap[stage.id].start;
            stage.end=stMap[stage.id].end;
          }
        });
        sub.stages.forEach(stage=>syncStageEnd(stage,sub));
      });
    }
  }
  return true;
}

/* ── Progress & active stage helpers ── */
/* Default duration in hours for a stage, considering speed calculators for
   cutting/edging/drilling when sub.qty is non-zero. */
function computeDefaultDurH(stageId,qty){
  const def=STAGE_DEFS.find(s=>s.id===stageId);
  const lunch=Math.max(0,S.lunchEnd-S.lunchStart);
  const dayH=Math.max(1,S.workEnd-S.workStart-lunch);
  if(stageId==='cutting'&&qty?.sheets>0&&S.speeds.cutting.sheetsPerHour>0)
    return Math.max(0.5,Math.ceil(qty.sheets/S.speeds.cutting.sheetsPerHour*2)/2);
  if(stageId==='edging'&&qty?.edgeMeters>0&&S.speeds.edging.mPerMin>0)
    return Math.max(0.5,Math.ceil(qty.edgeMeters/S.speeds.edging.mPerMin/60*2)/2);
  if(stageId==='drilling'&&qty?.parts>0&&S.speeds.drilling.secPerPart>0)
    return Math.max(0.5,Math.ceil(qty.parts*S.speeds.drilling.secPerPart/3600*2)/2);
  return Math.max(1,def.wd*dayH);
}
/* Actual duration: explicit stage.durationHours wins, otherwise default. */
function computeStageDurH(stage,sub){
  if(stage.durationHours!=null)return stage.durationHours;
  return computeDefaultDurH(stage.id,sub?.qty);
}
/* Legacy alias used in a few places; behaves identically. */
function stageDurH(stage){return computeStageDurH(stage,null)}
/* Recompute stage.end so that calendar-day-based code (getRange, spans,
   stageVisEnd, cascade) stays consistent with hourly duration. */
function syncStageEnd(stage,sub){
  const dh=computeStageDurH(stage,sub);
  const sh=stage.startHour!=null?stage.startHour:S.workStart;
  const wdays=[];let d=new Date(stage.start);
  for(let i=0;i<60;i++){if(!isWE(d))wdays.push(dk(d));d=calAdd(d,1);}
  const segs=calcStageSegments(sh,dh,S.workStart,S.workEnd,S.lunchStart,S.lunchEnd,0,wdays);
  if(!segs.length){stage.end=dk(awdFromDate(new Date(stage.start),stage.wd||1));return}
  const last=segs[segs.length-1];
  const lastDay=new Date(wdays[last.di]);
  stage.end=dk(calAdd(lastDay,1)); // exclusive end
}
/* Локальный пересчёт после переключения рабочей субботы.
   Правило: этапы (всех изделий всех заказов), чей stage.start ПОЗЖЕ
   изменённой субботы, сдвигаются на ОДИН рабочий день — назад при включении
   субботы или вперёд при выключении.
   Относительные позиции этапов между собой сохраняются. Этапы, через которые
   проходит сама суббота (start ≤ sat ≤ end), не двигаются — но их end
   пересчитывается через syncStageEnd под новый календарь. Этапы ДО субботы
   не трогаются вообще.
   ИСКЛЮЧЕНИЯ: «Закупка» (materials в изделии + order.purchasing) и «Монтаж»
   (install) НЕ двигаются и НЕ пересчитываются — это внешние плановые даты,
   назначенные поставщиками и клиентом соответственно. */
const _SAT_SHIFT_EXCLUDED=new Set(['materials','install']);
function shiftStagesAfterSat(satIso,mode){
  const sat=new Date(satIso);
  const shiftDate=stStart=>{
    if(mode==='enable')return subWD(stStart,1);  /* стало больше раб. дней → сдвиг назад */
    return awdFromDate(stStart,1);                /* стало меньше раб. дней → сдвиг вперёд */
  };
  /* В режиме disable: этап, начавшийся ровно на этой субботе, тоже сдвигается,
     иначе он визуально остаётся на выходном. В режиме enable суббота становится
     рабочей — стартовать на ней нормально. */
  const shouldShift=stStart=>{
    if(mode==='disable')return stStart>=sat;
    return stStart>sat;
  };
  S.orders.forEach(o=>{
    if(o.kbCol==='new')return;
    o.suborders.forEach(sub=>{
      sub.stages.forEach(st=>{
        /* Закупку и монтаж не трогаем — это внешние даты */
        if(_SAT_SHIFT_EXCLUDED.has(st.id))return;
        const stStart=new Date(st.start);
        if(shouldShift(stStart)){
          st.start=dk(shiftDate(stStart));
        }
        /* end пересчитываем всегда: для этапов через субботу — длительность
           в новом календаре умещается в меньше/больше кал. дней; для сдвинутых
           этапов — пересчитан под новый start. */
        syncStageEnd(st,sub);
      });
    });
    /* order.purchasing — плановая дата поставщика, не трогаем (ни start, ни end) */
  });
}
/* Hour-precise end of a stage: returns {date, hour} of the moment the stage
   actually finishes working. Used by validateStageStart so consecutive
   chain stages can share a day as long as hours don't overlap. */
function stageActualEnd(stage,sub){
  const dh=computeStageDurH(stage,sub);
  const sh=stage.startHour!=null?stage.startHour:S.workStart;
  const wdays=[];let d=new Date(stage.start);
  for(let i=0;i<60;i++){if(!isWE(d))wdays.push(dk(d));d=calAdd(d,1);}
  const segs=calcStageSegments(sh,dh,S.workStart,S.workEnd,S.lunchStart,S.lunchEnd,0,wdays);
  if(!segs.length)return{date:dk(stage.start),hour:sh};
  const last=segs[segs.length-1];
  return{date:wdays[last.di],hour:last.endH};
}
/* Cross-order conflict detection: find stages with the same stage.id whose
   time intervals overlap. Returns map of `${orderId}:${subId}:${stageId}` →
   array of {label, time} describing other conflicting stages. Used by
   renderGantt to draw warning styling and by the header conflict counter. */
function findConflicts(){
  const out={};
  const byStage={};
  S.orders.forEach(order=>{
    /* Orders in 'Новые' don't consume capacity, so they neither conflict
       with each other nor with active orders. */
    if(order.kbCol==='new')return;
    order.suborders.forEach(sub=>{
      sub.stages.forEach(stage=>{
        const sh=stage.startHour!=null?stage.startHour:S.workStart;
        const sMs=new Date(stage.start).getTime()+sh*3600000;
        const ae=stageActualEnd(stage,sub);
        const eMs=new Date(ae.date).getTime()+ae.hour*3600000;
        const key=order.id+':'+sub.id+':'+stage.id;
        const label=order.name+' — '+sub.name;
        const time=stage.start+' '+fmtHM(sh)+' – '+ae.date+' '+fmtHM(ae.hour);
        (byStage[stage.id]=byStage[stage.id]||[]).push({key,sMs,eMs,label,time});
      });
    });
  });
  Object.entries(byStage).forEach(([sid,arr])=>{
    /* Этапы со «вместимостью» — конфликт только если активных одновременно
       БОЛЬШЕ, чем доступный ресурс:
       • assembly → число участков сборки (S.assemblyStations).
       • design   → число конструкторов в справочнике (см. countDesigners). */
    let cap=null;
    if(sid==='assembly')cap=Math.max(1,S.assemblyStations||1);
    else if(sid==='design')cap=Math.max(1,countDesigners());
    if(cap!==null){
      /* Sweep-line по событиям start/end. При равных временах сначала end
         (стык без конфликта). Каждый раз когда active.size>cap — все пары
         в active помечаются как конфликтующие. */
      const events=[];
      arr.forEach((a,idx)=>{
        events.push({t:a.sMs,type:1,idx});
        events.push({t:a.eMs,type:0,idx});
      });
      events.sort((a,b)=>a.t-b.t||a.type-b.type);
      const active=new Set();
      const conflictPairs=new Set();
      for(const ev of events){
        if(ev.type===1){
          active.add(ev.idx);
          if(active.size>cap){
            const arrA=[...active];
            for(let i=0;i<arrA.length;i++){
              for(let j=i+1;j<arrA.length;j++){
                const a=arrA[i],b=arrA[j];
                conflictPairs.add(a<b?a+':'+b:b+':'+a);
              }
            }
          }
        }else{
          active.delete(ev.idx);
        }
      }
      conflictPairs.forEach(k=>{
        const [i,j]=k.split(':').map(Number);
        (out[arr[i].key]=out[arr[i].key]||[]).push({label:arr[j].label,time:arr[j].time});
        (out[arr[j].key]=out[arr[j].key]||[]).push({label:arr[i].label,time:arr[i].time});
      });
      return;
    }
    /* Остальные этапы — обычная попарная проверка пересечения */
    for(let i=0;i<arr.length;i++){
      for(let j=i+1;j<arr.length;j++){
        if(arr[i].sMs<arr[j].eMs&&arr[j].sMs<arr[i].eMs){
          (out[arr[i].key]=out[arr[i].key]||[]).push({label:arr[j].label,time:arr[j].time});
          (out[arr[j].key]=out[arr[j].key]||[]).push({label:arr[i].label,time:arr[i].time});
        }
      }
    }
  });
  return out;
}
/* Подсчёт «конструкторов» в справочнике сотрудников.
   Считаются роли: «конструктор», «технолог», «главный конструктор»
   (case-insensitive, с trim). Используется в findConflicts для этапа design:
   несколько одновременных design не конфликтуют, пока их не больше, чем
   зарегистрированных конструкторов. */
const _DESIGNER_ROLES=new Set(['конструктор','технолог','главный конструктор']);
function countDesigners(){
  return (S.employees||[]).filter(e=>_DESIGNER_ROLES.has((e.role||'').toLowerCase().trim())).length;
}
function stageStartDt(stage){
  const sh=stage.startHour!=null?stage.startHour:S.workStart;
  const d=new Date(stage.start);d.setHours(Math.floor(sh),Math.round((sh%1)*60),0,0);return d;
}
function stageEndDt(stage){
  const sh=stage.startHour!=null?stage.startHour:S.workStart;
  const dh=stageDurH(stage);
  const ws=S.workStart,we=S.workEnd,ls=S.lunchStart,le=S.lunchEnd;
  // use calcStageSegments with a dummy wdays to get last segment end
  const fakeWdays=[];let d=new Date(stage.start);
  for(let i=0;i<14;i++){if(!isWE(d))fakeWdays.push(dk(d));d=calAdd(d,1);}
  const segs=calcStageSegments(sh,dh,ws,we,ls,le,0,fakeWdays);
  if(!segs.length){const s=stageStartDt(stage);return new Date(s.getTime()+dh*3600000);}
  const last=segs[segs.length-1];
  const dayDate=new Date(fakeWdays[last.di]);
  dayDate.setHours(Math.floor(last.endH),Math.round((last.endH%1)*60),0,0);
  return dayDate;
}
function calcOrderProgress(order){
  const NOW=new Date();
  let totalH=0,doneH=0;
  const activeStages=[];
  order.suborders.forEach(sub=>{
    sub.stages.forEach(stage=>{
      if(EXCL_PROGRESS.has(stage.id))return;
      const dh=computeStageDurH(stage,sub);
      const ss=stageStartDt(stage),se=stageEndDt(stage);
      totalH+=dh;
      if(se<=NOW){doneH+=dh;}
      else if(ss<NOW){
        doneH+=(NOW-ss)/3600000;
        activeStages.push({def:STAGE_DEFS.find(s=>s.id===stage.id),stage,sub});
      }
    });
  });
  const pct=totalH>0?Math.min(100,Math.round(doneH/totalH*100)):0;
  return{pct,activeStages,totalH,doneH};
}
function checkAssemblyReady(order,sub){
  /* Returns null if OK, or error message string.
     Checks prerequisites within the given sub only — each product gets its
     own go-ahead independently. If sub is omitted, falls back to checking
     all subs (legacy behaviour). */
  const subs=sub?[sub]:order.suborders;
  const missing=[];
  ASSEMBLY_PREREQS.forEach(pid=>{
    let needed=false,allDone=true;
    subs.forEach(s=>{
      s.stages.filter(x=>x.id===pid).forEach(x=>{
        needed=true;
        if(x.status!=='done')allDone=false;
      });
    });
    if(needed&&!allDone)missing.push(STAGE_DEFS.find(s=>s.id===pid)?.lbl||pid);
  });
  return missing.length?'Нельзя изменить статус Сборки: не завершены — '+missing.join(', '):null;
}

/* ── Hour helpers ── */
function isOT(h){return h<S.workStart||h>=S.workEnd}

/* Split stage hours across work days skipping lunch and end-of-day */
function calcStageSegments(startH,durH,ws,we,ls,le,startDi,wdays){
  const segs=[];
  let remaining=durH;
  let curDi=startDi;
  let curH=Math.max(startH,ws);
  while(remaining>0.01){
    if(curDi>=wdays.length)break;
    // skip lunch if landed inside it
    if(curH>=ls&&curH<le)curH=le;
    // past work end → next work day
    if(curH>=we){curDi++;curH=ws;continue;}
    // available until next break (lunch or end of day)
    const nextBreak=curH<ls?ls:we;
    const avail=nextBreak-curH;
    if(avail<0.01){curH=(nextBreak===ls)?le:we;if(curH>=we){curDi++;curH=ws;}continue;}
    const take=Math.min(remaining,avail);
    segs.push({di:curDi,startH:curH,endH:curH+take});
    remaining-=take;
    curH+=take;
    // hit lunch → skip to after lunch
    if(Math.abs(curH-ls)<0.01)curH=le;
    // hit work end → next day
    if(curH>=we){curDi++;curH=ws;}
  }
  return segs;
}

function fmtHM(h){const hh=Math.floor(h),mm=Math.round((h%1)*60);return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')}

/* Working hours between two timestamps. Skips weekends, before workStart,
   after workEnd, and lunch. Used by attachDayResize to translate the bar's
   right edge (in calendar pixels) into a correct durationHours value. */
function workingHoursBetween(d1,h1,d2,h2){
  const a=new Date(d1),b=new Date(d2);
  if(b<a||(dk(a)===dk(b)&&h2<=h1)) return 0;
  const ws=S.workStart,we=S.workEnd,ls=S.lunchStart,le=S.lunchEnd;
  let hours=0,d=new Date(a),h=h1;
  for(let safety=0;safety<3650;safety++){
    while(isWE(d)){d=calAdd(d,1);h=ws;}
    const sameDay=dk(d)===dk(b);
    const segEnd=sameDay?Math.min(h2,we):we;
    const segStart=Math.max(h,ws);
    let work=Math.max(0,segEnd-segStart);
    const lunchOverlap=Math.max(0,Math.min(segEnd,le)-Math.max(segStart,ls));
    work-=lunchOverlap;
    hours+=Math.max(0,work);
    if(sameDay) return hours;
    d=calAdd(d,1);h=ws;
  }
  return hours;
}

function getWorkDays(){
  const set=new Set();
  S.orders.forEach(o=>{
    o.suborders.forEach(sub=>{
      sub.stages.forEach(st=>{
        if(!stageVis(st.id,st.status)&&(S.filterStages.length||S.filterStatus.length))return;
        let d=new Date(st.start);const end=new Date(st.end);
        while(d<end){if(!isWE(d))set.add(dk(d));d=calAdd(d,1)}
        /* add extra days for potential overflow (excluding lunch) */
        const def=STAGE_DEFS.find(s=>s.id===st.id);
        const sh=st.startHour!=null?st.startHour:S.workStart;
        const dh=st.durationHours||Math.max(1,def.wd*(S.workEnd-S.workStart));
        const lunchLen=S.lunchEnd-S.lunchStart;
        const hoursPerDay=Math.max(0.5,S.workEnd-S.workStart-lunchLen);
        const effStart=Math.max(sh,S.workStart);
        const morn=Math.max(0,Math.min(S.lunchStart,S.workEnd)-effStart);
        const aftn=Math.max(0,S.workEnd-Math.max(effStart,S.lunchEnd));
        const availToday=morn+aftn;
        if(dh>availToday){
          const extraDays=Math.ceil((dh-availToday)/hoursPerDay)+1;
          let d2=new Date(st.start);
          for(let i=0;i<extraDays+1;i++){d2=calAdd(d2,1);if(!isWE(d2))set.add(dk(d2));}
        }
      });
    });
  });
  return Array.from(set).sort();
}

   RANGE
══════════════════════════════════════════════ */
function getRange(){
  let mn=new Date(2099,0,1),mx=new Date(2000,0,1);
  S.orders.forEach(o=>{
    o.suborders.forEach(sub=>{
      if(!sub.stages.length)return;
      const a=new Date(sub.stages[0].start);
      const b=new Date(sub.stages[sub.stages.length-1].end);
      if(a<mn)mn=a;if(b>mx)mx=b;
    });
    const dl=deadlineDate(o.deadline,o.start);
    if(dl&&dl>mx)mx=dl;
  });
  if(mn>mx){mn=TODAY;mx=calAdd(TODAY,30)}
  return{min:calAdd(mn,-4),max:calAdd(mx,8)};
}
function dX(d,rng){
  /* Sum of day widths from rng.min to (date) — non-linear shrink of weekends. */
  const tgt=dk(d);
  let x=0,cur=new Date(rng.min);
  for(let i=0;i<3650;i++){
    if(dk(cur)===tgt)return x;
    x+=dayWidthFor(cur);cur=calAdd(cur,1);
  }
  return x;
}
function tW(rng){
  let x=0,cur=new Date(rng.min);const max=new Date(rng.max);
  for(let i=0;i<3650;i++){if(cur>max)break;x+=dayWidthFor(cur);cur=calAdd(cur,1);}
  return x;
}

  if(S.view==='kanban'){
    /* Зум ширины колонки */
    const cw=el('div','zg');
    const cwm=el('button','btn ic sm');cwm.textContent='−';
    cwm.title='Уже колонка';
    cwm.onclick=()=>{updateKbColW(S.kbColW-20);render()};
    const cwl=tx('span','zl',S.kbColW+'px');
    const cwp=el('button','btn ic sm');cwp.textContent='+';
    cwp.title='Шире колонка';
    cwp.onclick=()=>{updateKbColW(S.kbColW+20);render()};
    cw.appendChild(cwm);cw.appendChild(cwl);cw.appendChild(cwp);hdr.appendChild(cw);
    /* Зум высоты/размера карточки */
    const ch=el('div','zg');
    const chm=el('button','btn ic sm');chm.textContent='−';
    chm.title='Компактнее карточка';
    chm.onclick=()=>{updateKbCardScale(S.kbCardScale-0.1);render()};
    const chl=tx('span','zl',Math.round(S.kbCardScale*100)+'%');
    const chp=el('button','btn ic sm');chp.textContent='+';
    chp.title='Крупнее карточка';
    chp.onclick=()=>{updateKbCardScale(S.kbCardScale+0.1);render()};
    ch.appendChild(chm);ch.appendChild(chl);ch.appendChild(chp);hdr.appendChild(ch);
    const btnNew=el('button','btn pr');btnNew.innerHTML='＋ Заказ';
    btnNew.onclick=()=>openModal({type:'new',name:'',client:'',start:dk(TODAY),
      kbCol:'new',dlMode:'date',dlDate:'',dlDays:'',readiness:'ready',
      subs:[{name:'Основное изделие',sel:STAGE_DEFS.map(s=>s.id).filter(id=>id!=='finishing'&&id!=='painting'),qty:{sheets:0,edgeMeters:0,parts:0}}]});
    hdr.appendChild(btnNew);
  }
  /* Conflict counter (clickable: shows full list) */
  if(S.view==='gantt'){
    const cf=findConflicts();
    const keys=Object.keys(cf);
    if(keys.length){
      const btnCf=el('button','btn sm');
      btnCf.style.cssText='background:rgba(248,81,73,.15);color:#f85149;border:1px solid #f85149;font-weight:600';
      btnCf.innerHTML='⚠ Конфликты: '+keys.length;
      btnCf.title='Одинаковые этапы пересекаются по времени. Нажмите для списка.';
      btnCf.onclick=()=>{
        const lines=keys.map(k=>{
          const [oid,sid,stid]=k.split(':').map(x=>x);
          const o=S.orders.find(x=>x.id==oid);
          const s=o&&o.suborders.find(x=>x.id==sid);
          const def=STAGE_DEFS.find(x=>x.id===stid);
          const others=cf[k].map(c=>'    • '+c.label+' ('+c.time+')').join('\n');
          return '• '+def.lbl+' — '+(o?o.name:'?')+' › '+(s?s.name:'?')+':\n'+others;
        }).join('\n\n');
        alert('Конфликты планирования ('+keys.length+'):\n\n'+lines);
      };
      hdr.appendChild(btnCf);
    }
  }
  root.appendChild(hdr);

  /* STATS */
  const sb=el('div','stats');
  const allStages=S.orders.flatMap(o=>o.suborders.flatMap(s=>s.stages));
  [
    {val:S.orders.length,lbl:'Заказов',c:'#58a6ff'},
    {val:S.orders.reduce((a,o)=>a+o.suborders.length,0),lbl:'Изделий',c:'#bc8cff'},
    {val:allStages.length,lbl:'Этапов',c:'#e3b341'},
    {val:allStages.filter(s=>s.status==='done').length,lbl:'Готово',c:'#3fb950'},
  ].forEach(st=>{
    const c=el('div','stat');const v=tx('div','sv',String(st.val));v.style.color=st.c;
    c.appendChild(v);c.appendChild(tx('div','sl',st.lbl));sb.appendChild(c);
  });
  root.appendChild(sb);

  /* FILTER BAR */
  const fb=el('div','fbar');
  fb.appendChild(tx('span','flbl','Этап:'));
  const fch=el('div','chips');
  STAGE_DEFS.forEach(def=>{
    const on=S.filterStages.includes(def.id);
    const chip=el('button','chip'+(on?' on':''));if(on)chip.style.background=def.color;
    const dot=el('span','cdot');dot.style.background=on?'#0d1117':def.color;
    chip.appendChild(dot);chip.appendChild(document.createTextNode(def.lbl));
    chip.onclick=()=>{S.filterStages=S.filterStages.includes(def.id)?S.filterStages.filter(x=>x!==def.id):[...S.filterStages,def.id];render()};
    fch.appendChild(chip);
  });
  fb.appendChild(fch);fb.appendChild(el('div','csep'));
  fb.appendChild(tx('span','flbl','Статус:'));
  const sch=el('div','chips');sch.style.flex='0 0 auto';
  Object.entries(STAT_MAP).forEach(([k,v])=>{
    const on=S.filterStatus.includes(k);
    const chip=el('button','chip'+(on?' on':''));if(on)chip.style.background=STAT_COLORS[k];
    const dot=el('span','cdot');dot.style.background=on?'#0d1117':STAT_COLORS[k];
    chip.appendChild(dot);chip.appendChild(document.createTextNode(v.lbl));
    chip.onclick=()=>{S.filterStatus=S.filterStatus.includes(k)?S.filterStatus.filter(x=>x!==k):[...S.filterStatus,k];render()};
    sch.appendChild(chip);
  });
  fb.appendChild(sch);
  const totF=S.filterStages.length+S.filterStatus.length;
  if(totF>0){
    fb.appendChild(tx('span','fbadge',totF+' фильтр'+(totF===1?'':'а')));
    const c=el('button','clr-btn');c.textContent='✕ Сбросить';c.onclick=()=>{S.filterStages=[];S.filterStatus=[];render()};fb.appendChild(c);
  }
  root.appendChild(fb);

  /* SPEEDS PANEL */
  const sp=el('div','speeds-panel');
  [
    {id:'cutting',  color:'#e3b341', lbl:'Раскрой',     fields:[{key:'sheetsPerHour',label:'Скорость',unit:'л/ч',   min:1,   max:9999}]},
    {id:'edging',   color:'#bc8cff', lbl:'Кромкование',  fields:[{key:'mPerMin',      label:'Скорость',unit:'м/мин', min:0.1, max:999, step:'0.1'}]},
    {id:'drilling', color:'#ffa657', lbl:'Присадка',     fields:[{key:'secPerPart',   label:'Время',   unit:'с/дет', min:1,   max:9999}]},
  ].forEach(cfg=>{
    const sec=el('div','sp-section');
    const dot=el('div','sp-dot');dot.style.background=cfg.color;sec.appendChild(dot);
    sec.appendChild(tx('span','sp-label',cfg.lbl+':'));
    cfg.fields.forEach(f=>{
      const fw=el('div','sp-field');
      fw.appendChild(tx('label','',f.label));
      const inp=document.createElement('input');inp.type='number';inp.className='sp-input';
      inp.min=f.min;inp.max=f.max;if(f.step)inp.step=f.step;
      inp.value=S.speeds[cfg.id][f.key];
      inp.title=cfg.lbl+' — '+f.label+' ('+f.unit+')';
      inp.oninput=e=>{S.speeds[cfg.id][f.key]=Math.max(+f.min||0,+e.target.value||+f.min)};
      /* On commit (Enter / blur) recompute durations for all stages of this
         speed's stage type so the new calculator value propagates everywhere. */
      inp.onchange=()=>{
        S.orders.forEach(o=>o.suborders.forEach(sub=>{
          sub.stages.forEach(st=>{
            if(st.id===cfg.id) st.durationHours=computeDefaultDurH(st.id,sub.qty);
          });
        }));
        recomputeAllOrders();
        render();
      };
      fw.appendChild(inp);fw.appendChild(tx('span','sp-unit',f.unit));sec.appendChild(fw);
    });
    sp.appendChild(sec);
  });
  root.appendChild(sp);

  /* delivery markers note in speeds panel */
  const dlLegend=el('div','sp-section');
  dlLegend.style.gap='10px';
  [{color:'#3fb950',lbl:'▌ Материалы'},{color:'#bc8cff',lbl:'▌ Фурнитура'}].forEach(({color,lbl})=>{
    const item=el('div','sp-field');
    const bar=el('div','');bar.style.cssText=`width:4px;height:14px;background:${color};border-radius:2px;flex-shrink:0`;
    item.appendChild(bar);item.appendChild(tx('span','sp-label',lbl));dlLegend.appendChild(item);
  });
  const dlNote=tx('span','sp-label','— даты поставки (в этапе Закупка)');dlLegend.appendChild(dlNote);
  sp.appendChild(dlLegend);

  const main=el('div','main');
  if(S.view==='gantt')renderGantt(main);
  else renderKanban(main);
  root.appendChild(main);
  if(S.modal)renderModal(root);
  /* Viewport handling: scrollToToday on first render or after order creation,
     otherwise restore the saved center date to the viewport center under the
     new scale. */
  if(S.view==='gantt'){
    const newRng=getRange();
    const newRp=document.querySelector('.rp');
    const lpRows=document.querySelector('.lp-rows');
    if(S._scrollToToday){
      S._scrollToToday=false;
      requestAnimationFrame(scrollToToday);
    } else if(S._scrollToOrderId!=null){
      const oid=S._scrollToOrderId;
      S._scrollToOrderId=null;
      requestAnimationFrame(()=>scrollToOrder(oid));
    } else if(_vp&&newRp&&(!!S.modal)!==(!!S._lastModalOpen)){
      /* Открытие/закрытие модалки: данные не менялись, шкала та же.
         Восстанавливаем scrollLeft НАПРЯМУЮ из снимка, без перерасчёта
         через дату-под-центром (любой layout-шифт от модалки игнорируется). */
      newRp.scrollLeft=_vp.scrollLeft||0;
      newRp.scrollTop=_vp.scrollTop||0;
      if(lpRows)lpRows.scrollTop=_vp.scrollTop||0;
    } else if(_vp&&newRp&&_vp.dayW===S.dayW){
      /* Зум не менялся — оставляем шкалу НЕПОДВИЖНОЙ. Просто восстанавливаем
         тот же scrollLeft в пикселях, что был до render. Любые изменения
         данных (drag этапа, новый заказ, изменение полей) НЕ дёргают
         таймлайн. Пользователь сам решит — прокрутить вручную или нет. */
      newRp.scrollLeft=_vp.scrollLeft||0;
      newRp.scrollTop=_vp.scrollTop||0;
      if(lpRows)lpRows.scrollTop=_vp.scrollTop||0;
    } else if(_vp&&_vp.centerDate&&newRp){
      /* Только при смене зума — удерживаем дату-под-центром. */
      const centerDate=new Date(_vp.centerDate);
      const clamped=centerDate<newRng.min?newRng.min:(centerDate>newRng.max?newRng.max:centerDate);
      const newCenterX=dX(clamped,newRng)+dayWidthFor(clamped)/2;
      const curW=newRp.clientWidth||_vp.clientW;
      newRp.scrollLeft=Math.max(0,newCenterX-curW/2);
      newRp.scrollTop=_vp.scrollTop||0;
      if(lpRows)lpRows.scrollTop=_vp.scrollTop||0;
    }
    /* Synchronize vertical scrolling between LP rows and RP timeline.
       Row heights are paired (order=63, sub=51, stage=42), so scrollTop
       maps directly. Horizontal scroll of RP is independent. */
    if(newRp&&lpRows){
      let syncing=false;
      const sync=(src,dst)=>{
        if(syncing)return;
        syncing=true;
        dst.scrollTop=src.scrollTop;
        requestAnimationFrame(()=>{syncing=false});
      };
      lpRows.addEventListener('scroll',()=>sync(lpRows,newRp));
      newRp.addEventListener('scroll',()=>sync(newRp,lpRows));
    }
    S._lastRng={min:dk(newRng.min),max:dk(newRng.max)};
    S._lastDayW=S.dayW;
    S._lastModalOpen=!!S.modal;
  }
}

/* Auto-save wrapper над render(). После каждого UI-рендера сравниваем
   состояние S.orders с last-known snapshot, помечаем грязные/удалённые
   и шлём в БД с дебаунсом. Не трогает рендер-логику. */
const _origRender=render;
render=function(){
  _origRender();
  detectChanges();
  if(_dirty.size||_deleted.size||_supDirty.size||_supDeleted.size||_cliDirty.size||_cliDeleted.size||_empDirty.size||_empDeleted.size||_settingsDirty)scheduleSave();
};

/* ══════════════════════════════════════════════
   GANTT VIEW
══════════════════════════════════════════════ */
function stageVis(id,status){
  return(S.filterStages.length===0||S.filterStages.includes(id))
      &&(S.filterStatus.length===0||S.filterStatus.includes(status));
}

function renderGantt(main){
  const rng=getRange(),tw=tW(rng),days=Math.round((rng.max-rng.min)/86400000)+1;
  const conflicts=findConflicts();
  S._conflicts=conflicts;
  const wrap=el('div','gantt-wrap');
  const lp=el('div','lp'),rp=el('div','rp');
  lp.appendChild(tx('div','lp-head','Заказы / Изделия / Этапы'));
  const lpR=el('div','lp-rows');lp.appendChild(lpR);

  /* timeline header */
  const tlH=el('div','tl-head'),tlI=el('div','tl-inner');tlI.style.width=tw+'px';
  let cur=new Date(rng.min);
  while(cur<=rng.max){
    const ms=new Date(cur),nm=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    const xStart=dX(ms,rng);
    const monthEnd=new Date(Math.min(nm,calAdd(rng.max,1)));
    // width = dX(monthEnd) - dX(monthStart) — accounts for non-linear scale
    let xEnd;
    if(monthEnd<=rng.max){xEnd=dX(monthEnd,rng)}
    else{xEnd=tw}
    const mc=el('div','mcell');mc.style.left=xStart+'px';mc.style.width=(xEnd-xStart)+'px';
    mc.textContent=ms.toLocaleDateString('ru-RU',{month:'short',year:'2-digit'}).toUpperCase();
    tlI.appendChild(mc);cur=new Date(nm);
  }
  const hourMode=isHourMode();
  let xCur=0;
  for(let i=0;i<days;i++){
    const d=calAdd(rng.min,i);
    const dW_i=dayWidthFor(d);
    const dc=el('div','dcell');
    const dIso=dk(d);
    if(isWE(d))dc.classList.add('we');
    if(dIso===dk(TODAY))dc.classList.add('tod');
    if(d.getDay()===6){
      // Saturday: clickable, opens per-date working-toggle modal
      dc.classList.add('sat-toggle');
      if(isWorkingSat(d))dc.classList.add('sat-on');
      dc.title=isWorkingSat(d)?'Суббота отмечена рабочей. Нажмите, чтобы изменить.':'Суббота выходная. Нажмите, чтобы сделать рабочей.';
      dc.style.cursor='pointer';
      dc.onclick=ev=>{ev.stopPropagation();openModal({type:'satToggle',date:dIso})};
    }
    dc.style.left=xCur+'px';dc.style.width=dW_i+'px';
    if(dW_i>=22)dc.textContent=d.getDate();
    tlI.appendChild(dc);
    // hour ticks for working hours only, on weekdays, when zoom is large enough
    if(hourMode&&!isWE(d)){
      for(let h=S.workStart;h<S.workEnd;h++){
        const hcLeft=xCur+hourOffsetIn(d,h);
        const hcW=hourOffsetIn(d,h+1)-hourOffsetIn(d,h);
        const hc=el('div','hcell');
        hc.style.cssText=`position:absolute;top:18px;left:${hcLeft}px;width:${hcW}px;height:14px;`
          +`font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3);text-align:left;`
          +`border-left:1px solid var(--border);box-sizing:border-box;padding-left:2px;pointer-events:none`;
        if(hcW>=22||h%2===0)hc.textContent=h+':00';
        tlI.appendChild(hc);
      }
    }
    xCur+=dW_i;
  }
  tlH.appendChild(tlI);rp.appendChild(tlH);

  const body=el('div','gbody');body.style.width=tw+'px';
  let xCur2=0;
  for(let i=0;i<days;i++){
    const d=calAdd(rng.min,i);
    const dW_i=dayWidthFor(d);
    if(isWE(d)){const b=el('div','gbg-we');b.style.left=xCur2+'px';b.style.width=dW_i+'px';body.appendChild(b)}
    else{
      const l=el('div','gbg-ln');l.style.left=xCur2+'px';body.appendChild(l);
      if(hourMode){
        // off-hours background (compressed)
        if(S.workStart>0){
          const offW=hourOffsetIn(d,S.workStart);
          const o=el('div','');o.style.cssText=`position:absolute;top:0;bottom:0;left:${xCur2}px;width:${offW}px;background:var(--bg3);opacity:.35;pointer-events:none`;body.appendChild(o);
        }
        if(S.workEnd<24){
          const offX=hourOffsetIn(d,S.workEnd);
          const offW=dW_i-offX;
          const o=el('div','');o.style.cssText=`position:absolute;top:0;bottom:0;left:${xCur2+offX}px;width:${offW}px;background:var(--bg3);opacity:.35;pointer-events:none`;body.appendChild(o);
        }
        // lunch background (full-scale)
        const lX=hourOffsetIn(d,S.lunchStart);
        const lW=hourOffsetIn(d,S.lunchEnd)-lX;
        if(lW>0){const ol=el('div','');ol.style.cssText=`position:absolute;top:0;bottom:0;left:${xCur2+lX}px;width:${lW}px;background:var(--warn-bg);pointer-events:none`;body.appendChild(ol)}
      }
    }
    xCur2+=dW_i;
  }
  if(TODAY>=rng.min&&TODAY<=rng.max){const tl=el('div','g-today');tl.style.left=dX(TODAY,rng)+'px';body.appendChild(tl)}

  const hasF=S.filterStages.length>0||S.filterStatus.length>0;

  /* show only orders whose kanban status is 'inwork' or later, excluding 'delivered' */
  ganttVisibleOrders().forEach(order=>{
    const coll=!!S.collapsed['o'+order.id];
    // gather all visible stages
    const visSubStages=order.suborders.map(sub=>sub.stages.filter(s=>stageVis(s.id,s.status)));
    const hasAny=visSubStages.some(ss=>ss.length>0);
    if(hasF&&!hasAny)return;

    // LP order row
    addLPOrder(lpR,order,coll);

    // Gantt order row
    const gor=el('div','g-order');gor.style.width=tw+'px';
    const dlD=deadlineDate(order.deadline,order.start);
    /* paint/finish left stripe */
    const {hasPainting,hasFinishing}=hasPaintFinish(order);
    if(hasPainting||hasFinishing){
      const stripe=el('div','g-order-pf');
      if(hasPainting&&hasFinishing)stripe.style.background='linear-gradient(to bottom,#f778ba,#fb923c)';
      else stripe.style.background=hasPainting?'#fb923c':'#f778ba';
      gor.appendChild(stripe);
    }
    // span across all suborders
    let allStarts=[],allVisEnds=[];
    order.suborders.forEach(sub=>{
      if(sub.stages.length){
        allStarts.push(new Date(sub.stages[0].start));
        allVisEnds.push(stageVisEnd(sub.stages[sub.stages.length-1]));
      }
    });
    if(allStarts.length){
      const fs=new Date(Math.min(...allStarts)),le=new Date(Math.max(...allVisEnds));
      const sp=el('div','g-order-span');sp.style.left=dX(fs,rng)+'px';sp.style.width=(dX(le,rng)-dX(fs,rng))+'px';gor.appendChild(sp);
      const lb=el('div','g-order-lbl');
      const lastWDLabel=prevWork(calAdd(le,-1));
      lb.appendChild(document.createTextNode(order.name+' · '+fmtS(fs)+'→'+fmtS(lastWDLabel)));
      if(dlD){
        const dlSt=deadlineStatus(order);
        const dlC=dlSt==='over'?'#f85149':dlSt==='warn'?'#d29922':'#58a6ff';
        const dlSpan=el('span','');dlSpan.style.cssText=`color:${dlC};font-family:'JetBrains Mono',monospace;font-size:10px`;
        dlSpan.textContent='⚑ '+(order.deadline.mode==='days'?order.deadline.value+'р.д.':fmtS(dlD));
        lb.appendChild(dlSpan);
        // deadline vertical line inside row
        if(dlD>=rng.min&&dlD<=rng.max){
          const dll=el('div','dl-line');dll.style.left=dX(dlD,rng)+'px';dll.style.borderColor=dlC;gor.appendChild(dll);
          const dlf=el('div','dl-flag');dlf.style.left=dX(dlD,rng)+'px';dlf.style.color=dlC;dlf.textContent='⚑';gor.appendChild(dlf);
        }
      }
      gor.appendChild(lb);
    }
    /* order start marker — vertical line + ▶ flag at order.start */
    {
      const osD=new Date(order.start);
      if(osD>=rng.min&&osD<=rng.max){
        const ox=dX(osD,rng);
        const osl=el('div','os-line');osl.style.left=ox+'px';
        osl.title='Дата создания заказа — '+fmtF(osD);
        gor.appendChild(osl);
        const osf=el('div','os-flag');osf.style.left=ox+'px';osf.textContent='▶';
        osf.title=osl.title;
        gor.appendChild(osf);
      }
    }
    /* progress overlay (always shown, even when expanded) */
    const {pct,activeStages}=calcOrderProgress(order);
    const progBar=el('div','g-order-prog');
    progBar.style.width=pct+'%';gor.appendChild(progBar);
    /* active stages + % shown only when collapsed */
    if(coll){
      const activeDiv=el('div','g-order-active');
      if(activeStages.length){
        activeStages.slice(0,3).forEach(({def})=>{
          const chip=el('span','g-stage-chip');
          chip.style.background=def.color;chip.textContent=def.lbl;activeDiv.appendChild(chip);
        });
      }
      const pctSpan=tx('span','g-order-pct',pct+'%');activeDiv.appendChild(pctSpan);
      gor.appendChild(activeDiv);
    }
    body.appendChild(gor);
    if(coll){return;}

    /* === Order-level purchasing row (LP + RP) === */
    ensureOrderPurchasing(order);
    const ps=order.purchasing;
    /* Закупка скрыта пользователем (например, материал уже на складе) —
       полностью пропускаем строку и маркеры. Можно вернуть через кнопку
       в карточке заказа. */
    if(ps&&ps.disabled){
      /* Показываем тонкую плашку с кнопкой восстановления вместо бара.
         Это страховка от случайного удаления — пользователь сразу видит,
         что закупка отключена, и может её вернуть в один клик. */
      const lpRow=el('div','lp-stage');
      lpRow.style.cssText='opacity:.55;background:transparent';
      lpRow.appendChild(tx('span','','🛒'));
      lpRow.appendChild(tx('span','','Закупка отключена'));
      const restoreBtn=el('button','btn ic sm');restoreBtn.textContent='↺';restoreBtn.title='Восстановить закупку';
      restoreBtn.style.cssText='margin-left:auto;color:var(--accent)';
      restoreBtn.onclick=e=>{
        e.stopPropagation();
        if(!confirm('Восстановить закупку? Все ранее введённые поставки и категории сохранены.'))return;
        ps.disabled=false;
        render();
      };
      lpRow.appendChild(restoreBtn);
      lpR.appendChild(lpRow);
      const stubRow=el('div','g-stage');stubRow.style.width=tw+'px';stubRow.style.opacity='.35';
      body.appendChild(stubRow);
    }
    if(ps&&!ps.disabled){
    addLPPurchasing(lpR,order);
    /* RP row matches lp-stage height; bar uses materials colour */
    const gpr=el('div','g-stage');gpr.style.width=tw+'px';
    {
      const psStart=new Date(ps.start);
      const psEnd=stageVisEnd(ps);
      if(psEnd>rng.min&&psStart<rng.max){
        const def=STAGE_DEFS.find(d=>d.id==='materials');
        const x=dX(psStart,rng),w=Math.max(8,dX(psEnd,rng)-x);
        const bar=el('div','gbar gbar-purch'+(ps.status==='done'?' gbar-done':''));
        bar.style.left=x+'px';bar.style.width=w+'px';
        bar.style.background=ps.status==='blocked'?'#f85149':def.color;
        bar.title='🛒 Закупка · '+STAT_MAP[ps.status||'pending'].lbl
          +' · поставок: '+((ps.deliveries||[]).length);
        bar.textContent='🛒 Закупка';
        bar.onclick=e=>{e.stopPropagation();openModal({type:'editPurchasing',orderId:order.id})};
        gpr.appendChild(bar);
        /* one marker per delivery entry, glyph = supplier.tag (or type icon) */
        const TYPE_ICON={mat:'📦',hw:'🔧',paint:'🎨'};
        const TYPE_LBL={mat:'Пильный материал',hw:'Фурнитура',paint:'Материалы для покраски'};
        const customMap={};
        (ps.customTypes||[]).forEach(ct=>{customMap[ct.id]={lbl:ct.lbl,icon:ct.icon||'📋'}});
        const tIcon=(t)=>TYPE_ICON[t]||(customMap[t]&&customMap[t].icon)||'📋';
        const tLbl=(t)=>TYPE_LBL[t]||(customMap[t]&&customMap[t].lbl)||'Поставка';
        /* Один маркер на одну запись доставки. Группируем по дате, чтобы
           при нескольких поставках в один день они складывались в стопку,
           которая раздвигается веером при hover (тогда можно кликнуть на
           конкретную). */
        const buildMarker=(d)=>{
          const sup=(S.suppliers||[]).find(s=>s.id===d.supplierId);
          const mk=el('div','g-purch-mk');
          if(sup&&sup.logoDataUrl){
            mk.style.width='22px';mk.style.height='22px';mk.style.padding='0';
            mk.style.background='#fff';mk.style.borderRadius='4px';
            mk.style.border='1px solid '+(sup.color||'var(--border2)');
            mk.style.overflow='hidden';mk.style.boxShadow='0 1px 3px rgba(0,0,0,.5)';
            const img=document.createElement('img');
            img.src=sup.logoDataUrl;img.alt=sup.name;
            img.style.cssText='width:100%;height:100%;object-fit:cover;display:block;pointer-events:none';
            mk.appendChild(img);
          }else if(sup){
            mk.style.background=sup.color;mk.style.color='#fff';
            mk.style.borderRadius='3px';mk.style.fontSize='9px';mk.style.fontWeight='700';
            mk.style.padding='1px 3px';mk.style.lineHeight='1';
            mk.textContent=sup.tag||tIcon(d.type);
          }else{
            mk.textContent=tIcon(d.type);
          }
          if(d.delivered&&d.receivedBy){
            const chk=el('div','');
            chk.style.cssText='position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#3fb950;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;border:1.5px solid var(--bg);pointer-events:none';
            chk.textContent='✓';
            mk.style.position='relative';mk.style.overflow='visible';
            mk.appendChild(chk);
          }
          mk.title=tLbl(d.type)+': '+fmtS(new Date(d.date))
            +(sup?' · поставщик: '+sup.name:'')
            +(d.fileName?' · файл: '+d.fileName:'')
            +(d.notes?' · '+d.notes:'');
          mk.onclick=e=>{e.stopPropagation();openModal({type:'viewDelivery',orderId:order.id,deliveryId:d.id})};
          mk.style.cursor='pointer';
          return mk;
        };
        /* Группируем по дате */
        const byDate=new Map();
        (ps.deliveries||[]).forEach(d=>{
          if(!d.date)return;
          const dd=new Date(d.date);
          if(dd<rng.min||dd>rng.max)return;
          if(!byDate.has(d.date))byDate.set(d.date,[]);
          byDate.get(d.date).push(d);
        });
        byDate.forEach((items,dateKey)=>{
          const dd=new Date(dateKey);
          const stack=el('div','g-purch-stack');
          stack.style.left=dX(dd,rng)+'px';
          items.forEach(d=>stack.appendChild(buildMarker(d)));
          if(items.length>1){
            stack.title='Поставок в этот день: '+items.length+' — наведите, чтобы выбрать';
            const badge=el('div','g-purch-stack-badge');
            badge.textContent='+'+(items.length-1);
            stack.style.position='absolute';
            stack.appendChild(badge);
          }
          gpr.appendChild(stack);
        });
      }
    }
    body.appendChild(gpr);
    }  /* end if(ps&&!ps.disabled) */

    // suborders
    order.suborders.forEach((sub,si)=>{
      const subVis=sub.stages.filter(s=>stageVis(s.id,s.status));
      if(hasF&&subVis.length===0)return;
      const scoll=!!S.collapsed['s'+sub.id];

      // LP sub row
      addLPSub(lpR,order,sub,scoll);

      // Gantt sub row
      const gsr=el('div','g-sub');gsr.style.width=tw+'px';
      if(sub.stages.length){
        const fs=new Date(sub.stages[0].start);
        const visLE=stageVisEnd(sub.stages[sub.stages.length-1]);
        const sp=el('div','g-sub-span');sp.style.left=dX(fs,rng)+'px';sp.style.width=(dX(visLE,rng)-dX(fs,rng))+'px';gsr.appendChild(sp);
        const lb=tx('div','g-sub-lbl',sub.name+' '+fmtS(fs)+'→'+fmtS(prevWork(calAdd(visLE,-1))));gsr.appendChild(lb);
      }
      body.appendChild(gsr);
      if(scoll)return;

      // stages
      const wdaysCache=hourMode?getWorkDays():null;
      (hasF?subVis:sub.stages).forEach(stage=>{
        if(hasF&&!stageVis(stage.id,stage.status))return;
        const def=STAGE_DEFS.find(s=>s.id===stage.id);
        const dh=computeStageDurH(stage,sub);
        const sh=stage.startHour!=null?stage.startHour:S.workStart;
        let segs=null;
        if(hourMode){
          let di=wdaysCache.indexOf(stage.start);
          if(di<0){let d=new Date(stage.start);for(let k=0;k<14;k++){di=wdaysCache.indexOf(dk(d));if(di>=0)break;d=calAdd(d,1);}}
          if(di<0)di=0;
          segs=calcStageSegments(sh,dh,S.workStart,S.workEnd,S.lunchStart,S.lunchEnd,di,wdaysCache);
        }

        // LP stage row
        const lst=el('div','lp-stage');
        const dot=el('div','sdot');dot.style.background=def.color;lst.appendChild(dot);
        lst.appendChild(tx('span','slbl',def.lbl));
        const sbBtn=el('button','stat-btn');
        const sb=tx('span','badge '+STAT_MAP[stage.status].cls,STAT_MAP[stage.status].lbl);
        sbBtn.appendChild(sb);
        sbBtn.title='Изменить статус';
        sbBtn.onclick=e=>{e.stopPropagation();openModal({type:'quickStatus',orderId:order.id,subId:sub.id,stageId:stage.id,status:stage.status})};
        lst.appendChild(sbBtn);
        lst.onclick=()=>openModal({type:'editStageHour',orderId:order.id,subId:sub.id,stageId:stage.id,
          status:stage.status,note:stage.note,startHour:sh,durationHours:dh});
        lpR.appendChild(lst);

        // Gantt stage row
        const gr=el('div','g-stage');gr.style.width=tw+'px';
        const barColor=stage.status==='blocked'?'#f85149':def.color;
        const visE=stageVisEnd(stage);
        const stageKey=order.id+':'+sub.id+':'+stage.id;
        const isConflict=!!conflicts[stageKey];

        if(hourMode&&segs&&segs.length){
          // segmented bars, hour-precise (non-linear hour positions within day)
          segs.forEach((seg,sgI)=>{
            const segDateStr=wdaysCache[seg.di];
            const segDate=new Date(segDateStr);
            const baseX=dX(segDate,rng);
            const startOff=hourOffsetIn(segDate,seg.startH);
            const endOff=hourOffsetIn(segDate,seg.endH);
            const bx=baseX+startOff;
            const bw=Math.max(endOff-startOff,3);
            const isFirst=sgI===0,isLast=sgI===segs.length-1;
            const bar=el('div','gbar'+(stage.status==='done'?' gbar-done':'')+(isConflict?' gbar-conflict':''));
            bar.dataset.stageUid=stage.uid||(sub.id+':'+stage.id);
            bar.style.left=bx+'px';bar.style.width=bw+'px';bar.style.background=barColor;
            if(isFirst&&isLast)bar.style.borderRadius='5px';
            else if(isFirst)   bar.style.borderRadius='5px 0 0 5px';
            else if(isLast)    bar.style.borderRadius='0 5px 5px 0';
            else               bar.style.borderRadius='0';
            if(isFirst&&bw>32)bar.appendChild(tx('div','gbar-lbl',def.lbl+(segs.length>1?' ↩':'')));
            if(isFirst)appendAssigneesBadge(bar,stage);
            if(isLast){const rh=el('div','g-rh');bar.appendChild(rh);attachDayResize(bar,rh,order,sub,stage,rng);}
            if(isFirst)attachDayDrag(bar,bar.querySelector('.g-rh'),order,sub,stage,rng);
            bar.addEventListener('click',e=>{if(Math.abs(e.clientX-S._mx)>4)return;
              openModal({type:'editStageHour',orderId:order.id,subId:sub.id,stageId:stage.id,
                status:stage.status,note:stage.note,startHour:sh,durationHours:dh})});
            bar.addEventListener('mouseenter',e=>showTT(e,def,stage,order,sub,segs));
            bar.addEventListener('mousemove',moveTT);bar.addEventListener('mouseleave',hideTT);
            gr.appendChild(bar);
            // dashed connector to next segment
            if(!isLast){
              const nxt=segs[sgI+1];
              const nxtDate=new Date(wdaysCache[nxt.di]);
              const x2=dX(nxtDate,rng)+hourOffsetIn(nxtDate,nxt.startH);
              if(x2>bx+bw){
                const conn=el('div','');
                conn.style.cssText=`position:absolute;top:20px;left:${bx+bw}px;width:${x2-(bx+bw)}px;height:2px;`
                  +`background:repeating-linear-gradient(90deg,${barColor} 0,${barColor} 4px,transparent 4px,transparent 8px);`
                  +`pointer-events:none;z-index:3;opacity:.6`;
                gr.appendChild(conn);
              }
            }
          });
        } else {
          // simple day-mode bar; stage.end is already sync'd to real duration
          const sx=dX(new Date(stage.start),rng);
          const ex=dX(visE,rng);
          const bw=Math.max(ex-sx,4);
          const bar=el('div','gbar'+(stage.status==='done'?' gbar-done':'')+(isConflict?' gbar-conflict':''));
          bar.style.left=sx+'px';bar.style.width=bw+'px';bar.style.background=barColor;
          if(bw>32)bar.appendChild(tx('div','gbar-lbl',def.lbl));
          appendAssigneesBadge(bar,stage);
          const rh=el('div','g-rh');bar.appendChild(rh);
          attachDayDrag(bar,rh,order,sub,stage,rng);
          attachDayResize(bar,rh,order,sub,stage,rng);
          bar.addEventListener('click',e=>{if(Math.abs(e.clientX-S._mx)>4)return;
            openModal({type:'editStageHour',orderId:order.id,subId:sub.id,stageId:stage.id,
              status:stage.status,note:stage.note,startHour:sh,durationHours:dh})});
          bar.addEventListener('mouseenter',e=>showTT(e,def,stage,order,sub,null));
          bar.addEventListener('mousemove',moveTT);bar.addEventListener('mouseleave',hideTT);
          gr.appendChild(bar);
          // weekend stripes
          const wed=countWE(stage.start,dk(visE));
          if(wed>0){
            let d=new Date(stage.start),inSp=false,spS=null;
            const endD=new Date(visE);
            while(d<endD){
              if(isWE(d)){if(!inSp){inSp=true;spS=new Date(d)}}
              else if(inSp){addStripe(gr,dX(spS,rng),dX(d,rng),sx,sx+bw);inSp=false}
              d=calAdd(d,1);
            }
            if(inSp)addStripe(gr,dX(spS,rng),dX(d,rng),sx,sx+bw);
            const ol=el('div','we-ol');ol.style.left=sx+'px';ol.style.width=bw+'px';gr.appendChild(ol);
          }
        }

        /* delivery markers for materials stage (both modes) */
        if(stage.id==='materials'){
          [{date:stage.matDelivery,cls:'delivery-marker-mat',tip:'📦 Поставка материалов: '},
           {date:stage.hwDelivery, cls:'delivery-marker-hw', tip:'🔩 Поставка фурнитуры: '}]
          .forEach(({date,cls,tip})=>{
            if(!date)return;
            const md=new Date(date);
            if(md<rng.min||md>rng.max)return;
            const mk=el('div','delivery-marker '+cls);
            mk.style.left=dX(md,rng)+'px';mk.title=tip+fmtF(date);
            gr.appendChild(mk);
          });
        }
        /* D-7 indicator on assembly: critical-point flag at deadline minus 7 working days */
        if(stage.id==='assembly'){
          const dlD=deadlineDate(order.deadline,order.start);
          if(dlD){
            const d7=subWD(dlD,7);
            if(d7>=rng.min&&d7<=rng.max){
              const x=dX(d7,rng);
              const line=el('div','d7-line');
              line.style.left=x+'px';
              line.title='⚠ За 7 рабочих дней до дедлайна — '+fmtF(d7);
              gr.appendChild(line);
              const flag=el('div','d7-flag');
              flag.style.left=x+'px';
              flag.textContent='D-7';
              flag.title=line.title;
              gr.appendChild(flag);
            }
          }
        }
        body.appendChild(gr);
      });
    });
  });

  rp.appendChild(body);
  wrap.appendChild(lp);wrap.appendChild(rp);
  main.appendChild(wrap);
}

function addStripe(p,wx,wex,sx,ex2){
  const s=el('div','we-stripe');s.style.left=Math.max(wx,sx)+'px';s.style.width=(Math.min(wex,ex2)-Math.max(wx,sx))+'px';p.appendChild(s);
}

function hasPaintFinish(order){
  const ids=new Set(order.suborders.flatMap(s=>s.stages.map(x=>x.id)));
  return{hasPainting:ids.has('painting'),hasFinishing:ids.has('finishing')};
}

function addLPOrder(lpR,order,coll){
  const totalS=order.suborders.reduce((a,s)=>a+s.stages.length,0);
  const doneS=order.suborders.reduce((a,s)=>a+s.stages.filter(x=>x.status==='done').length,0);
  const {hasPainting,hasFinishing}=hasPaintFinish(order);
  const lo=el('div','lp-order'+(coll?'':' open'));
  /* left-border highlight */
  if(hasPainting&&hasFinishing){
    lo.style.cssText+='border-left:3px solid transparent;border-image:linear-gradient(to bottom,#f778ba,#fb923c) 1';
  } else if(hasPainting){
    lo.style.borderLeft='3px solid #fb923c';
  } else if(hasFinishing){
    lo.style.borderLeft='3px solid #f778ba';
  }
  /* Drag-handle для перетаскивания заказа в LP (приоритет). Кликабельный
     handle, но drag активен на всей строке через setupLPDrag. */
  const grip=tx('span','lp-grip','⋮⋮');grip.title='Перетащите для изменения порядка';
  lo.appendChild(grip);
  lo.appendChild(tx('span','chev','▶'));lo.appendChild(mkRing(doneS,totalS));
  const nc=el('div','');nc.style.cssText='flex:1;min-width:0';
  nc.appendChild(tx('div','on-name',order.name));nc.appendChild(tx('div','on-sub',order.client+' · '+order.suborders.length+' изд.'));lo.appendChild(nc);
  /* Red exclamation if assembly extends past D-7 marker (mirrors kanban warning).
     Shown for orders in production-stage statuses or later. */
  const _colIdx=KB_COLS.findIndex(c=>c.id===order.kbCol);
  if(_colIdx>1&&isBehindSchedule(order)){
    const bang=tx('span','lp-behind-bang','!');
    bang.title='Не вкладываемся в срок: сборка пересекает D-7';
    lo.appendChild(bang);
  }
  /* Deadline badge removed from LP — deadline is shown on the timeline via the flag/line */
  const be=el('button','btn ic sm');be.textContent='✏';be.onclick=e=>{e.stopPropagation();openModal({type:'editOrder',orderId:order.id})};
  /* Delete button removed from LP — deletion remains available via editOrder modal */
  lo.appendChild(be);
  lo.onclick=()=>{
    S.collapsed['o'+order.id]=!coll;
    S._scrollToOrderId=order.id;
    render();
  };
  setupLPDrag(lo,'order',order.id,(srcId,dstId,before)=>reorderOrders(srcId,dstId,before));
  lpR.appendChild(lo);
}
function addLPSub(lpR,order,sub,scoll){
  const ls=el('div','lp-sub'+(scoll?'':' open'));
  /* Drag-handle для перетаскивания изделия внутри своего заказа */
  const grip=tx('span','lp-grip','⋮⋮');grip.title='Перетащите для изменения порядка';
  ls.appendChild(grip);
  ls.appendChild(tx('span','chev','▶'));ls.appendChild(tx('span','sub-name',sub.name+' ('+sub.stages.length+' эт.)'));
  const sbe=el('button','btn ic sm');sbe.textContent='⚙';sbe.onclick=e=>{e.stopPropagation();openModal({type:'editSub',orderId:order.id,subId:sub.id})};
  ls.appendChild(sbe);ls.onclick=()=>{S.collapsed['s'+sub.id]=!scoll;render()};
  /* Изоляция: drag-kind включает orderId, чтобы нельзя было перетащить
     изделие из одного заказа в другой. */
  setupLPDrag(ls,'sub:'+order.id,sub.id,(srcId,dstId,before)=>reorderSubs(order,srcId,dstId,before));
  lpR.appendChild(ls);
}

/* Order-level purchasing row in LP. Uses .lp-stage class for parity with stage
   rows but with a 🛒 icon and a colour dot matching the materials stage. */
function addLPPurchasing(lpR,order){
  const ps=order.purchasing;
  const def=STAGE_DEFS.find(d=>d.id==='materials');
  const lp=el('div','lp-stage lp-purchasing');
  /* status dot — clickable to open quick status menu */
  const stDot=el('span','stage-dot');stDot.style.background=def.color;
