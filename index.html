/* ══════════════════════════════════════════════
   STAGE CALCULATORS
   appendCalc(parent, stageId, hourSlider, dayInput, hourValLabel)
   - hourSlider / hourValLabel: used in hour mode (update durationHours slider)
   - dayInput: used in day mode (updates рабочих дней input)
══════════════════════════════════════════════ */
function appendCalc(parent, stageId, hourSlider, dayInput, hourValLabel, orderQty){
  if(!['cutting','edging','drilling'].includes(stageId))return;

  const box=el('div','calc-box');
  const title=el('div','calc-title');

  if(stageId==='cutting'){
    title.innerHTML='🧮 Калькулятор раскроя';box.appendChild(title);
    const grid=el('div','calc-grid');
    const f1=mkCalcField('Листов в заказе','шт',orderQty?.sheets||0);
    const f2=mkCalcField('Скорость','л/ч',S.speeds.cutting.sheetsPerHour);
    grid.appendChild(f1.wrap);grid.appendChild(f2.wrap);box.appendChild(grid);
    const res=el('div','calc-result empty');res.textContent='Введите данные для расчёта';box.appendChild(res);
    function recalc(){
      const sheets=+f1.inp.value,speed=+f2.inp.value;
      if(!sheets||!speed){res.className='calc-result empty';res.textContent='Введите данные для расчёта';return}
      const h=Math.ceil(sheets/speed);
      res.className='calc-result';
      res.innerHTML=`<span>Расчётное время: <b>${h} ч</b> <span style="color:var(--text2);font-size:11px">(${sheets}л ÷ ${speed}л/ч)</span></span>`;
      /* Автоприменение: меняем длительность этапа сразу при вводе.
         Финальное «Сохранить» в модалке закрепит изменения в state. */
      applyHours(h);
    }
    f1.inp.addEventListener('input',recalc);f2.inp.addEventListener('input',recalc);
    recalc();
  }

  else if(stageId==='edging'){
    title.innerHTML='🧮 Калькулятор кромкования';box.appendChild(title);
    const grid=el('div','calc-grid');
    const f1=mkCalcField('Метров погонных','м.п.',orderQty?.edgeMeters||0);
    const f2=mkCalcField('Скорость','м/мин',S.speeds.edging.mPerMin);
    grid.appendChild(f1.wrap);grid.appendChild(f2.wrap);box.appendChild(grid);
    const res=el('div','calc-result empty');res.textContent='Введите данные для расчёта';box.appendChild(res);
    function recalc(){
      const meters=+f1.inp.value,speed=+f2.inp.value;
      if(!meters||!speed){res.className='calc-result empty';res.textContent='Введите данные для расчёта';return}
      const h=Math.ceil(meters/speed/60*2)/2;
      res.className='calc-result';
      res.innerHTML=`<span>Расчётное время: <b>${h} ч</b> <span style="color:var(--text2);font-size:11px">(${meters}м ÷ ${speed}м/мин ÷ 60)</span></span>`;
      applyHours(h);
    }
    f1.inp.addEventListener('input',recalc);f2.inp.addEventListener('input',recalc);
    recalc();
  }

  else if(stageId==='drilling'){
    title.innerHTML='🧮 Калькулятор присадки';box.appendChild(title);
    const grid=el('div','calc-grid');
    const f1=mkCalcField('Деталей в заказе','шт',orderQty?.parts||0);
    const f2=mkCalcField('Время на деталь','с/дет',S.speeds.drilling.secPerPart);
    grid.appendChild(f1.wrap);grid.appendChild(f2.wrap);box.appendChild(grid);
    const res=el('div','calc-result empty');res.textContent='Введите данные для расчёта';box.appendChild(res);
    function recalc(){
      const parts=+f1.inp.value,sec=+f2.inp.value;
      if(!parts||!sec){res.className='calc-result empty';res.textContent='Введите данные для расчёта';return}
      const h=Math.ceil(parts*sec/3600*2)/2;
      res.className='calc-result';
      res.innerHTML=`<span>Расчётное время: <b>${h} ч</b> <span style="color:var(--text2);font-size:11px">(${parts}дет × ${sec}с ÷ 3600)</span></span>`;
      applyHours(h);
    }
    f1.inp.addEventListener('input',recalc);f2.inp.addEventListener('input',recalc);
    recalc();
  }

  function applyHours(h){
    if(hourSlider){
      const v=Math.max(0.5,h);
      hourSlider.value=v;
      hourSlider.dispatchEvent(new Event('input'));
    } else if(dayInput){
      const wd=Math.max(1,Math.ceil(h/(S.workEnd-S.workStart)));
      dayInput.value=wd;
      dayInput.dispatchEvent(new Event('input'));
    }
  }

  parent.appendChild(box);
}

function mkCalcField(label,unit,defaultVal){
  const wrap=el('div','calc-field');
  const lbl=el('label','');lbl.textContent=label+' ('+unit+')';
  const inp=document.createElement('input');inp.type='number';inp.min=0;
  inp.placeholder='0';inp.style.marginTop='2px';
  if(defaultVal)inp.value=defaultVal;
  wrap.appendChild(lbl);wrap.appendChild(inp);
  return{wrap,inp};
}

function scrollToToday(){
  const rp=document.querySelector('.rp');
  if(!rp)return;
  const rng=getRange();
  const x=dX(TODAY,rng)+dayWidthFor(TODAY)/2;
  rp.scrollLeft=Math.max(0,x-rp.clientWidth*0.25);
}
/* Scroll the timeline so the earliest stage of the given order is visible,
   leaving ~15% gutter on the left for context. Called when a user clicks an
   order card in the left panel. */
function scrollToOrder(orderId){
  const rp=document.querySelector('.rp');
  if(!rp)return;
  const order=S.orders.find(o=>o.id===orderId);
  if(!order)return;
  let earliest=null;
  order.suborders.forEach(sub=>sub.stages.forEach(st=>{
    const d=new Date(st.start);
    if(!earliest||d<earliest)earliest=d;
  }));
  if(!earliest)return;
  const rng=getRange();
  const x=dX(earliest,rng);
  rp.scrollLeft=Math.max(0,x-rp.clientWidth*0.15);
  // Sync LP rows scrollTop to keep the order header aligned vertically.
  const lpRows=document.querySelector('.lp-rows');
  if(lpRows){
    // Find the LP order element by index in DOM
    const orders=sortedOrders();
    let topPx=0,target=null;
    for(const o of orders){
      if(o.id===orderId){target=topPx;break;}
      /* Row heights mirror CSS variables: order=rowH+21, sub=rowH+9, stage=rowH */
      const hOrder=S.rowH+21, hSub=S.rowH+9, hStage=S.rowH;
      topPx+=hOrder;
      if(!S.collapsed['o'+o.id]){
        o.suborders.forEach(sub=>{
          topPx+=hSub;
          if(!S.collapsed['s'+sub.id])topPx+=sub.stages.length*hStage;
        });
      }
    }
    if(target!==null){
      lpRows.scrollTop=Math.max(0,target-20);
      rp.scrollTop=lpRows.scrollTop;
    }
  }
}

function addFooter(modal,onSave,saveLabel){
  const f=el('div','modal-footer');
  const c=el('button','btn');c.textContent='Отмена';c.onclick=()=>closeModal();
  const s=el('button','btn pr');s.textContent=saveLabel||'Сохранить';s.onclick=onSave;
  f.appendChild(c);f.appendChild(s);modal.appendChild(f);
}
/* Закрываем текущую модалку. Если у неё есть _parent — возвращаемся к нему,
   чтобы пользователь продолжил работу с той модалкой, из которой открыл
   текущую (например, редактирование изделия из карточки заказа). */
function closeModal(){
  const cur=S.modal;
  S.modal=(cur&&cur._parent)||null;
  render();
}

/* ══════════════════════════════════════════════
   AUTH GATE + BOOT
   До логина показываем overlay с magic-link формой.
   После логина — стандартный render(). На Этапе 1
   данные пока в памяти (демо); БД-загрузка — Этап 2.
══════════════════════════════════════════════ */
function renderLogin(msg,kind){
  const root=document.getElementById('root');root.innerHTML='';
  const wrap=document.createElement('div');
  wrap.style.cssText='min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);';
  const card=document.createElement('div');
  card.style.cssText='background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--rl);padding:32px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.4);';
  const h=document.createElement('div');
  h.textContent='ФурнитурПлан';
  h.style.cssText='font-family:"Playfair Display",serif;font-size:24px;color:var(--text);margin-bottom:4px;';
  const sub=document.createElement('div');
  sub.textContent='Вход в систему';
  sub.style.cssText='font-size:13px;color:var(--text3);margin-bottom:20px;';
  /* email field */
  const inpEmail=document.createElement('input');
  inpEmail.type='email';inpEmail.placeholder='e-mail';inpEmail.autocomplete='username';
  inpEmail.style.cssText='width:100%;box-sizing:border-box;padding:10px 12px;background:var(--bg);border:1px solid var(--bg4);border-radius:var(--r);color:var(--text);font:inherit;outline:none;margin-bottom:10px;';
  /* password field */
  const inpPw=document.createElement('input');
  inpPw.type='password';inpPw.placeholder='пароль';inpPw.autocomplete='current-password';
  inpPw.style.cssText='width:100%;box-sizing:border-box;padding:10px 12px;background:var(--bg);border:1px solid var(--bg4);border-radius:var(--r);color:var(--text);font:inherit;outline:none;margin-bottom:12px;';
  const btn=document.createElement('button');
  btn.textContent='Войти';
  btn.style.cssText='width:100%;padding:10px;background:var(--accent);color:#fff;border:0;border-radius:var(--r);font:inherit;font-weight:600;cursor:pointer;';
  const status=document.createElement('div');
  status.style.cssText='font-size:12px;margin-top:12px;min-height:18px;';
  if(msg){status.textContent=msg;status.style.color=kind==='err'?'var(--danger)':'var(--success)'}
  const doLogin=async()=>{
    const email=inpEmail.value.trim();
    const password=inpPw.value;
    if(!email||!email.includes('@')){renderLogin('Введите корректный e-mail','err');return}
    if(!password){renderLogin('Введите пароль','err');return}
    btn.disabled=true;btn.textContent='Вход…';
    try{
      await db.signIn(email,password);
      /* Успех — onAuthChange в boot() поймает и запустит initApp */
    }catch(e){
      const m=(e.message||String(e));
      const friendly=m.includes('Invalid login')?'Неверный e-mail или пароль':m;
      renderLogin('Ошибка: '+friendly,'err');
    }
  };
  btn.onclick=doLogin;
  inpEmail.onkeydown=e=>{if(e.key==='Enter')inpPw.focus()};
  inpPw.onkeydown=e=>{if(e.key==='Enter')doLogin()};
  card.append(h,sub,inpEmail,inpPw,btn,status);wrap.appendChild(card);root.appendChild(wrap);
  setTimeout(()=>inpEmail.focus(),50);
}

async function boot(){
  /* В PWA-режиме (Chrome "Install as app") страница инициализируется
     быстрее, чем Supabase SDK успевает прочитать сессию из localStorage.
     Поэтому первый вызов getSession() может вернуть null даже когда
     сессия фактически есть. Ждём до 1.5с с retry'ями, пока SDK не
     закончит инициализацию. */
  let session=null;
  for(let i=0;i<15;i++){
    const r=await sb.auth.getSession();
    if(r.data.session){session=r.data.session;break}
    await new Promise(res=>setTimeout(res,100));
  }
  if(!session){
    renderLogin();
    db.onAuthChange(s=>{if(s){CURRENT_USER=s.user;initApp()}});
    return;
  }
  CURRENT_USER=session.user;
  /* На случай logout в другой вкладке */
  db.onAuthChange(s=>{if(!s)renderLogin()});
  await initApp();
}

/* initApp: загружает заказы из Supabase. Если БД пуста — генерирует
   демо-данные через buildDemoOrders() и заливает их в Supabase. */
async function initApp(){
  renderBootSplash('Загрузка данных…');
  try{
    let loaded=await db.loadOrders();
    if(loaded.length===0){
      renderBootSplash('Первый запуск — заполняем демо-данные…');
      const demos=buildDemoOrders();
      await db.seedDemoOrders(demos);
      loaded=demos;
    }
    S.orders=loaded;
    S.orders.forEach(ensureOrderPurchasing);
    /* Загружаем справочники из БД (Этап «Справочники»). Если в БД пусто
       и в коде остался хардкод S.suppliers — посеем первые. Затем
       мигрируем все legacy supplierId (числа 1-6) в новые UUID. */
    try{
      let supsFromDB=await db.loadSuppliers();
      if(supsFromDB.length===0&&Array.isArray(S.suppliers)&&S.suppliers.length>0){
        /* Первый запуск после обновления — переносим хардкод в БД с UUID */
        const oldToNew={};
        const seed=S.suppliers.map(s=>{
          const newId=_id();
          oldToNew[s.id]=newId;
          return {id:newId,name:s.name,tag:s.tag||'',color:s.color||'#3fb950',
            logoDataUrl:s.logoDataUrl||'',contactPerson:'',phone:'',email:'',address:'',notes:''};
        });
        console.log('[migrate] seeding suppliers:',seed.length);
        for(const s of seed){try{await db.saveSupplier(s)}catch(e){console.warn('seed supplier failed',e)}}
        /* Переписываем supplierId в существующих доставках */
        S.orders.forEach(o=>{
          if(!o.purchasing||!Array.isArray(o.purchasing.deliveries))return;
          o.purchasing.deliveries.forEach(d=>{
            if(d.supplierId!=null&&oldToNew[d.supplierId]){
              d.supplierId=oldToNew[d.supplierId];
            }
          });
        });
        supsFromDB=seed;
        console.log('[migrate] suppliers migrated');
      }
      S.suppliers=supsFromDB;
      S.clients=await db.loadClients();
      /* Employees: загружаем из БД. Если пусто — сеем legacy из S.users
         с UUID. Затем мигрируем stage.assignees вида "Имя_Роль" → UUID. */
      let empsFromDB=await db.loadEmployees();
      if(empsFromDB.length===0&&Array.isArray(S.users)&&S.users.length>0){
        const seed=S.users.map(u=>({id:_id(),name:u.name,role:u.role||'',phone:''}));
        console.log('[migrate] seeding employees:',seed.length);
        for(const e of seed){try{await db.saveEmployee(e)}catch(err){console.warn('seed employee failed',err)}}
        empsFromDB=seed;
        console.log('[migrate] employees migrated');
      }
      S.employees=empsFromDB;
      /* Миграция legacy assignees: строки "Имя_Роль" → UUID. */
      const legacyToUuid={};
      S.employees.forEach(e=>{legacyToUuid[(e.name+'_'+e.role)]=e.id});
      let migratedStages=0;
      S.orders.forEach(o=>{
        o.suborders.forEach(s=>{
          s.stages.forEach(st=>{
            if(!Array.isArray(st.assignees))return;
            let changed=false;
            st.assignees=st.assignees.map(v=>{
              /* если это уже UUID (есть в S.employees) — оставляем */
              if(S.employees.some(e=>e.id===v))return v;
              /* если это legacy строка — заменяем */
              if(legacyToUuid[v]){changed=true;return legacyToUuid[v]}
              return v;
            });
            if(changed)migratedStages++;
          });
        });
      });
      if(migratedStages)console.log('[migrate] assignees migrated in',migratedStages,'stages');
    }catch(e){console.warn('suppliers/clients/employees load failed',e);S.clients=S.clients||[];S.employees=S.employees||[]}
    /* Этап 6: загружаем per-user настройки и применяем к S */
    try{
      const settings=await db.loadUserSettings();
      applyUserSettings(settings);
      /* Если в localStorage остались legacy ключи fp_* — переносим */
      await migrateLegacyLocalStorage();
    }catch(e){console.warn('user_settings load failed',e)}
    /* Per-device scales (row height, kanban column width, card scale) —
       загружаем после CURRENT_USER, так как ключи привязаны к user_id */
    loadDeviceScale();
    /* Миграция legacy: переносим base64 из purchasing.deliveries[].fileDataUrl
       в отдельную таблицу delivery_files. Выполняется один раз — после
       миграции fileDataUrl очищается, в delivery остаётся только fileId.
       Это сильно уменьшает размер orders и ускоряет save. */
    try{
      const toMigrate=[];
      S.orders.forEach(o=>{
        if(!o.purchasing||!Array.isArray(o.purchasing.deliveries))return;
        o.purchasing.deliveries.forEach(d=>{
          if(d.fileDataUrl&&!d.fileId){toMigrate.push({order:o,delivery:d})}
        });
      });
      if(toMigrate.length){
        setSyncStatus('saving');
        console.log('[migrate] files to migrate:',toMigrate.length);
        for(const {order,delivery} of toMigrate){
          try{
            const id=_id();
            const sz=delivery.fileDataUrl.length;
            const {error}=await sb.from('delivery_files').insert({
              id, file_name:delivery.fileName||'file',
              mime_type:'application/octet-stream',
              data:delivery.fileDataUrl, size_bytes:sz,
            });
            if(error){console.warn('[migrate] insert failed',error);continue}
            delivery.fileId=id;
            delivery.fileDataUrl='';  /* убираем base64 из заказа */
          }catch(e){console.warn('[migrate] error',e)}
        }
        console.log('[migrate] done');
      }
    }catch(e){console.warn('migration error',e)}
    /* Фиксируем «исходное состояние = в БД» ДО первого render, чтобы
       загрузка не пометила все 4 заказа как «грязные». */
    captureSnapshots();
    _settingsSnap=JSON.stringify(serializeUserSettings());
    _settingsDirty=false;
    render();
    setSyncStatus('idle');
    /* Подписка на Realtime. Поднимаем ОДИН раз после успешного init. */
    if(!window._rtChannel)window._rtChannel=db.subscribeChanges();
  }catch(e){
    console.error('initApp failed',e);
    renderBootError(e);
  }
}

/* Простой текстовый сплэш на время загрузки, чтобы экран не висел чёрный. */
function renderBootSplash(text){
  const root=document.getElementById('root');root.innerHTML='';
  const w=document.createElement('div');
  w.style.cssText='min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text3);font-size:14px';
  w.textContent=text;root.appendChild(w);
}
function renderBootError(e){
  const root=document.getElementById('root');root.innerHTML='';
  const w=document.createElement('div');
  w.style.cssText='min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--danger);font-size:13px;text-align:center;padding:20px';
  const h=document.createElement('div');h.textContent='Не удалось загрузить данные';h.style.cssText='font-size:16px;margin-bottom:8px;color:var(--text)';
  const m=document.createElement('div');m.textContent=(e&&e.message)||String(e);m.style.cssText='max-width:600px;font-family:JetBrains Mono,monospace;background:var(--bg2);padding:12px;border-radius:var(--r);border:1px solid var(--bg4)';
  const r=document.createElement('button');r.textContent='Попробовать снова';r.style.cssText='margin-top:14px;padding:8px 16px;background:var(--accent);color:#fff;border:0;border-radius:var(--r);cursor:pointer';r.onclick=()=>initApp();
  w.append(h,m,r);root.appendChild(w);
}

boot();
</script>
