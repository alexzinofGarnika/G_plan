<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ФурнитурПлан</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --border:#30363d;--border2:#444c56;
  --text:#e6edf3;--text2:#8b949e;--text3:#484f58;
  --accent:#58a6ff;--accent-bg:rgba(88,166,255,.1);
  --success:#3fb950;--success-bg:rgba(63,185,80,.1);
  --warn:#d29922;--warn-bg:rgba(210,153,34,.12);
  --danger:#f85149;--danger-bg:rgba(248,81,73,.1);
  --we-bg:rgba(248,81,73,.07);
  --r:8px;--rl:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Golos Text',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px}
/* Timeline horizontal scrollbar — taller and accent-coloured for easier navigation */
.rp::-webkit-scrollbar:horizontal{height:10px}
.rp::-webkit-scrollbar-thumb:horizontal{background:var(--accent);border-radius:99px}
.rp::-webkit-scrollbar-thumb:horizontal:hover{background:#79b8ff}
.rp{scrollbar-color:var(--accent) transparent} /* Firefox fallback */
#root{display:flex;flex-direction:column;height:100vh}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;z-index:30}
.logo{font-family:'Playfair Display',serif;font-size:18px;white-space:nowrap}.logo b{color:var(--accent)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.pill-g{background:var(--success-bg);color:var(--success);border:1px solid rgba(63,185,80,.25)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border2);border-radius:var(--r);padding:5px 12px;font-size:12px;font-family:'Golos Text',sans-serif;color:var(--text);cursor:pointer;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--bg3)}
.btn.pr{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn.pr:hover{background:#79b8ff}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.ic{padding:4px 8px}
.btn.dn{color:var(--danger);border-color:var(--danger-bg)}.btn.dn:hover{background:var(--danger-bg)}
.btn.warn{color:var(--warn);border-color:rgba(210,153,34,.3)}.btn.warn:hover{background:var(--warn-bg)}
.btn.warn.on{background:var(--warn);color:#0d1117;font-weight:600;border-color:var(--warn)}
.zg{display:flex;align-items:center;gap:4px}
.zl{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;min-width:58px;text-align:center}
.tab-bar{display:flex;gap:2px;background:var(--bg3);border-radius:var(--r);padding:2px}
.tab{padding:4px 14px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s}
.tab.on{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sm-tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--r);padding:2px;flex-shrink:0}
.sm-tab{padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;color:var(--text2);background:none;border:none;font-family:inherit;transition:all .15s;white-space:nowrap}
.sm-tab:hover{color:var(--text)}
.sm-tab.on{background:var(--accent);color:#fff;font-weight:500}

/* ── SPEEDS PANEL ── */
.speeds-panel{display:flex;align-items:center;gap:0;padding:0;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.sp-section{display:flex;align-items:center;gap:8px;padding:6px 16px;border-right:1px solid var(--border)}
.sp-section:last-child{border-right:none}
.sp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sp-label{font-size:11px;color:var(--text2);white-space:nowrap}
.sp-field{display:flex;align-items:center;gap:4px}
.sp-field label{font-size:10px;color:var(--text3);white-space:nowrap}
.sp-input{width:56px;background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:2px 6px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text);text-align:center;outline:none}
.sp-input:focus{border-color:var(--accent)}
.sp-unit{font-size:10px;color:var(--text3);white-space:nowrap}
.htl-head{height:58px;position:sticky;top:0;z-index:15;background:var(--bg2);border-bottom:1px solid var(--border);overflow:hidden}
.htl-inner{position:relative;height:58px}
.hday-cell{position:absolute;top:0;height:28px;display:flex;align-items:center;padding-left:7px;font-size:11px;font-weight:600;color:var(--text);border-left:2px solid var(--border2);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden}
.hhour-cell{position:absolute;top:28px;height:30px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);border-left:1px solid var(--border);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden}
.hhour-cell.h-work{color:var(--text2)}.hhour-cell.h-ot{color:var(--danger);opacity:.7}.hhour-cell.h-bound{border-left-color:rgba(88,166,255,.5);color:var(--accent)}
.ot-col{position:absolute;top:0;bottom:0;background:rgba(248,81,73,.12);pointer-events:none;z-index:0}
.delivery-marker{position:absolute;top:2px;bottom:2px;width:3px;border-radius:2px;z-index:7;pointer-events:auto;cursor:help}
.delivery-marker-mat{background:#3fb950}
.delivery-marker-hw{background:#bc8cff}
.work-col{position:absolute;top:0;bottom:0;background:rgba(63,185,80,.025);pointer-events:none;z-index:0}
.h-grid-ln{position:absolute;top:0;bottom:0;width:1px;background:var(--border);pointer-events:none;z-index:0}
.h-day-sep{position:absolute;top:0;bottom:0;width:2px;background:var(--border2);pointer-events:none;z-index:1}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--success);opacity:.8;pointer-events:none;z-index:7}
.now-lbl{position:absolute;top:3px;font-size:9px;color:var(--success);font-family:'JetBrains Mono',monospace;pointer-events:none;z-index:8;padding-left:3px;white-space:nowrap}
.ot-overlay{position:absolute;top:9px;height:24px;pointer-events:none;z-index:6;background:rgba(248,81,73,.55);border-left:2px solid rgba(248,81,73,.9);border-radius:0 5px 5px 0}
.ot-lbl{position:absolute;top:9px;height:24px;pointer-events:none;z-index:7;display:flex;align-items:center;padding:0 4px;font-size:10px;color:#fff;font-weight:700;font-family:'JetBrains Mono',monospace;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.s-time{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text3);white-space:nowrap;flex-shrink:0}
.s-time.ot{color:var(--danger)}
.fbar{display:flex;align-items:center;gap:7px;padding:5px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.flbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;border-radius:99px;border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text2);cursor:pointer;font-family:'Golos Text',sans-serif;white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.on{border-color:transparent;color:#0d1117;font-weight:500}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.csep{width:1px;background:var(--border);height:18px;margin:0 3px;flex-shrink:0}
.clr-btn{font-size:11px;color:var(--text3);cursor:pointer;padding:2px 7px;border-radius:99px;border:1px solid transparent;background:transparent;font-family:'Golos Text',sans-serif}
.clr-btn:hover{color:var(--danger);border-color:var(--danger-bg)}
.fbadge{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--accent-bg);color:var(--accent);border:1px solid rgba(88,166,255,.3);font-family:'JetBrains Mono',monospace}

/* ── STATS ── */
.stats{display:flex;padding:5px 16px;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0}
.stat{flex:1;padding:5px 10px;background:var(--bg2);border-radius:var(--r)}
.sv{font-size:18px;font-weight:600;font-family:'JetBrains Mono',monospace}
.sl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}

/* ── MAIN LAYOUT ── */
.main{display:flex;flex:1;overflow:hidden}

/* ══════════════════════════════════════════════
   GANTT VIEW
══════════════════════════════════════════════ */
.gantt-wrap{display:flex;flex:1;overflow:hidden}
.lp{width:260px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg2)}
.lp-head{height:58px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;flex-shrink:0}
.lp-rows{overflow-y:auto;overflow-x:hidden;flex:1}
.rp{flex:1;overflow:auto;min-width:0}

/* LP rows */
.lp-order{display:flex;align-items:center;gap:5px;height:var(--g-order-h,63px);padding:0 10px;background:var(--bg3);border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.lp-dragging{opacity:.4}
.lp-drag-before{box-shadow:inset 0 3px 0 0 var(--accent)}
.lp-drag-after{box-shadow:inset 0 -3px 0 0 var(--accent)}
.lp-grip{color:var(--text3);font-size:11px;line-height:1;cursor:grab;padding:0 2px;flex-shrink:0;letter-spacing:-1px}
.lp-grip:active{cursor:grabbing}
.lp-grip:hover{color:var(--text2)}
.lp-order:hover{background:var(--bg4)}
.lp-order.open .chev{transform:rotate(90deg)}
.chev{font-size:9px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.on-name{font-size:13px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-behind-bang{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#f85149;color:#fff;font-weight:700;font-size:13px;line-height:1;flex-shrink:0;cursor:help;animation:kb-pulse 2s ease-in-out infinite}
.on-sub{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-badge{font-size:10px;font-family:'JetBrains Mono',monospace;padding:1px 5px;border-radius:99px;font-weight:500;white-space:nowrap;flex-shrink:0}
.dl-ok{background:rgba(63,185,80,.15);color:var(--success)}
.dl-warn{background:rgba(210,153,34,.15);color:var(--warn)}
.dl-over{background:rgba(248,81,73,.18);color:var(--danger);animation:dlpulse 1.2s ease-in-out infinite}
@keyframes dlpulse{0%,100%{opacity:1}50%{opacity:.5}}
.lp-sub{display:flex;align-items:center;gap:5px;height:var(--g-sub-h,51px);padding:0 8px 0 28px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--bg2)}
.lp-sub:hover{background:var(--bg3)}
.lp-sub.open .chev{transform:rotate(90deg)}
.sub-name{font-size:12px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-stage{display:flex;align-items:center;gap:5px;height:var(--g-stage-h,42px);padding:0 8px 0 44px;border-bottom:1px solid var(--border);cursor:pointer}
.lp-stage:hover{background:var(--bg3)}
.lp-purchasing{padding-left:30px;background:linear-gradient(to right,rgba(63,185,80,.05),transparent 40%)}
.lp-purchasing .stage-lbl{font-weight:500}
.gbar-purch{color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.gbar.gbar-done{opacity:.5;text-decoration:line-through}
.g-purch-mk{position:absolute;top:9px;width:22px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:7;pointer-events:auto;cursor:help;transform:translateX(-11px);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
/* Стопка маркеров на одну дату. Одиночный маркер живёт в стеке как
   единственный ребёнок (без визуального эффекта). Несколько маркеров
   стопкой накладываются через negative margin; при hover раздвигаются. */
.g-purch-stack{position:absolute;top:9px;display:flex;align-items:center;z-index:7;transform:translateX(-11px);transition:z-index 0s}
.g-purch-stack > .g-purch-mk{position:relative;top:0;transform:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));transition:margin-left .18s ease}
.g-purch-stack > .g-purch-mk + .g-purch-mk{margin-left:-16px;box-shadow:0 0 0 1.5px var(--bg)}
.g-purch-stack:hover{z-index:11}
.g-purch-stack:hover > .g-purch-mk + .g-purch-mk{margin-left:3px;box-shadow:none}
/* Бейдж "+N" в верхнем углу стопки */
.g-purch-stack-badge{position:absolute;top:-6px;right:-6px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;border:1.5px solid var(--bg);pointer-events:none;transition:opacity .15s ease;z-index:2}
.g-purch-stack:hover .g-purch-stack-badge{opacity:0}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.slbl{font-size:11px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;padding:1px 5px;border-radius:99px;font-size:10px;font-weight:500;white-space:nowrap}
.bp{background:rgba(139,148,158,.15);color:var(--text2)}
.bi{background:var(--accent-bg);color:var(--accent)}
.bd{background:var(--success-bg);color:var(--success)}
.bb{background:var(--danger-bg);color:var(--danger)}

/* Gantt timeline */
.tl-head{height:58px;position:sticky;top:0;z-index:15;background:var(--bg2);border-bottom:1px solid var(--border)}
.tl-inner{position:relative;height:58px}
.mcell{position:absolute;top:0;height:28px;display:flex;align-items:center;padding-left:7px;font-size:11px;font-weight:600;color:var(--text2);border-left:1px solid var(--border);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-transform:uppercase;letter-spacing:.4px}
.dcell{position:absolute;top:28px;height:30px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);border-left:1px solid var(--border);font-family:'JetBrains Mono',monospace}
.dcell.we{color:var(--danger);opacity:.7}.dcell.tod{color:var(--accent);font-weight:600}
.dcell.sat-toggle:hover{background:rgba(88,166,255,.12);color:var(--accent)}
.dcell.sat-on{color:var(--success);opacity:1;background:rgba(63,185,80,.08)}
.dcell.sat-on:hover{background:rgba(63,185,80,.18)}

/* Gantt body */
.gbody{position:relative}
.gbg-we{position:absolute;top:0;bottom:0;background:var(--we-bg);pointer-events:none;z-index:0}
.gbg-ln{position:absolute;top:0;bottom:0;width:1px;background:var(--border);pointer-events:none;z-index:0}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.5;pointer-events:none;z-index:6}
/* order row */
.g-order{position:relative;height:var(--g-order-h,63px);border-bottom:1px solid var(--border);background:rgba(33,38,45,.55);overflow:hidden}
.g-order-span{position:absolute;top:50%;transform:translateY(-50%);height:6px;border-radius:3px;background:var(--border2);z-index:2;pointer-events:none}
.g-order-lbl{position:absolute;top:0;left:6px;height:100%;display:flex;align-items:center;font-size:11px;color:var(--text3);pointer-events:none;white-space:nowrap;z-index:3;gap:6px}
/* sub row */
.g-sub{position:relative;height:var(--g-sub-h,51px);border-bottom:1px solid var(--border);background:rgba(22,27,34,.7);overflow:hidden}
.g-sub-span{position:absolute;top:50%;transform:translateY(-50%);height:4px;border-radius:2px;background:var(--border);z-index:2;pointer-events:none}
.g-sub-lbl{position:absolute;top:0;left:12px;height:100%;display:flex;align-items:center;font-size:10px;color:var(--text3);pointer-events:none;white-space:nowrap;z-index:3}
/* stage bar row */
.g-stage{position:relative;height:var(--g-stage-h,42px);border-bottom:1px solid var(--border)}
.g-stage:hover{background:rgba(88,166,255,.04)}
.gbar{position:absolute;top:9px;height:calc(var(--g-stage-h,42px) - 18px);min-height:14px;border-radius:5px;cursor:grab;display:flex;align-items:center;padding:0 6px;overflow:hidden;user-select:none;z-index:4}
.gbar:hover{filter:brightness(1.1);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.gbar:active{cursor:grabbing}
.gbar-lbl{font-size:10px;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;pointer-events:none}
.gbar-done{opacity:.5}
.gbar-conflict{outline:2px solid #f85149;outline-offset:-2px;box-shadow:0 0 0 1px rgba(248,81,73,.4) inset}
.gbar-conflict::after{content:'⚠';position:absolute;top:-2px;right:2px;font-size:11px;color:#fff;background:#f85149;border-radius:3px;padding:0 3px;line-height:1.3;z-index:9;pointer-events:none;text-shadow:none}
.g-rh{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(255,255,255,.15);border-radius:0 5px 5px 0}
.we-stripe{position:absolute;top:9px;height:24px;pointer-events:none;z-index:5;border-radius:3px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0,rgba(255,255,255,.18) 3px,transparent 3px,transparent 6px)}
.we-ol{position:absolute;top:9px;height:calc(var(--g-stage-h,42px) - 18px);min-height:14px;pointer-events:none;z-index:5;border-radius:5px;outline:2px dashed rgba(255,200,50,.5);outline-offset:-1px}

/* deadline inside order row */
.dl-line{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed;pointer-events:none;z-index:5}
.dl-flag{position:absolute;bottom:2px;font-size:9px;font-family:'JetBrains Mono',monospace;font-weight:700;pointer-events:none;z-index:6;white-space:nowrap;padding-left:3px}
.d7-line{position:absolute;top:0;bottom:0;width:0;border-left:2px dotted var(--warn);pointer-events:auto;cursor:help;z-index:7}
.d7-flag{position:absolute;top:2px;font-size:9px;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--warn);background:rgba(210,153,34,.18);border:1px solid var(--warn);border-radius:3px;padding:1px 4px;line-height:1;pointer-events:auto;cursor:help;z-index:8;transform:translateX(-50%);white-space:nowrap}
.os-line{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--success);pointer-events:auto;cursor:help;z-index:5;opacity:.7}
.os-flag{position:absolute;top:2px;font-size:10px;color:var(--success);font-weight:700;pointer-events:auto;cursor:help;z-index:6;white-space:nowrap;padding-left:3px;line-height:1}

/* ── TOOLTIP ── */
#tt{position:fixed;display:none;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:9px 13px;font-size:12px;z-index:999;pointer-events:none;min-width:190px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.tt-t{font-size:13px;font-weight:600;margin-bottom:4px}
.calc-box{margin-top:10px;padding:12px 14px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r)}
.calc-title{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc-field label{display:block;font-size:10px;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.calc-field input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--text);outline:none;text-align:center}
.calc-field input:focus{border-color:var(--accent)}
.calc-result{margin-top:10px;padding:8px 12px;background:var(--accent-bg);border:1px solid rgba(88,166,255,.25);border-radius:var(--r);font-size:12px;color:var(--accent);display:flex;align-items:center;justify-content:space-between;gap:8px}
.calc-result b{font-family:'JetBrains Mono',monospace;font-size:14px}

<body>

<div id="tt"></div>
<script>
/* ══════════════════════════════════════════════
   SUPABASE CONFIG
   Anon-key безопасно держать в публичном HTML —
   доступ ограничен через RLS-политики в БД.
══════════════════════════════════════════════ */
const SB_URL='https://lxttvyopkdzkwlzafskj.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4dHR2eW9wa2R6a3dsemFmc2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMjM0NDUsImV4cCI6MjA5NDc5OTQ0NX0.lL0mV2lC0L0xlQZEbkjI8X9HkNSpSk5euuKHpELDb_Q';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

/* Stable ID generator — заменяет числовой _uid++ счётчик.
   crypto.randomUUID гарантирует уникальность между клиентами. */
function _id(){return crypto.randomUUID()}

/* Текущий авторизованный пользователь. Заполняется в boot() после login. */
let CURRENT_USER=null;

/* db — единая точка доступа к Supabase. На Этапе 1 только auth-методы;
   loadOrders/saveOrder/Realtime появятся в Этапах 2–4. */
const db={
  async getSession(){const {data}=await sb.auth.getSession();return data.session||null},
  async signIn(email,password){
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
  },
  async signOut(){await sb.auth.signOut();CURRENT_USER=null;location.reload()},
  onAuthChange(cb){sb.auth.onAuthStateChange((_e,session)=>cb(session))},

  /* ── ORDERS: load + seed ───────────────────────────────────────── */
  async loadOrders(){
    const [{data:os,error:e1},{data:ss,error:e2},{data:st,error:e3}]=await Promise.all([
      sb.from('orders').select('*'),
      sb.from('suborders').select('*'),
      sb.from('stages').select('*'),
    ]);
    if(e1)throw e1; if(e2)throw e2; if(e3)throw e3;
    /* Group children by parent for O(n) reassembly. */
    const subsByOrd={}, stagesBySub={};
    ss.forEach(s=>{(subsByOrd[s.order_id]=subsByOrd[s.order_id]||[]).push(s)});
    st.forEach(x=>{(stagesBySub[x.suborder_id]=stagesBySub[x.suborder_id]||[]).push(x)});
    return os.map(o=>db2ord(o,subsByOrd[o.id]||[],stagesBySub)).sort((a,b)=>a.seq-b.seq);
  },
  async seedDemoOrders(orders){
    const oRows=[],sRows=[],stRows=[];
    orders.forEach(o=>{
      oRows.push(ord2db(o));
      o.suborders.forEach((s,si)=>{
        sRows.push(sub2db(s,o.id,si));
        s.stages.forEach((stg,sti)=>{
          if(!stg.uid)stg.uid=_id();
          stRows.push(stage2db(stg,s.id,sti));
        });
      });
    });
    const {error:e1}=await sb.from('orders').insert(oRows);        if(e1)throw e1;
    const {error:e2}=await sb.from('suborders').insert(sRows);     if(e2)throw e2;
    const {error:e3}=await sb.from('stages').insert(stRows);       if(e3)throw e3;
  },

  /* ── ORDERS: write ─────────────────────────────────────────────
     saveOrder: полная перезапись одного заказа. delete детей через
     FK cascade чистит обе таблицы за один запрос, после чего вставляем
     актуальные. Это проще, чем точечный диф, и для частоты ~1 раз/сек
     на пользователя (debounce 400мс) даёт приемлемый трафик. */
  async saveOrder(order){
    const {error:e1}=await sb.from('orders').upsert(ord2db(order));
    if(e1)throw e1;
    const {error:e2}=await sb.from('suborders').delete().eq('order_id',order.id);
    if(e2)throw e2;
    if(!order.suborders||!order.suborders.length)return;
    const subRows=order.suborders.map((s,i)=>sub2db(s,order.id,i));
    const {error:e3}=await sb.from('suborders').insert(subRows);
    if(e3)throw e3;
    const stageRows=[];
    order.suborders.forEach(s=>s.stages.forEach((st,sti)=>{
      if(!st.uid)st.uid=_id();
      stageRows.push(stage2db(st,s.id,sti));
    }));
    if(stageRows.length){
      const {error:e4}=await sb.from('stages').insert(stageRows);
      if(e4)throw e4;
    }
  },
  async deleteOrder(orderId){
    const {error}=await sb.from('orders').delete().eq('id',orderId);
    if(error)throw error;
  },

  /* ── SUPPLIERS ─────────────────────────────────────────────────── */
  async loadSuppliers(){
    const {data,error}=await sb.from('suppliers').select('*').order('name');
    if(error)throw error;
    return (data||[]).map(r=>({
      id:r.id, name:r.name, tag:r.tag||'', color:r.color||'#3fb950',
      logoDataUrl:r.logo_data_url||'',
      contactPerson:r.contact_person||'', phone:r.phone||'',
      email:r.email||'', address:r.address||'', notes:r.notes||'',
    }));
  },
  async saveSupplier(s){
    const row={
      id:s.id, name:s.name, tag:s.tag||'', color:s.color||'#3fb950',
      logo_data_url:s.logoDataUrl||'',
      contact_person:s.contactPerson||'', phone:s.phone||'',
      email:s.email||'', address:s.address||'', notes:s.notes||'',
    };
    const {error}=await sb.from('suppliers').upsert(row,{onConflict:'id'});
    if(error)throw error;
  },
  async deleteSupplier(id){
    const {error}=await sb.from('suppliers').delete().eq('id',id);
    if(error)throw error;
  },

  /* ── CLIENTS ───────────────────────────────────────────────────── */
  async loadClients(){
    const {data,error}=await sb.from('clients').select('*').order('name');
    if(error)throw error;
    return (data||[]).map(r=>({
      id:r.id, name:r.name, clientType:r.client_type||'person',
      phone:r.phone||'', email:r.email||'',
      address:r.address||'', notes:r.notes||'',
    }));
  },
  async saveClient(c){
    const row={
      id:c.id, name:c.name, client_type:c.clientType||'person',
      phone:c.phone||'', email:c.email||'',
      address:c.address||'', notes:c.notes||'',
    };
    const {error}=await sb.from('clients').upsert(row,{onConflict:'id'});
    if(error)throw error;
  },
  async deleteClient(id){
    const {error}=await sb.from('clients').delete().eq('id',id);
    if(error)throw error;
  },

  /* ── EMPLOYEES ─────────────────────────────────────────────────── */
  async loadEmployees(){
    const {data,error}=await sb.from('employees').select('*').order('name');
    if(error)throw error;
    return (data||[]).map(r=>({
      id:r.id, name:r.name, role:r.role||'', phone:r.phone||'',
    }));
  },
  async saveEmployee(e){
    const row={id:e.id, name:e.name, role:e.role||'', phone:e.phone||''};
    const {error}=await sb.from('employees').upsert(row,{onConflict:'id'});
    if(error)throw error;
  },
  async deleteEmployee(id){
    const {error}=await sb.from('employees').delete().eq('id',id);
    if(error)throw error;
  },

  /* ── REALTIME ──────────────────────────────────────────────────
     Подписка на изменения шести таблиц. Любое событие триггерит
     scheduleReload(), который через дебаунс 600мс перечитывает
     данные целиком (если нет своих pending изменений). */
  subscribeChanges(){
    const ch=sb.channel('rt-orders');
    ch.on('postgres_changes',{event:'*',schema:'public',table:'orders'},    ()=>scheduleReload());
    ch.on('postgres_changes',{event:'*',schema:'public',table:'suborders'}, ()=>scheduleReload());
    ch.on('postgres_changes',{event:'*',schema:'public',table:'stages'},    ()=>scheduleReload());
    ch.on('postgres_changes',{event:'*',schema:'public',table:'suppliers'}, ()=>scheduleReload());
    ch.on('postgres_changes',{event:'*',schema:'public',table:'clients'},   ()=>scheduleReload());
    ch.on('postgres_changes',{event:'*',schema:'public',table:'employees'}, ()=>scheduleReload());
    ch.subscribe();
    return ch;
  },

  /* ── DELIVERY FILES (Вариант A) ─────────────────────────────────
     Файлы лежат в отдельной таблице delivery_files: только когда
     меняются — не при каждом save заказа. В delivery хранится fileId.
     Сами base64-данные грузятся on-demand при открытии/печати. */
  async uploadDeliveryFileToDB(file){
    const dataUrl=await new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(r.result);
      r.onerror=()=>reject(new Error('Не удалось прочитать файл'));
      r.readAsDataURL(file);
    });
    const id=_id();
    const {error}=await sb.from('delivery_files').insert({
      id,
      file_name:file.name,
      mime_type:file.type||'application/octet-stream',
      data:dataUrl,
      size_bytes:file.size||0,
    });
    if(error)throw error;
    return id;
  },
  async fetchDeliveryFile(fileId){
    /* Возвращает {data, file_name, mime_type} или null */
    const {data,error}=await sb.from('delivery_files').select('data,file_name,mime_type').eq('id',fileId).maybeSingle();
    if(error){console.warn('fetch file failed',error);return null}
    return data||null;
  },
  async deleteDeliveryFile(fileId){
    if(!fileId)return;
    const {error}=await sb.from('delivery_files').delete().eq('id',fileId);
    if(error)console.warn('delete file failed',error);
  },

  /* Legacy Storage (на случай, если Supabase Storage оживёт) */
  async getDeliveryFileUrl(path){
    if(!path)return '';
    const {data}=sb.storage.from('delivery-files').getPublicUrl(path);
    return data.publicUrl;
  },
  async removeDeliveryFile(path){
    if(!path)return;
    try{await sb.storage.from('delivery-files').remove([path])}catch(_){}
  },

  /* ── USER SETTINGS (Этап 6) ─────────────────────────────────────
     Per-user данные: масштаб Ганта, фильтры, свёрнутые заказы,
     рабочие субботы. Триггер handle_new_user из SQL Этапа 1 уже
     создал строку в user_settings при первом логине, так что
     select по user_id вернёт либо запись, либо null. */
  async loadUserSettings(){
    if(!CURRENT_USER)return null;
    const {data,error}=await sb.from('user_settings').select('*').eq('user_id',CURRENT_USER.id).maybeSingle();
    if(error)throw error;
    return data;
  },
  async saveUserSettings(patch){
    if(!CURRENT_USER)return;
    const row={user_id:CURRENT_USER.id,...patch};
    const {error}=await sb.from('user_settings').upsert(row,{onConflict:'user_id'});
    if(error)throw error;
  },
};

/* ── DB <-> JS mapping ─────────────────────────────────────────────
   Преобразование между snake_case колонками Supabase и camelCase
   полями приложения. Иерархия order→suborders→stages разбирается
   по primary/foreign key. Поле `collapsed` per-user и не идёт в БД —
   при загрузке проставляется default false (восстановится из
   user_settings отдельным этапом). У stage `id` — семантический
   код ('cutting','design'...) для existing code; `uid` — PK в БД. */
function ord2db(o){return{
  id:o.id, name:o.name, client:o.client||'', start_date:o.start,
  kb_col:o.kbCol, deadline:o.deadline||{mode:'date',value:''},
  seq:o.seq||0, kb_col_at:o.kbColEnteredAt||null,
  needs_info:!!o.needsInfo, gap_note:o.gapNote||'',
  assignee:o.assignee||'', purchasing:o.purchasing||null,
}}
function sub2db(s,orderId,seq){return{
  id:s.id, order_id:orderId, name:s.name,
  qty:s.qty||{sheets:0,edgeMeters:0,parts:0}, seq,
}}
function stage2db(st,subId,seq){return{
  id:st.uid, suborder_id:subId, stage_id:st.id,
  start_date:st.start, end_date:st.end,
  status:st.status||'pending', note:st.note||'',
  wd:st.wd||1, start_hour:st.startHour??null,
  duration_hours:st.durationHours??null, seq,
  assignees:Array.isArray(st.assignees)?st.assignees:[],
}}
function db2ord(row,subs,stagesBySub){return{
  id:row.id, name:row.name, client:row.client||'',
  start:row.start_date, kbCol:row.kb_col, seq:row.seq||0,
  deadline:row.deadline, kbColEnteredAt:row.kb_col_at||dk(TODAY),
  needsInfo:!!row.needs_info, gapNote:row.gap_note||'',
  assignee:row.assignee||'', purchasing:row.purchasing,
  collapsed:false,  /* per-user → Этап позже */
  suborders:subs.slice().sort((a,b)=>a.seq-b.seq).map(s=>({
    id:s.id, name:s.name, qty:s.qty,
    stages:(stagesBySub[s.id]||[]).slice().sort((a,b)=>a.seq-b.seq).map(x=>({
      id:x.stage_id, uid:x.id,
      start:x.start_date, end:x.end_date,
      status:x.status, note:x.note||'',
      wd:x.wd, startHour:x.start_hour, durationHours:x.duration_hours,
      assignees:Array.isArray(x.assignees)?x.assignees:[],
    })),
  })),
}}

/* ══════════════════════════════════════════════
   AUTO-SAVE (Этап 3)
   После каждого render() сравниваем S.orders с last-known snapshot.
   Изменения помечаются в _dirty, удалённые — в _deleted. Сохранение
   через 400мс дебаунс одним пакетом. При ошибке dirty не очищается —
   следующая попытка пройдёт автоматически.
══════════════════════════════════════════════ */
const _snap=new Map();      /* orderId -> JSON snapshot */
const _dirty=new Set();     /* orderId waiting to be saved */
const _deleted=new Set();   /* orderId waiting to be deleted from DB */
const _supSnap=new Map();   /* supplierId -> JSON snapshot */
const _supDirty=new Set();
const _supDeleted=new Set();
const _cliSnap=new Map();   /* clientId -> JSON snapshot */
const _cliDirty=new Set();
const _cliDeleted=new Set();
const _empSnap=new Map();   /* employeeId -> JSON snapshot */
const _empDirty=new Set();
const _empDeleted=new Set();
let _saveTimer=null;
let _saving=false;

/* User settings — отдельный snapshot, отдельная пометка */
let _settingsSnap='';
let _settingsDirty=false;

function snapOrder(o){return JSON.stringify(o)}
function snapItem(x){return JSON.stringify(x)}
function captureSnapshots(){
  _snap.clear();
  S.orders.forEach(o=>_snap.set(o.id,snapOrder(o)));
  _supSnap.clear();
  S.suppliers.forEach(s=>_supSnap.set(s.id,snapItem(s)));
  _cliSnap.clear();
  S.clients.forEach(c=>_cliSnap.set(c.id,snapItem(c)));
  _empSnap.clear();
  S.employees.forEach(e=>_empSnap.set(e.id,snapItem(e)));
}
function detectChanges(){
  const live=new Set(S.orders.map(o=>o.id));
  for(const id of _snap.keys()){
    if(!live.has(id)){_deleted.add(id);_snap.delete(id)}
  }
  S.orders.forEach(o=>{
    const cur=snapOrder(o);
    if(_snap.get(o.id)!==cur){_dirty.add(o.id);_snap.set(o.id,cur)}
  });
  /* Suppliers */
  const liveS=new Set(S.suppliers.map(s=>s.id));
  for(const id of _supSnap.keys()){
    if(!liveS.has(id)){_supDeleted.add(id);_supSnap.delete(id)}
  }
  S.suppliers.forEach(s=>{
    const cur=snapItem(s);
    if(_supSnap.get(s.id)!==cur){_supDirty.add(s.id);_supSnap.set(s.id,cur)}
  });
  /* Clients */
  const liveC=new Set(S.clients.map(c=>c.id));
  for(const id of _cliSnap.keys()){
    if(!liveC.has(id)){_cliDeleted.add(id);_cliSnap.delete(id)}
  }
  S.clients.forEach(c=>{
    const cur=snapItem(c);
    if(_cliSnap.get(c.id)!==cur){_cliDirty.add(c.id);_cliSnap.set(c.id,cur)}
  });
  /* Employees */
  const liveE=new Set(S.employees.map(e=>e.id));
  for(const id of _empSnap.keys()){
    if(!liveE.has(id)){_empDeleted.add(id);_empSnap.delete(id)}
  }
  S.employees.forEach(e=>{
    const cur=snapItem(e);
    if(_empSnap.get(e.id)!==cur){_empDirty.add(e.id);_empSnap.set(e.id,cur)}
  });
  /* User settings */
  if(CURRENT_USER){
    const cur=JSON.stringify(serializeUserSettings());
    if(_settingsSnap!==cur){_settingsDirty=true;_settingsSnap=cur}
  }
}
function scheduleSave(){
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(flushSave,400);
}
async function flushSave(){
  _saveTimer=null;
  if(_saving)return scheduleSave();
  const hasOrderWork=_dirty.size>0||_deleted.size>0;
  const hasSupWork=_supDirty.size>0||_supDeleted.size>0;
  const hasCliWork=_cliDirty.size>0||_cliDeleted.size>0;
  const hasEmpWork=_empDirty.size>0||_empDeleted.size>0;
  if(!hasOrderWork&&!hasSupWork&&!hasCliWork&&!hasEmpWork&&!_settingsDirty){setSyncStatus('idle');return}
  _saving=true;setSyncStatus('saving');
  const dirty=[..._dirty]; const del=[..._deleted]; const sDirty=_settingsDirty;
  const supD=[..._supDirty]; const supDel=[..._supDeleted];
  const cliD=[..._cliDirty]; const cliDel=[..._cliDeleted];
  const empD=[..._empDirty]; const empDel=[..._empDeleted];
  _dirty.clear(); _deleted.clear(); _settingsDirty=false;
  _supDirty.clear(); _supDeleted.clear();
  _cliDirty.clear(); _cliDeleted.clear();
  _empDirty.clear(); _empDeleted.clear();
  try{
    for(const id of del){await db.deleteOrder(id)}
    for(const id of dirty){
      const o=S.orders.find(x=>x.id===id);
      if(o)await db.saveOrder(o);
    }
    for(const id of supDel){await db.deleteSupplier(id)}
    for(const id of supD){
      const s=S.suppliers.find(x=>x.id===id);
      if(s)await db.saveSupplier(s);
    }
    for(const id of cliDel){await db.deleteClient(id)}
    for(const id of cliD){
      const c=S.clients.find(x=>x.id===id);
      if(c)await db.saveClient(c);
    }
    for(const id of empDel){await db.deleteEmployee(id)}
    for(const id of empD){
      const e=S.employees.find(x=>x.id===id);
      if(e)await db.saveEmployee(e);
    }
    if(sDirty)await db.saveUserSettings(serializeUserSettings());
    setSyncStatus('saved');
  }catch(e){
    console.error('save failed',e);
    dirty.forEach(id=>_dirty.add(id));
    del.forEach(id=>_deleted.add(id));
    supD.forEach(id=>_supDirty.add(id));
    supDel.forEach(id=>_supDeleted.add(id));
    cliD.forEach(id=>_cliDirty.add(id));
    cliDel.forEach(id=>_cliDeleted.add(id));
    empD.forEach(id=>_empDirty.add(id));
    empDel.forEach(id=>_empDeleted.add(id));
    if(sDirty)_settingsDirty=true;
    setSyncStatus('error',e.message||String(e));
    setTimeout(scheduleSave,3000);
  }finally{
    _saving=false;
  }
}

/* Индикатор синхронизации в правом нижнем углу. */
let _syncEl=null;
function ensureSyncEl(){
  if(_syncEl)return _syncEl;
  _syncEl=document.createElement('div');
  _syncEl.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);border:1px solid var(--bg4);border-radius:999px;font-size:11px;color:var(--text3);font-family:JetBrains Mono,monospace;opacity:.85;transition:opacity .2s';
  const dot=document.createElement('span');dot.id='_syncDot';
  dot.style.cssText='width:8px;height:8px;border-radius:50%;background:#484f58;display:inline-block;pointer-events:none';
  const txt=document.createElement('span');txt.id='_syncTxt';txt.textContent='готово';
  txt.style.pointerEvents='none';
  /* Кнопка logout справа от индикатора */
  const logout=document.createElement('span');
  logout.textContent='Выйти';
  logout.title=CURRENT_USER?CURRENT_USER.email:'';
  logout.style.cssText='color:var(--text3);cursor:pointer;padding-left:8px;border-left:1px solid var(--bg4);margin-left:2px';
  logout.onclick=()=>{if(confirm('Выйти из приложения?'))db.signOut()};
  _syncEl.append(dot,txt,logout);
  document.body.appendChild(_syncEl);
  return _syncEl;
}
function setSyncStatus(kind,msg){
  ensureSyncEl();
  const dot=document.getElementById('_syncDot');
  const txt=document.getElementById('_syncTxt');
  const map={
    idle:   ['#484f58','готово'],
    saving: ['#e3b341','сохраняю…'],
    saved:  ['#3fb950','сохранено'],
    syncing:['#58a6ff','обновляю…'],
    error:  ['#f85149','ошибка']
  };
  const [c,t]=map[kind]||map.idle;
  dot.style.background=c;
  txt.textContent=msg?t+' ('+msg.slice(0,40)+')':t;
  if(kind==='saved'||kind==='syncing')setTimeout(()=>{if(_dirty.size===0&&_deleted.size===0&&!_reloadTimer)setSyncStatus('idle')},1500);
}

/* ══════════════════════════════════════════════
   REALTIME RELOAD (Этап 4)
   На любое событие Realtime ставится дебаунсный таймер. По его
   истечении — полная перезагрузка S.orders, ЕСЛИ нет конфликтов:
   нет своих pending changes и не открыта модалка (иначе фон
   "прыгал" бы под открытой формой).
══════════════════════════════════════════════ */
let _reloadTimer=null;
function scheduleReload(){
  if(_reloadTimer)return;
  _reloadTimer=setTimeout(reloadAll,600);
}
async function reloadAll(){
  _reloadTimer=null;
  /* Откладываем, если в полёте свои save или открыта модалка */
  if(_saving||_dirty.size>0||_deleted.size>0||S.modal){
    _reloadTimer=setTimeout(reloadAll,1000);
    return;
  }
  try{
    setSyncStatus('syncing');
    const loaded=await db.loadOrders();
    S.orders=loaded;
    S.orders.forEach(ensureOrderPurchasing);
    captureSnapshots();  /* фиксируем «=в БД» чтобы detectChanges не помечал */
    render();
    setSyncStatus('idle');
  }catch(e){
    console.error('reload failed',e);
    setSyncStatus('error',e.message||String(e));
  }
}

/* ══════════════════════════════════════════════
   DATE HELPERS
══════════════════════════════════════════════ */
function isWE(d){
  const dt=new Date(d);
  const w=dt.getDay();
  if(w===0) return true;                              // Sunday always off
  if(w===6) return !S.workingSaturdays.includes(dk(dt)); // Saturday: off unless this date marked working
  return false;
}
function isWorkingSat(d){
  const dt=new Date(d);
  return dt.getDay()===6 && S.workingSaturdays.includes(dk(dt));
}
function calAdd(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function dk(d){return new Date(d).toISOString().slice(0,10)}
function nw(d){let r=new Date(d);while(isWE(r))r=calAdd(r,1);return r}
function prevWork(d){let r=new Date(d);while(isWE(r))r=calAdd(r,-1);return r}
function subWD(date,wd){let d=new Date(date),s=0;while(s<wd){d=calAdd(d,-1);if(!isWE(d))s++}return d}
function awdFromDate(start,wd){let d=new Date(start),a=0;while(a<wd){d=calAdd(d,1);if(!isWE(d))a++}return d}

/* Visual exclusive end for bar rendering:
   day AFTER the last working day the stage occupies.
   Example: Thu+Fri work (end=Mon) → visEnd=Saturday, bar stops at Fri right edge. */
function stageVisEnd(stage){
  const lastWD=prevWork(calAdd(new Date(stage.end),-1));
  return calAdd(lastWD,1);
}
/* Резолв сотрудника по идентификатору. v может быть UUID (новый формат)
   или legacy строкой "Имя_Роль" (до миграции). Возвращает {name, role}. */
function resolveEmployee(v){
  if(!v)return{name:'',role:''};
  const e=(S.employees||[]).find(x=>x.id===v);
  if(e)return{name:e.name||'',role:e.role||''};
  const parts=String(v).split('_');
  return{name:parts[0]||v,role:parts.slice(1).join('_')||''};
}
/* Проверка занятости сотрудника. Возвращает {order,sub,stage} первого
   пересечения с другим этапом, где user уже назначен. Если свободен — null.
   Параметр selfUid — id текущего редактируемого этапа (исключаем из поиска,
   чтобы он не считался конфликтом с самим собой). */
function findUserConflict(userVal,startStr,endStr,selfUid){
  const a1=new Date(startStr),a2=new Date(endStr);
  for(const o of S.orders){
    if(o.kbCol==='new')continue;  /* черновики ещё не занимают мощность */
    for(const s of o.suborders){
      for(const st of s.stages){
        if(st.uid===selfUid)continue;
        if(!Array.isArray(st.assignees)||!st.assignees.includes(userVal))continue;
        const b1=new Date(st.start),b2=new Date(st.end);
        /* пересечение полуоткрытых интервалов [a1,a2) и [b1,b2) */
        if(a1<b2&&b1<a2)return{order:o,sub:s,stage:st};
      }
    }
  }
  return null;
}
/* Бейдж со списком ответственных в правом верхнем углу бара.
   • 0 чел: 🏳 (белый флаг — индикатор «нет назначенного»).
   • 1 чел: инициалы (например, «ПП»).
   • 2+ чел: «N 👤» (число + значок).
   Если бар уже 40px — бейдж не рисуется, чтобы не наезжать на ресайз. */
function appendAssigneesBadge(bar,stage){
  const bw=parseFloat(bar.style.width);
  if(!bw||bw<40)return;
  const arr=Array.isArray(stage.assignees)?stage.assignees:[];
  const badge=document.createElement('div');
  if(arr.length===0){
    /* Красная точка слева — индикатор «нет назначенного ответственного».
       Стоит у левого края бара, ярко выделяется на любом цвете этапа. */
    badge.title='Этап без назначенного ответственного';
    badge.style.cssText='position:absolute;top:50%;left:-4px;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:#f85149;box-shadow:0 0 6px rgba(248,81,73,.9),0 0 0 1.5px var(--bg);pointer-events:none;z-index:6';
    bar.appendChild(badge);
    return;
  }
  if(arr.length===1){

const HOUR_THRESHOLD=150; /* legacy threshold, no longer used for mode switching */
/* Non-linear timeline:
   - Weekend days take WEEKEND_SCALE of a normal weekday width.
   - Off-hours within a weekday take OFFHOUR_SCALE of a normal work-hour width.
   - Work hours and lunch keep full width. */
const WEEKEND_SCALE=0.3;
const OFFHOUR_SCALE=0.15;
function dayPx(){return S.dayW}
function hourPx(){return S.dayW/24}

function dayWidthFor(d){return isWE(d)?S.dayW*WEEKEND_SCALE:S.dayW}
/* px per hour of WORK time (8..17 by default) on a weekday */
function normalHourPx(){
  const vis=S.workEnd-S.workStart;

function offHourPx(){return normalHourPx()*OFFHOUR_SCALE}
/* pixel offset of hour h inside the column of date d (0..dayWidthFor(d)) */
function hourOffsetIn(d,h){
  if(isWE(d))return(h/24)*dayWidthFor(d);
  const ws=S.workStart,we=S.workEnd;
  const nH=normalHourPx(),oH=offHourPx();
  if(h<=ws)return h*oH;
  if(h<=we)return ws*oH+(h-ws)*nH;
  return ws*oH+(we-ws)*nH+(h-we)*oH;

/* inverse of hourOffsetIn: pixel offset within day → decimal hour 0..24 */
function pxToHourIn(d,offset){
  if(isWE(d))return Math.max(0,Math.min(24,(offset/dayWidthFor(d))*24));
  const ws=S.workStart,we=S.workEnd;
  const nH=normalHourPx(),oH=offHourPx();
  const mornEnd=ws*oH;
  if(offset<=mornEnd)return offset/oH;
  let rem=offset-mornEnd;
  const workSpan=(we-ws)*nH;
  if(rem<=workSpan)return ws+rem/nH;
  rem-=workSpan;
  return Math.min(24,we+rem/oH);

/* Обратное к pxToHourIn: (date, hour) → x внутри dayCell. Используется
   для live-snap во время resize, чтобы бар скакал по 0.5ч квантам. */
function hourToPxIn(d,h){
  h=Math.max(0,Math.min(24,h));
  if(isWE(d))return h*dayWidthFor(d)/24;
  const ws=S.workStart,we=S.workEnd;
  const nH=normalHourPx(),oH=offHourPx();
  if(h<=ws)return h*oH;
  if(h<=we)return ws*oH+(h-ws)*nH;
  return ws*oH+(we-ws)*nH+(h-we)*oH;

  let cur=new Date(rng.min),x=0;
  for(let i=0;i<3650;i++){
    const w=dayWidthFor(cur);
    if(px<x+w)return{date:cur,offset:Math.max(0,px-x),width:w};
    x+=w;cur=calAdd(cur,1);

/* Monotonic forward auto-update of order.kbCol based on its sub statuses.

  const fromIdx=KB_COLS.findIndex(c=>c.id===order.kbCol);
  if(fromIdx<0)return;

    const eff=autoSubStatus(sub);
    if(!eff)return;
    const idx=KB_COLS.findIndex(c=>c.id===eff);

    const e=new Date(sub.stages[sub.stages.length-1].end);return e>mx?e:mx;

  const dlD=deadlineDate(order.deadline,order.start);

  for(const sub of order.suborders){

    const aeMs=new Date(ae.date).getTime()+ae.hour*3600000;

/* ── Stage scheduling groups ── */
const SCHED_CHAIN   = ['cutting','finishing','painting','edging','drilling']; // sequential within parallel block
const SCHED_PARALLEL= ['materials'];   // runs in parallel to CHAIN
const SCHED_POST    = ['assembly','qc','packaging','delivery','install'];     // after parallel block
const SCHED_PRE     = ['design'];                                             // before everything

function defaultDurH(def){
  const wdH=S.workEnd-S.workStart-(S.lunchEnd-S.lunchStart);
  return Math.max(1,def.wd*Math.max(1,wdH));
}

/* Build stages backwards from deadline with parallel support.
   wdOverrides (optional): {stageId: wd} — use these working-day counts instead
   of STAGE_DEFS.wd. orderStart (optional): if provided, design is anchored to
   order.start (forward), and materials stretches from design.end to the start
   of the POST block (assembly start). */
function buildStagesBackwards(ids,deadlineStr,wdOverrides,orderStart){
  const present=new Set(ids);
  const dl=prevWork(new Date(deadlineStr));
  const sd={};
  const wdOf=id=>{
    if(wdOverrides&&wdOverrides[id]!=null)return wdOverrides[id];
    return STAGE_DEFS.find(s=>s.id===id).wd;
  };
  /* POST: install→delivery→packaging→qc→assembly backwards from deadline */
  let cursor=new Date(dl);
  SCHED_POST.filter(id=>present.has(id)).reverse().forEach(id=>{
    const w=wdOf(id);
    const end=new Date(cursor);
    const start=prevWork(subWD(cursor,w));
    sd[id]={start:dk(start),end:dk(end),wd:w};
    cursor=new Date(start);
  });
  const blockEnd=new Date(cursor); // earliest POST start = where CHAIN/PARALLEL end

  /* CHAIN: cutting→finishing→painting→edging→drilling backwards from blockEnd */
  let chainCursor=new Date(blockEnd);
  SCHED_CHAIN.filter(id=>present.has(id)).slice().reverse().forEach(id=>{
    const w=wdOf(id);
    const end=new Date(chainCursor);
    const start=prevWork(subWD(chainCursor,w));
    sd[id]={start:dk(start),end:dk(end),wd:w};
    chainCursor=new Date(start);
  });
  const chainStart=new Date(chainCursor);

  /* DESIGN (PRE): anchored to order.start when provided, length wdOf('design')
     (default 3 working days). Falls back to backwards placement if no anchor. */
  let designEnd=null;
  if(present.has('design')){
    const w=wdOf('design');
    let startD,endD;
    if(orderStart){
      startD=nw(new Date(orderStart));
      endD=awdFromDate(startD,w);
    } else {
      const matStartBack=prevWork(subWD(blockEnd,wdOf('materials')));
      const preEnd=new Date(Math.min(chainStart.getTime(),matStartBack.getTime()));
      startD=prevWork(subWD(preEnd,w));
      endD=preEnd;
    }
    sd['design']={start:dk(startD),end:dk(endD),wd:w};
    designEnd=new Date(endD);
  }

  /* MATERIALS (PARALLEL): from design.end (or order.start) to blockEnd, taking
     the full available window. wd is recomputed from actual span. */
  if(present.has('materials')){
    let startM;
    if(designEnd)startM=nw(new Date(designEnd));
    else if(orderStart)startM=nw(new Date(orderStart));
    else startM=prevWork(subWD(blockEnd,wdOf('materials')));
    let endM=new Date(blockEnd);
    if(endM<=startM){
      // window collapsed — fall back to default length
      endM=awdFromDate(startM,wdOf('materials'));
    }
    const matWD=Math.max(1,countWD(dk(startM),dk(endM)));
    sd['materials']={start:dk(startM),end:dk(endM),wd:matWD};
  }

  /* Build in canonical STAGE_DEFS order. durationHours seeded later in mkSub
     / recomputeAllOrders, where materials gets its hour-precise duration. */
  return STAGE_DEFS.filter(def=>present.has(def.id)).map(def=>{
    const w=wdOf(def.id);
    const d=sd[def.id]||{start:dk(dl),end:dk(awdFromDate(dl,w)),wd:w};
    return{id:def.id,wd:d.wd,start:d.start,end:d.end,
      status:'pending',note:'',startHour:S.workStart,durationHours:null,
      ...(def.id==='materials'?{matDelivery:'',hwDelivery:''}:{})};
  });
}

/* Forward builder (fallback when no deadline) */
function buildStagesForward(ids,startStr){
  let cur=nw(new Date(startStr));
  return ids.map(id=>{
    const def=STAGE_DEFS.find(s=>s.id===id);
    const s=new Date(cur),e=awdFromDate(cur,def.wd);
    cur=nw(new Date(e));
    return{id,wd:def.wd,start:dk(s),end:dk(e),status:'pending',note:'',
      startHour:S.workStart,durationHours:null,
      ...(id==='materials'?{matDelivery:'',hwDelivery:''}:{})};
  });
}

function mkSub(name,stageIds,startStr,qty,deadlineStr){

function mkOrder(name,client,startStr,kbCol,deadline,subDefs,opts){

function cascadeFwd(subs,fromSubIdx,fromStageIdx){
  // cascade stages within a sub
  for(let si=fromSubIdx;si<subs.length;si++){
    const sub=subs[si];
    const startI=si===fromSubIdx?fromStageIdx:0;
    for(let i=startI;i<sub.stages.length;i++){
      if(i===0&&si===fromSubIdx)continue;
      const prev=i===0?null:sub.stages[i-1];
      if(!prev)continue;
      const ms=nw(new Date(prev.end));
      const s=sub.stages[i];
      if(new Date(s.start)<ms){s.start=dk(ms);s.end=dk(awdFromDate(ms,s.wd))}
    }

/* Re-plan every sub with a deadline using buildStagesBackwards, preserving each

/* Migration: ensure every order has a .purchasing stage object. Existing orders
   loaded from older data (or demo orders that pre-date this feature) get one

function ensureOrderPurchasing(order){
  /* Если закупка явно отключена пользователем — не пересоздаём её и не
     валидируем дальше. Признак: order.purchasingDisabled === true. */
  if(order.purchasingDisabled){
    order.purchasing=null;
    return null;
  }
  if(!order.purchasing){
    const lunchLen=Math.max(0,S.lunchEnd-S.lunchStart);
    const workHoursInDay=Math.max(1,S.workEnd-S.workStart-lunchLen);
    const purchWD=STAGE_DEFS.find(d=>d.id==='materials').wd;
    const ps=nw(new Date(order.start));
    order.purchasing={id:'materials',start:dk(ps),end:dk(awdFromDate(ps,purchWD)),
      status:'pending',note:'',wd:purchWD,startHour:S.workStart,durationHours:purchWD*workHoursInDay,
      matDelivery:'',hwDelivery:'',paintDelivery:'',deliveries:[]};
  }
  /* Migration: convert legacy scalar matDelivery/hwDelivery/paintDelivery fields
     into the deliveries[] array (one entry each), then keep the scalars in
     sync with the first matching entry so older code paths still work. */
  if(!Array.isArray(order.purchasing.deliveries)){
    order.purchasing.deliveries=[];
  }
  /* Custom delivery types: добавляются менеджером в дополнение к встроенным
     ('mat','hw','paint'). Хранятся per-order в purchasing.customTypes:
     [{id:'ct_XXX', lbl, icon, color}]. */
  if(!Array.isArray(order.purchasing.customTypes)){

function recomputeAllOrders(){
  const workH=Math.max(1,S.workEnd-S.workStart-(S.lunchEnd-S.lunchStart));
  S.orders.forEach(order=>{
    /* Orders sitting in 'Новые' are not planned at all — they don't yet count
       against shop capacity and can't conflict with active orders. */
    if(order.kbCol==='new')return;
    const dlDate=deadlineDate(order.deadline,order.start);
    if(!dlDate)return; // no deadline → nothing to anchor against, leave as-is
    const dlStr=dk(dlDate);
    order.suborders.forEach(sub=>{
      const ids=sub.stages.map(s=>s.id);
      const wdOverrides={};
      sub.stages.forEach(st=>{
        /* materials length is dynamic (design.end..assembly.start) — let
           buildStagesBackwards compute it. Don't override. */
        if(st.id==='materials')return;
        const dh=computeStageDurH(st,sub);
        wdOverrides[st.id]=Math.max(1,Math.ceil(dh/workH));
      });
      const exMap=Object.fromEntries(sub.stages.map(s=>[s.id,s]));
      const fresh=buildStagesBackwards(ids,dlStr,wdOverrides,order.start);
      sub.stages=fresh.map(s=>{
        const ex=exMap[s.id];
        const merged={...s,
          status:ex?.status||'pending',
          note:ex?.note||'',
          startHour:ex?.startHour??s.startHour,
          durationHours:ex?.durationHours??s.durationHours,
          matDelivery:ex?.matDelivery||'',
          hwDelivery:ex?.hwDelivery||'',
          /* Сохраняем UID (иначе recalc создаст новые UUID в БД и отвяжет
             все связки), массив ответственных и доставки этапа. */
          uid:ex?.uid||s.uid,
          assignees:Array.isArray(ex?.assignees)?ex.assignees.slice():(Array.isArray(s.assignees)?s.assignees:[]),
          deliveries:Array.isArray(ex?.deliveries)?ex.deliveries:(Array.isArray(s.deliveries)?s.deliveries:[]),
        };
        if(s.id==='materials'){
          /* Recalc duration to the fresh window so the bar stretches under the
             new design/assembly placement. */
          const dh=workingHoursBetween(s.start,S.workStart,s.end,S.workStart);
          merged.durationHours=Math.max(0.5,dh||workH*s.wd);
        }
        return merged;
      });
      sub.stages.forEach(st=>syncStageEnd(st,sub));
    });
    /* Sync purchasing start with the (possibly updated) order.start. Length
       preserved from order.purchasing.wd. */
    if(order.purchasing){
      const ps=nw(new Date(order.start));
      order.purchasing.start=dk(ps);
      const pw=order.purchasing.wd||STAGE_DEFS.find(d=>d.id==='materials').wd;
      order.purchasing.end=dk(awdFromDate(ps,pw));
    }
  });
}

/* Persistence: timeline scale state (mode + per-mode resolution).
   На Этапе 6 переехало из localStorage в user_settings (per-user, sync
   между устройствами одного юзера). Загрузка происходит в initApp()
   после успешного login. Сохранение — через snapshot-механизм auto-save,
   аналогично orders. Функции saveScaleState/saveWorkSat сохранены как
   no-op для совместимости с существующими вызовами в коде. */
const SCALE_DEFAULTS={month:70,week:295};
function saveScaleState(){/* no-op: auto-save через snapshot подхватит */}
function saveWorkSat(){/* no-op: auto-save через snapshot подхватит */}
function switchScaleMode(mode){
  S.scaleMode=mode;

}
function updateDayW(newW){

/* ── DEVICE SCALE (per-user per-device) ──────────────────────────
   Высота строки в Ганте, ширина колонки и масштаб карточки в Канбане.
   Хранится в localStorage с ключом по user_id, чтобы на разных
   устройствах одного пользователя можно было иметь разное (большой
   монитор vs ноутбук). НЕ синхронизируется через Supabase. */
function deviceScaleKey(field){
  const uid=(CURRENT_USER&&CURRENT_USER.id)||'anon';
  return 'fp_'+field+'_'+uid;
}
function loadDeviceScale(){
  try{
    const rh=+localStorage.getItem(deviceScaleKey('rowH'));
    if(rh>=28&&rh<=72)S.rowH=rh;
    const kw=+localStorage.getItem(deviceScaleKey('kbColW'));
    if(kw>=200&&kw<=420)S.kbColW=kw;
    const cs=+localStorage.getItem(deviceScaleKey('kbCardScale'));
    if(cs>=0.7&&cs<=1.5)S.kbCardScale=cs;
    const as=+localStorage.getItem(deviceScaleKey('assemblyStations'));
    if(as>=1&&as<=20)S.assemblyStations=as;
  }catch(_){}
  applyDeviceScale();
}
function saveDeviceScale(){
  try{
    localStorage.setItem(deviceScaleKey('rowH'),String(S.rowH));
    localStorage.setItem(deviceScaleKey('kbColW'),String(S.kbColW));
    localStorage.setItem(deviceScaleKey('kbCardScale'),String(S.kbCardScale));
    localStorage.setItem(deviceScaleKey('assemblyStations'),String(S.assemblyStations));
  }catch(_){}
}
function applyDeviceScale(){
  /* Sub и order высоты пропорциональны stage: исторически sub=stage+9, order=stage+21 */
  const root=document.documentElement.style;
  root.setProperty('--g-stage-h',S.rowH+'px');
  root.setProperty('--g-sub-h',(S.rowH+9)+'px');
  root.setProperty('--g-order-h',(S.rowH+21)+'px');
  root.setProperty('--kb-col-w',S.kbColW+'px');
  root.setProperty('--kb-card-scale',String(S.kbCardScale));
}
function updateRowH(n){S.rowH=Math.max(28,Math.min(72,n));applyDeviceScale();saveDeviceScale()}
function updateKbColW(n){S.kbColW=Math.max(200,Math.min(420,n));applyDeviceScale();saveDeviceScale()}
function updateKbCardScale(n){S.kbCardScale=Math.max(0.7,Math.min(1.5,Math.round(n*10)/10));applyDeviceScale();saveDeviceScale()}

/* Применяет загруженные user_settings к S. Вызывается в initApp().
   Если row null — это первый вход юзера, остаются default значения. */
function applyUserSettings(row){
  if(!row)return;
  if(row.scale_mode==='month'||row.scale_mode==='week')S.scaleMode=row.scale_mode;
  const dm=+row.day_w_month; if(dm>=20&&dm<=500)S.dayWMonth=dm;
  const dw=+row.day_w_week;  if(dw>=20&&dw<=500)S.dayWWeek=dw;
  S.dayW=S.scaleMode==='week'?S.dayWWeek:S.dayWMonth;
  if(typeof row.view==='string'&&row.view)S.view=row.view;
  if(Array.isArray(row.working_saturdays))S.workingSaturdays=row.working_saturdays.filter(x=>typeof x==='string');
  if(Array.isArray(row.filter_stages))S.filterStages=row.filter_stages.filter(x=>typeof x==='string');
  if(Array.isArray(row.filter_status))S.filterStatus=row.filter_status.filter(x=>typeof x==='string');
  /* collapsed: в существующем коде живёт как мапа S.collapsed[key->bool],
     где key='o'+orderId или 's'+subId. Сохраняется целиком как jsonb-объект
     в колонке collapsed_orders (имя осталось с раннего дизайна). */
  if(row.collapsed_orders&&typeof row.collapsed_orders==='object'&&!Array.isArray(row.collapsed_orders)){
    S.collapsed=row.collapsed_orders;
  }
}

/* Сериализация per-user полей S в формат БД. Используется в auto-save. */
function serializeUserSettings(){
  /* Очищаем S.collapsed от false-значений, чтобы не копился мусор. */
  const coll={};
  if(S.collapsed)Object.keys(S.collapsed).forEach(k=>{if(S.collapsed[k])coll[k]=true});
  return {
    collapsed_orders:coll,
    filter_stages:S.filterStages||[],
    filter_status:S.filterStatus||[],
    scale_mode:S.scaleMode||'month',
    day_w_month:S.dayWMonth||SCALE_DEFAULTS.month,
    day_w_week:S.dayWWeek||SCALE_DEFAULTS.week,
    working_saturdays:Array.isArray(S.workingSaturdays)?S.workingSaturdays:[],
    view:S.view||'gantt',
  };
}

/* Однократная миграция: если в localStorage остались legacy ключи
   fp_*, переносим их в settings и удаляем. Это нужно для пользователей,
   которые уже пользовались приложением до миграции. */
async function migrateLegacyLocalStorage(){
  let migrated=false;
  try{
    const sm=localStorage.getItem('fp_scaleMode');
    if(sm){S.scaleMode=sm;migrated=true}
    const dm=+localStorage.getItem('fp_dayWMonth');
    if(dm>=20&&dm<=500){S.dayWMonth=dm;migrated=true}
    const dw=+localStorage.getItem('fp_dayWWeek');
    if(dw>=20&&dw<=500){S.dayWWeek=dw;migrated=true}
    const ws=localStorage.getItem('fp_workSat');
    if(ws){const arr=JSON.parse(ws);if(Array.isArray(arr)){S.workingSaturdays=arr;migrated=true}}
  }catch(_){}
  if(migrated){
    S.dayW=S.scaleMode==='week'?S.dayWWeek:S.dayWMonth;
    try{await db.saveUserSettings(serializeUserSettings());}catch(_){}
    ['fp_scaleMode','fp_dayWMonth','fp_dayWWeek','fp_workSat'].forEach(k=>{try{localStorage.removeItem(k)}catch(_){}});
  }
}
