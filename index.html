  if(ps.status==='inprogress')stDot.style.boxShadow='0 0 0 2px var(--accent)';
  else if(ps.status==='done')stDot.style.opacity='.4';
  else if(ps.status==='blocked')stDot.style.background='#f85149';
  stDot.onclick=e=>{e.stopPropagation();openModal({type:'editPurchasing',orderId:order.id})};
  lp.appendChild(stDot);
  /* label */
  const lbl=el('div','stage-lbl');
  lbl.appendChild(tx('span','','🛒 Закупка'));
  lp.appendChild(lbl);
  /* edit button */
  const eb=el('button','btn ic sm');eb.textContent='✏';
  eb.onclick=e=>{e.stopPropagation();openModal({type:'editPurchasing',orderId:order.id})};
  lp.appendChild(eb);
  lpR.appendChild(lp);
}


/* ══════════════════════════════════════════════
   KANBAN VIEW
══════════════════════════════════════════════ */
/* Shared kanban drag state — closure variable is more reliable across browsers
   than dataTransfer.getData (some browsers/security modes return empty in drop). */
let _kbDraggingOrderId=null;
function renderKanban(main){
  const wrap=el('div','kanban-wrap');
  /* First-pass: recalc auto-status for all orders (monotonic forward only).
     This handles the case where time has passed and a stage is now active
     (no manual status change happened, but the order should still move). */
  S.orders.forEach(recalcOrderKbCol);
  /* For each order, group its subs by effective kanban column.
     Effective = autoSubStatus(sub) if any rule fires, else order.kbCol. */
  const ordersByCol={}; // colId -> [{order, subs, isFull}, ...]
  KB_COLS.forEach(c=>{ordersByCol[c.id]=[]});
  S.orders.forEach(order=>{
    const byCol=new Map();
    order.suborders.forEach(sub=>{
      const eff=autoSubStatus(sub)||order.kbCol;
      if(!byCol.has(eff))byCol.set(eff,[]);
      byCol.get(eff).push(sub);
    });
    byCol.forEach((subs,colId)=>{
      if(!ordersByCol[colId])return;
      const isFull=subs.length===order.suborders.length;
      ordersByCol[colId].push({order,subs,isFull});
    });
  });
  KB_COLS.forEach(col=>{
    const items=ordersByCol[col.id]||[];
    /* Sort items by deadline of the underlying order */
    items.sort((a,b)=>{
      const ad=deadlineDate(a.order.deadline,a.order.start);
      const bd=deadlineDate(b.order.deadline,b.order.start);
      if(ad&&bd){const d=ad-bd;if(d)return d}
      else if(ad&&!bd)return -1;
      else if(!ad&&bd)return 1;
      return new Date(a.order.start)-new Date(b.order.start);
    });
    const kc=el('div','kb-col');
    const kh=el('div','kb-col-head');
    const dot=el('div','');dot.style.cssText=`width:10px;height:10px;border-radius:50%;background:${col.color};flex-shrink:0`;
    kh.appendChild(dot);kh.appendChild(tx('span','kb-col-title',col.lbl));
    kh.appendChild(tx('span','kb-count',String(items.length)));
    kc.appendChild(kh);
    const cards=el('div','kb-cards');

    /* Drag-and-drop */
    kc.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      kc.classList.add('kb-col-drop');
    });
    kc.addEventListener('dragleave',e=>{
      if(!kc.contains(e.relatedTarget))kc.classList.remove('kb-col-drop');
    });
    kc.addEventListener('drop',e=>{
      e.preventDefault();
      kc.classList.remove('kb-col-drop');
      let draggedId=_kbDraggingOrderId;
      if(!draggedId){
        const raw=e.dataTransfer.getData('text/plain');
        draggedId=+raw||null;
      }
      if(!draggedId){_kbDraggingOrderId=null;return}
      const dragged=S.orders.find(o=>o.id===draggedId);
      if(!dragged){_kbDraggingOrderId=null;return}
      if(dragged.kbCol!==col.id){
        if(!attemptKbMove(dragged,col.id)){_kbDraggingOrderId=null;return}
      }
      _kbDraggingOrderId=null;
      render();
    });

    items.forEach(({order,subs,isFull})=>{
      const card=mkKbCard(order,col.id,subs,isFull);
      cards.appendChild(card);
    });
    kc.appendChild(cards);wrap.appendChild(kc);
  });
  main.appendChild(wrap);
}

function mkKbCard(order,colId,subsToShow,isFull){
  subsToShow=subsToShow||order.suborders;
  if(isFull===undefined)isFull=subsToShow.length===order.suborders.length;
  const card=el('div','kb-card');
  card.style.borderLeftColor=KB_COLS.find(c=>c.id===colId)?.color||'transparent';
  /* paint/finish top-stripe */
  const {hasPainting,hasFinishing}=hasPaintFinish(order);
  if(hasPainting||hasFinishing){
    const stripe=el('div','');
    stripe.style.cssText='height:3px;margin:-10px -12px 8px;border-radius:var(--r) var(--r) 0 0;';
    stripe.style.background=hasPainting&&hasFinishing
      ?'linear-gradient(to right,#f778ba,#fb923c)'
      :hasPainting?'#fb923c':'#f778ba';
    card.appendChild(stripe);
  }
  /* Drag is allowed only for full cards (whole order in one column).
     Partial cards represent a virtual split — moving them via drag would not
     make sense, since their position is determined by stage states. */
  if(isFull){
    card.setAttribute('draggable','true');
    card.addEventListener('dragstart',e=>{
      _kbDraggingOrderId=order.id;
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',String(order.id));
      card.classList.add('dragging');
    });
    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      _kbDraggingOrderId=null;
    });
  }else{
    card.style.cursor='default';
  }

  /* Manual ↑/↓ seq controls removed — kanban order is now automatic
     (by deadline, then by start date — see kbSortOrders). */

  const titleEl=tx('div','kb-card-title',order.name);
  if(!isFull){
    /* Stable bright hue derived from order.id — same colour across all split
       cards of the same order so the visual link is obvious. */
    const hue=(order.id*47)%360;
    titleEl.style.color=`hsl(${hue},85%,68%)`;
  }
  card.appendChild(titleEl);
  /* Partial-card indicator: client + "часть заказа: 2/3 изделий" */
  if(!isFull){
    const subsLine=el('div','kb-card-client');
    subsLine.innerHTML=order.client+' · <span style="color:var(--accent);font-weight:500">часть: '+subsToShow.length+'/'+order.suborders.length+' изд.</span>';
    card.appendChild(subsLine);
  }else{
    card.appendChild(tx('div','kb-card-client',order.client));
  }

  const meta=el('div','kb-card-meta');
  // deadline
  const dlD=deadlineDate(order.deadline,order.start);
  if(dlD){
    const st=deadlineStatus(order);
    const db=tx('span','kb-card-dl dl-'+st,'⚑ '+(order.deadline.mode==='days'?order.deadline.value+'р.д.':fmtS(dlD)));
    meta.appendChild(db);
  }
  /* Stage counts: only for the subs shown in this card */
  const totalS=subsToShow.reduce((a,s)=>a+s.stages.length,0);
  const doneS=subsToShow.reduce((a,s)=>a+s.stages.filter(x=>x.status==='done').length,0);
  meta.appendChild(tx('span','kb-card-stages',doneS+'/'+totalS+' эт.'));
  card.appendChild(meta);

  /* Critical warning: shown only for orders past 'inwork' (production and later),
     and only if not muted by the user until the next working day. Click hides
     it until the next working day. */
  const colIdx=KB_COLS.findIndex(c=>c.id===colId);
  const mutedUntil=order.behindMutedUntil?new Date(order.behindMutedUntil):null;
  const isMuted=mutedUntil&&TODAY<mutedUntil;
  if(colIdx>1&&isBehindSchedule(order)&&!isMuted){
    const warn=tx('div','kb-behind-schedule','⚠ Не вкладываемся в срок');
    warn.title='Нажмите, чтобы скрыть до следующего рабочего дня';
    warn.style.cursor='pointer';
    warn.onclick=e=>{
      e.stopPropagation();
      const nextWD=nw(calAdd(TODAY,1));
      order.behindMutedUntil=dk(nextWD);
      render();
    };
    card.appendChild(warn);
  }

  // progress % (computed over the subs shown in this card only)
  let totalH=0,doneH=0;
  const NOW=new Date();
  subsToShow.forEach(sub=>sub.stages.forEach(stage=>{
    if(EXCL_PROGRESS.has(stage.id))return;
    const dh=computeStageDurH(stage,sub);
    const ss=stageStartDt(stage),se=stageEndDt(stage);
    totalH+=dh;
    if(se<=NOW)doneH+=dh;
    else if(ss<NOW)doneH+=(NOW-ss)/3600000;
  }));
  const pct=totalH>0?Math.min(100,Math.round(doneH/totalH*100)):0;
  const pctRow=el('div','kb-pct-row');
  const pctNum=tx('span','kb-pct-num',pct+'%');pctRow.appendChild(pctNum);
  const pg=el('div','kb-progress');pg.style.flex='1';
  const pf=el('div','kb-progress-fill');pf.style.width=pct+'%';pg.appendChild(pf);pctRow.appendChild(pg);
  card.appendChild(pctRow);
  /* Currently-active stages within the subs shown */
  const activeIds=new Set();
  subsToShow.forEach(sub=>sub.stages.forEach(st=>{
    const ss=stageStartDt(st),se=stageEndDt(st);
    if(ss<=NOW&&NOW<se)activeIds.add(st.id);
  }));
  const orderedActive=STAGE_DEFS.filter(def=>activeIds.has(def.id));
  if(orderedActive.length){
    const ac=el('div','kb-active-stages');
    const hdr=el('div','kb-active-header');
    hdr.appendChild(document.createTextNode('▶ Сейчас в работе ('+orderedActive.length+')'));
    ac.appendChild(hdr);
    orderedActive.forEach(def=>{
      const row=el('div','kb-active-row');
      row.style.cursor='help';
      const dot=el('div','kb-active-dot');dot.style.background=def.color;row.appendChild(dot);
      const sn=tx('span','kb-active-stage-name',def.lbl);row.appendChild(sn);
      /* For assembly, name the specific products currently being assembled. */
      if(def.id==='assembly'){
        const names=subsToShow.filter(sub=>{
          const asm=sub.stages.find(s=>s.id==='assembly');
          if(!asm)return false;
          const ss=stageStartDt(asm),se=stageEndDt(asm);
          return ss<=NOW&&NOW<se;
        }).map(sub=>sub.name);
        if(names.length){
          row.appendChild(tx('span','kb-active-subs','— '+names.join(', ')));
        }
      }
      /* Tooltip с ответственными за этот этап. Собираем уникальные имена
         по всем активным этапам этого типа во всех изделиях заказа.
         Используем общий #tt-элемент с тем же стилем, что и для Ганта. */
      const activeStagesOfDef=[];
      subsToShow.forEach(sub=>{
        sub.stages.forEach(st=>{
          if(st.id!==def.id)return;
          const ss=stageStartDt(st),se=stageEndDt(st);
          if(ss<=NOW&&NOW<se)activeStagesOfDef.push({sub,stage:st});
        });
      });
      row.addEventListener('mouseenter',ev=>{
        const tt=document.getElementById('tt');if(!tt)return;
        /* Собираем уникальных по идентификатору, помечаем «не назначен» */
        const seen=new Set();
        const lines=[];
        let unassignedCount=0;
        activeStagesOfDef.forEach(({sub,stage})=>{
          const arr=Array.isArray(stage.assignees)?stage.assignees:[];
          if(arr.length===0){unassignedCount++;return}
          arr.forEach(v=>{
            if(seen.has(v))return;
            seen.add(v);
            const u=resolveEmployee(v);
            lines.push('👤 '+u.name+(u.role?' <span style="color:var(--text3);font-size:10px">· '+u.role+'</span>':''));
          });
        });
        const dotHtml='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+def.color+';margin-right:6px;vertical-align:middle"></span>';
        let html='<div class="tt-r" style="font-weight:600">'+dotHtml+def.lbl+'</div>';
        if(lines.length){
          html+='<div class="tt-r" style="color:var(--text2);margin-top:4px">'+lines.join('<br>')+'</div>';
        }
        if(unassignedCount>0){
          html+='<div class="tt-r" style="color:#f85149;margin-top:4px">🏳 '+
            (unassignedCount===1?'Этап без ответственного':unassignedCount+' этапов без ответственного')+'</div>';
        }
        if(!lines.length&&unassignedCount===0){
          html+='<div class="tt-r" style="color:var(--text3)">— нет данных —</div>';
        }
        tt.innerHTML=html;
        tt.style.display='block';
        let x=ev.clientX+14,y=ev.clientY+14;
        if(x+260>window.innerWidth)x=ev.clientX-260-14;
        if(y+120>window.innerHeight)y=ev.clientY-120-14;
        tt.style.left=x+'px';tt.style.top=y+'px';
      });
      row.addEventListener('mousemove',ev=>{
        const tt=document.getElementById('tt');if(!tt||tt.style.display==='none')return;
        let x=ev.clientX+14,y=ev.clientY+14;
        if(x+260>window.innerWidth)x=ev.clientX-260-14;
        if(y+120>window.innerHeight)y=ev.clientY-120-14;
        tt.style.left=x+'px';tt.style.top=y+'px';
      });
      row.addEventListener('mouseleave',()=>hideTT());
      ac.appendChild(row);
    });
    card.appendChild(ac);
  }

  // suborders list (only the subs assigned to this column)
  const subs=el('div','kb-suborders');
  subsToShow.forEach(sub=>{
    const si=el('div','kb-sub');
    const sdot=el('div','kb-sub-dot');sdot.style.background=sub.stages[0]?STAGE_DEFS.find(s=>s.id===sub.stages[0].id)?.color:'var(--border2)';
    si.appendChild(sdot);
    const dS=sub.stages.filter(x=>x.status==='done').length;
    si.appendChild(tx('span','',sub.name+' ('+dS+'/'+sub.stages.length+')'));
    subs.appendChild(si);
  });
  card.appendChild(subs);

  // edit btn
  const be=el('button','btn sm');be.style.cssText='margin-top:8px;width:100%;justify-content:center';be.textContent='✏ Редактировать';
  be.onclick=e=>{e.stopPropagation();openModal({type:'editOrder',orderId:order.id,canDelete:true})};
  card.appendChild(be);

  /* === 'new' column extras: aging highlight + inline assignment form,
     shown only for orders flagged as needing extra info at creation time. === */
  if(colId==='new'&&order.needsInfo){
    const enteredAt=order.kbColEnteredAt||order.start;
    const ageDays=Math.floor((TODAY-new Date(enteredAt))/86400000);
    if(ageDays>=3){
      card.classList.add('kb-overdue');
      const ageBadge=el('div','kb-age-badge');
      ageBadge.textContent='⚠ В «Новых» '+ageDays+' д.';
      ageBadge.title='Заказ в статусе «Новые» дольше 3 дней — требует действия';
      card.insertBefore(ageBadge,card.firstChild);
    }
    const form=el('div','kb-new-form');
    form.addEventListener('click',e=>e.stopPropagation());
    /* deadline (date mode only for this inline form) */
    const dlWrap=el('div','kb-nf-row');
    dlWrap.appendChild(tx('label','kb-nf-lbl','⚑ Дедлайн'));
    const dlIn=document.createElement('input');dlIn.type='date';dlIn.className='kb-nf-in';
    dlIn.value=order.deadline.mode==='date'?(order.deadline.value||''):'';
    dlIn.draggable=false;
    dlIn.onchange=e=>{
      const v=e.target.value;
      if(v&&(!order.gapNote||!order.gapNote.trim())){
        alert('Заполните примечание «Чего не хватает» перед сохранением дедлайна.');
        dlIn.value=order.deadline.mode==='date'?(order.deadline.value||''):'';
        return;
      }
      order.deadline={mode:'date',value:v};
      render();
    };
    dlWrap.appendChild(dlIn);form.appendChild(dlWrap);
    /* gap note (what's missing) */
    const gnWrap=el('div','kb-nf-row');
    gnWrap.appendChild(tx('label','kb-nf-lbl','? Чего не хватает'));
    const gnIn=document.createElement('input');gnIn.type='text';gnIn.className='kb-nf-in';
    gnIn.value=order.gapNote||'';gnIn.placeholder='согласование, замеры…';
    gnIn.draggable=false;
    gnIn.oninput=e=>{order.gapNote=e.target.value};
    gnWrap.appendChild(gnIn);form.appendChild(gnWrap);
    /* assignee — dropdown of registered users (name_role) */
    const asWrap=el('div','kb-nf-row');
    asWrap.appendChild(tx('label','kb-nf-lbl','👤 Ответственный'));
    const asSel=document.createElement('select');asSel.className='kb-nf-in';
    asSel.draggable=false;
    const emptyOpt=document.createElement('option');
    emptyOpt.value='';emptyOpt.textContent='— выберите —';
    asSel.appendChild(emptyOpt);
    (S.users||[]).forEach(u=>{
      const value=u.name+'_'+u.role;
      const opt=document.createElement('option');
      opt.value=value;opt.textContent=u.name+' · '+u.role;
      asSel.appendChild(opt);
    });
    asSel.value=order.assignee||'';
    asSel.onchange=e=>{order.assignee=e.target.value;render()};
    asSel.addEventListener('mousedown',e=>e.stopPropagation()); // don't start drag
    asWrap.appendChild(asSel);form.appendChild(asWrap);
    /* status hint */
    const hintTx=order.assignee&&order.assignee.trim()
      ?'✓ Готов к переводу в «В работе»'
      :'Назначьте ответственного — иначе перевод заблокирован';
    const hintCls=order.assignee&&order.assignee.trim()?'kb-nf-hint kb-nf-hint-ok':'kb-nf-hint';
    form.appendChild(tx('div',hintCls,hintTx));
    card.appendChild(form);
  }

  return card;
}

/* ══════════════════════════════════════════════
   DRAG & RESIZE (Gantt bars)
══════════════════════════════════════════════ */
function setDC(on){document.body.style.cursor=on?'grabbing':'';document.body.style.userSelect=on?'none':''}
function setRC(on){document.body.style.cursor=on?'ew-resize':'';document.body.style.userSelect=on?'none':''}

/* Drag: pixel→date conversion uses the non-linear scale (weekends are
   narrower). Visual preview follows cursor; on release, snap to:
   - whole day in simple mode (dayW ≤ HOUR_THRESHOLD)
   - whole hour in hour mode (dayW > HOUR_THRESHOLD)  */
function attachDayDrag(bar,rh,order,sub,stage){
  bar.addEventListener('mousedown',e=>{
    if(rh&&e.target===rh)return;
    e.preventDefault();S._mx=e.clientX;
    const sx=e.clientX,origL=parseFloat(bar.style.left);
    const origStart=stage.start;
    const origH=stage.startHour!=null?stage.startHour:S.workStart;
    setDC(true);bar.style.opacity='0.75';bar.style.zIndex='10';
    S._dragging=true;hideTT();
    function mv(e2){
      bar.style.left=(origL+(e2.clientX-sx))+'px';
    }
    function up(e2){
      document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
      setDC(false);bar.style.opacity='';bar.style.zIndex='';
      S._dragging=false;
      const dx=e2.clientX-sx;
      if(Math.abs(dx)<6){bar.style.left=origL+'px';return;}
      const rng=getRange();
      const target=pxToDay(Math.max(0,origL+dx),rng);
      const hourMode=isHourMode();
      let newStart=new Date(target.date);
      let newH=origH;
      if(hourMode){
        // Hour snap: round to nearest whole hour, clamp to work window, skip lunch
        newH=Math.round(pxToHourIn(target.date,target.offset));
        if(newH<S.workStart)newH=S.workStart;
        if(newH>S.workEnd-1)newH=S.workEnd-1;
        if(newH>=S.lunchStart&&newH<S.lunchEnd) newH=S.lunchEnd;
      }
      // Weekend snap (works in both modes)
      if(isWE(newStart))newStart = dx>0 ? nw(newStart) : prevWork(newStart);
      const newStartIso=dk(newStart);
      const changed=newStartIso!==origStart||(hourMode&&newH!==origH);
      if(!changed){
        /* После snap к рабочему дню оказались на исходной позиции — данные
           не менялись, рендерить нечего. Просто возвращаем бар на место. */
        bar.style.left=origL+'px';
        return;
      }
      const _bs=stage.start,_bh=stage.startHour;
      stage.start=newStartIso;
      if(hourMode)stage.startHour=newH;
      const v=validateStageStart(order,sub,stage);
      if(v&&v.type==='hard'){
        stage.start=_bs;stage.startHour=_bh;alert(v.message);
      } else {
        syncStageEnd(stage,sub);
        cascadeForwardFrom(sub,stage.id);
        /* soft (resource conflict): no alert — bar gets gbar-conflict class on next render */
      }
      render();
    }
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
}
/* Resize: changes durationHours.
   Resolves the bar's new right-edge pixel into a (date, hour) target via the
   non-linear scale, then computes working hours from stage start to that
   target. Pixels over weekends or off-hours contribute 0 work hours. */
function attachDayResize(bar,rh,order,sub,stage){
  rh.addEventListener('mousedown',e=>{
    e.stopPropagation();e.preventDefault();
    const sx=e.clientX;
    const hourMode=isHourMode();
    const rng=getRange();
    setRC(true);
    S._dragging=true;hideTT();
    /* В режиме «неделя» этап с несколькими рабочими днями рисуется как
       НЕСКОЛЬКО баров (по одному на день, с пунктирной перемычкой). Resize
       прицеплен только к ПОСЛЕДНЕМУ сегменту. Если мы во время drag
       меняем ширину только его — выглядит "застрявшим" при сжатии через
       границы дней/выходных/обеда. Решение: на время drag прячем все
       сегменты этапа и поверх рисуем единый overlay-бар от начала первого
       сегмента до текущего snapped end. */
    const stageUid=bar.dataset.stageUid;
    const allSegs=stageUid?Array.from(bar.parentNode.querySelectorAll('[data-stage-uid="'+stageUid+'"]')):[bar];
    const firstSeg=allSegs.reduce((a,b)=>parseFloat(a.style.left)<parseFloat(b.style.left)?a:b);
    const startLeft=parseFloat(firstSeg.style.left);
    /* Текущий правый край последнего сегмента — стартовая ширина overlay */
    const lastSeg=allSegs.reduce((a,b)=>parseFloat(a.style.left)+parseFloat(a.style.width)>parseFloat(b.style.left)+parseFloat(b.style.width)?a:b);
    const origRightEdge=parseFloat(lastSeg.style.left)+parseFloat(lastSeg.style.width);
    const origW=origRightEdge-startLeft;
    /* Сохраняем оригинальный cssText ДО того как скроем сегменты —
       иначе overlay унаследует visibility:hidden и сам станет невидимым. */
    const segCss=firstSeg.style.cssText;
    const segClass=firstSeg.className;
    const segBg=firstSeg.style.background;
    /* Прячем все сегменты + пунктирные перемычки этапа на время drag */
    allSegs.forEach(s=>s.style.visibility='hidden');
    /* Overlay-бар */
    const overlay=document.createElement('div');
    overlay.className=segClass;
    overlay.style.cssText=segCss;
    overlay.style.left=startLeft+'px';
    overlay.style.width=origW+'px';
    overlay.style.background=segBg;
    overlay.style.borderRadius='5px';
    overlay.style.opacity='0.8';
    overlay.style.visibility='visible';
    overlay.style.pointerEvents='none';
    overlay.style.zIndex='8';
    bar.parentNode.appendChild(overlay);
    /* Live-подсказка */
    const lbl=document.createElement('div');
    lbl.style.cssText='position:fixed;background:var(--bg2);color:var(--text);border:1px solid var(--accent);border-radius:5px;padding:5px 9px;font-size:11px;font-weight:600;pointer-events:none;z-index:1000;box-shadow:0 4px 14px rgba(0,0,0,.55);white-space:nowrap;font-family:"JetBrains Mono",monospace';
    document.body.appendChild(lbl);
    const origDur=stage.durationHours||1;
    const computeSnap=(curX)=>{
      const dxPx=curX-sx;
      const nH=normalHourPx();
      let newD;
      if(hourMode){
        const dxHours=Math.round(dxPx/nH);
        newD=Math.max(1,origDur+dxHours);
      }else{
        const lunchLen=Math.max(0,S.lunchEnd-S.lunchStart);
        const workH=Math.max(1,S.workEnd-S.workStart-lunchLen);
        const dxDays=Math.round(dxPx/S.dayW);
        newD=Math.max(workH,origDur+dxDays*workH);
      }
      const savedDur=stage.durationHours;
      stage.durationHours=newD;
      const end=stageActualEnd(stage,sub);
      stage.durationHours=savedDur;
      return {newD,td:new Date(end.date),th:end.hour};
    };
    function mv(e2){
      const snap=computeSnap(e2.clientX);
      const pxRight=dX(snap.td,rng)+hourOffsetIn(snap.td,snap.th);
      overlay.style.width=Math.max(6,pxRight-startLeft)+'px';
      const delta=snap.newD-(stage.durationHours||0);
      const sign=delta>0?'+':(delta<0?'−':'');
      const deltaTxt=Math.abs(delta)>0.001?' ('+sign+Math.abs(delta)+'ч)':'';
      lbl.innerHTML=snap.newD+'ч'+deltaTxt+'<br><span style="font-weight:400;color:var(--text2);font-size:10px">до '+fmtS(snap.td)+' · '+fmtHM(snap.th)+'</span>';
      let x=e2.clientX+14,y=e2.clientY-38;
      if(x+200>window.innerWidth)x=e2.clientX-200-14;
      if(y<4)y=e2.clientY+18;
      lbl.style.left=x+'px';lbl.style.top=y+'px';
    }
    function up(e2){
      document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
      setRC(false);
      S._dragging=false;
      if(lbl.parentNode)lbl.parentNode.removeChild(lbl);
      if(overlay.parentNode)overlay.parentNode.removeChild(overlay);
      allSegs.forEach(s=>s.style.visibility='');
      const dx=e2.clientX-sx;
      if(Math.abs(dx)<4)return;  // no-op drag
      const snap=computeSnap(e2.clientX);
      const newD=snap.newD;
      const _bd=stage.durationHours;
      if(newD===_bd)return;
      stage.durationHours=newD;
      const _bend=stage.end;
      syncStageEnd(stage,sub);
      const v=validateStageStart(order,sub,stage);
      if(v&&v.type==='hard'){
        stage.durationHours=_bd;stage.end=_bend;alert(v.message);
      } else {
        cascadeForwardFrom(sub,stage.id);
      }
      render();
    }
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
}
/* Validation: cutting ≥ max(matDelivery,hwDelivery); SCHED_CHAIN order.
   Returns error string or null. */
/* Production-stage dependencies. Each key depends on (must start after the
   actual end of) every value in its array. Validation also walks the inverse
   direction — if any descendant starts before this stage ends, that's a
   violation too. Differs from SCHED_CHAIN (which defines backwards-planning
   topology) — here we describe the **soft** constraints that drag/resize
   must respect. */
const STAGE_DEPS={
  finishing:['cutting'],
  painting: ['cutting'],
  edging:   ['cutting'],
  drilling: ['edging'],
  assembly: ['drilling','finishing','painting'],
};
function validateStageStart(order,sub,stage){
  const stageStartHour=stage.startHour!=null?stage.startHour:S.workStart;
  const stageLbl=id=>STAGE_DEFS.find(s=>s.id===id).lbl;
  const hard=msg=>({type:'hard',message:msg});
  const soft=msg=>({type:'soft',message:msg});

  /* Collect every relevant delivery date for this sub. Order-level deliveries
     (array) + legacy scalar fields + sub-level top-up materials (дозакупка). */
  const collectDates=type=>{
    const out=[];
    if(order.purchasing&&!order.purchasing.disabled){
      const arr=order.purchasing.deliveries||[];
      arr.forEach(d=>{if(d.type===type&&d.date)out.push(new Date(d.date))});
    }
    if(type==='mat')sub.stages.filter(s=>s.id==='materials').forEach(s=>{if(s.matDelivery)out.push(new Date(s.matDelivery))});
    if(type==='hw') sub.stages.filter(s=>s.id==='materials').forEach(s=>{if(s.hwDelivery)out.push(new Date(s.hwDelivery))});
    return out;
  };

  /* HARD: cutting ≥ order.start and ≥ every known sawing-material delivery date */
  if(stage.id==='cutting'){
    if(new Date(stage.start)<new Date(order.start))
      return hard('Этап «Раскрой» не может начинаться раньше даты создания заказа ('+fmtS(new Date(order.start))+')');
    for(const md of collectDates('mat')){
      if(new Date(stage.start)<md)
        return hard('Этап «Раскрой» не может начинаться раньше поставки пильного материала ('+fmtS(md)+')');
    }
  }

  /* HARD: assembly ≥ every hardware delivery */
  if(stage.id==='assembly'){
    for(const hd of collectDates('hw')){
      if(new Date(stage.start)<hd)
        return hard('Этап «Сборка» не может начинаться раньше поставки фурнитуры ('+fmtS(hd)+')');
    }
  }

  /* HARD: painting ≥ paint-material delivery */
  if(stage.id==='painting'){
    for(const pd of collectDates('paint')){
      if(new Date(stage.start)<pd)
        return hard('Этап «Покраска» не может начинаться раньше поставки материалов для покраски ('+fmtS(pd)+')');
    }
  }

  /* Intra-sub predecessor/descendant checks intentionally removed — user
     may freely overlap stages within one suborder. cascadeForwardFrom still
     pulls descendants when a predecessor moves forward, as a convenience. */

  /* SOFT: cross-order resource conflict (same stage.id, intersecting intervals).
     Reported by visual marker only; drag/resize proceeds. */
  const myEnd=stageActualEnd(stage,sub);
  const myStartMs=new Date(stage.start).getTime()+stageStartHour*3600000;
  const myEndMs=new Date(myEnd.date).getTime()+myEnd.hour*3600000;
  for(const o of S.orders){
    for(const sb of o.suborders){
      for(const st of sb.stages){
        if(o.id===order.id&&sb.id===sub.id&&st.id===stage.id)continue;
        if(st.id!==stage.id)continue;
        const oStart=new Date(st.start).getTime()+(st.startHour!=null?st.startHour:S.workStart)*3600000;
        const oEndPair=stageActualEnd(st,sb);
        const oEnd=new Date(oEndPair.date).getTime()+oEndPair.hour*3600000;
        if(myStartMs<oEnd&&oStart<myEndMs)
          return soft('overlap with '+o.name+' / '+sb.name);
      }
    }
  }

  return null;
}
function cascadeStages(stages,fromIdx){
  for(let i=fromIdx;i<stages.length;i++){
    const prev=stages[i-1],s=stages[i];
    const ms=nw(new Date(prev.end));
    if(new Date(s.start)<ms){s.start=dk(ms);s.end=dk(awdFromDate(ms,s.wd))}
  }
}
/* Cascade forward: after a stage moves/resizes, push any descendants (per
   STAGE_DEPS) that now start before the anchor's actual end. Hour-precise
   move, weekend/lunch/workhour clamping. */
function cascadeForwardFrom(sub,anchorId){
  const visited=new Set([anchorId]);
  const queue=[anchorId];
  while(queue.length){
    const cur=queue.shift();
    for(const childId of Object.keys(STAGE_DEPS)){
      const deps=STAGE_DEPS[childId];
      if(!deps.includes(cur))continue;
      if(visited.has(childId))continue;
      const child=sub.stages.find(s=>s.id===childId);
      if(!child){visited.add(childId);continue;}
      // earliest valid start = latest actualEnd among all present deps
      let needMs=null;
      for(const depId of deps){
        const dep=sub.stages.find(s=>s.id===depId);
        if(!dep)continue;
        const pe=stageActualEnd(dep,sub);
        const peMs=new Date(pe.date).getTime()+pe.hour*3600000;
        if(needMs===null||peMs>needMs)needMs=peMs;
      }
      if(needMs!==null){
        const childStartH=child.startHour!=null?child.startHour:S.workStart;
        const childCurMs=new Date(child.start).getTime()+childStartH*3600000;
        if(childCurMs<needMs){
          let nd=new Date(needMs);
          let dayStart=new Date(nd);dayStart.setHours(0,0,0,0);
          let h=(needMs-dayStart.getTime())/3600000;
          // past workEnd → next working day at workStart
          if(h>=S.workEnd){
            let d=calAdd(dayStart,1);while(isWE(d))d=calAdd(d,1);
            child.start=dk(d);child.startHour=S.workStart;
          } else {
            if(h<S.workStart)h=S.workStart;
            if(h>=S.lunchStart&&h<S.lunchEnd)h=S.lunchEnd;
            if(isWE(dayStart)){
              let d=new Date(dayStart);while(isWE(d))d=calAdd(d,1);
              child.start=dk(d);child.startHour=S.workStart;
            } else {
              child.start=dk(dayStart);child.startHour=Math.round(h*2)/2;
            }
          }
          syncStageEnd(child,sub);
        }
      }
      visited.add(childId);
      queue.push(childId);
    }
  }
}

function showTT(e,def,stage,order,sub,segs){
  /* Во время drag/resize tooltip только мешает — он висит на курсоре
     поверх перетаскиваемого бара. Полностью блокируем. */
  if(S._dragging)return;
  const tt=document.getElementById('tt');
  const st=STAT_MAP[stage.status];
  const dh=computeStageDurH(stage,sub);
  const sh=stage.startHour!=null?stage.startHour:S.workStart;
  const key=order.id+':'+sub.id+':'+stage.id;
  const cf=S._conflicts&&S._conflicts[key];
  const conflictBlock=cf?`<div class="tt-r" style="color:#f85149;margin-top:4px;border-top:1px solid #f85149;padding-top:4px">⚠ Конфликт с этапом «${def.lbl}»:</div>`
    +cf.map(c=>`<div class="tt-m" style="font-size:10px;color:#f85149">${c.label}<br><span style="color:var(--text2)">${c.time}</span></div>`).join(''):'';
  tt.innerHTML=`<div class="tt-t" style="color:${def.color}">${def.lbl}${cf?' <span style="font-size:10px;color:#f85149">⚠ конфликт</span>':''}</div>
    <div class="tt-r">${order.name} › ${sub.name}</div>
    <div class="tt-r">${fmtF(stage.start)}${stage.start!==stage.end?' → '+fmtF(stage.end):''}</div>
    <div class="tt-r"><span class="badge ${st.cls}">${st.lbl}</span></div>
    ${Array.isArray(stage.assignees)&&stage.assignees.length?`<div class="tt-r" style="color:var(--text2)">👤 ${stage.assignees.map(v=>{const u=resolveEmployee(v);return u.name+(u.role?' · '+u.role:'')}).join('<br>👤 ')}</div>`:''}
    <div class="tt-m">${dh}ч всего · начало ${fmtHM(sh)}${segs?' · '+segs.length+' '+(segs.length===1?'день':'дн.'):''}</div>
    ${stage.note?`<div class="tt-r" style="color:var(--text);margin-top:3px">${stage.note}</div>`:''}
    ${conflictBlock}`;
  tt.style.display='block';moveTT(e);
}
function moveTT(e){
  const tt=document.getElementById('tt');
  let x=e.clientX+14,y=e.clientY-10;
  if(x+210>window.innerWidth)x=e.clientX-210-14;
  if(y+tt.offsetHeight>window.innerHeight)y=window.innerHeight-tt.offsetHeight-10;
  tt.style.left=x+'px';tt.style.top=y+'px';
}
function hideTT(){document.getElementById('tt').style.display='none'}

    const sub=order.suborders.find(s=>s.id===m.subId);
    if(!m._init){
      m.subName=sub.name;m.sel=sub.stages.map(s=>s.id);
      m.qSheets=sub.qty?.sheets||0;m.qEdge=sub.qty?.edgeMeters||0;m.qParts=sub.qty?.parts||0;
      m._init=true;
    }
    modal.appendChild(tx('div','modal-title','Изделие: '+sub.name));
    addField(modal,'Название изделия','text',m.subName,v=>m.subName=v);

    /* per-suborder quantities */
    const qLbl=el('div','flbl');qLbl.innerHTML='Объём изделия <span style="color:var(--text3);font-size:10px">(используется в калькуляторах)</span>';modal.appendChild(qLbl);
    const qGrid=el('div','row2');qGrid.style.gridTemplateColumns='1fr 1fr 1fr';
    function mkQF(label,unit,key,icon){
      const wrap=el('div','');
      const lw=el('label','flbl');lw.innerHTML=icon+' '+label+' <span style="color:var(--text3);font-weight:400">('+unit+')</span>';
      wrap.appendChild(lw);
      const inp=document.createElement('input');inp.type='number';inp.className='finput';inp.min=0;inp.placeholder='0';inp.value=m[key]||0;
      inp.oninput=e=>m[key]=+e.target.value||0;wrap.appendChild(inp);return wrap;
    }
    qGrid.appendChild(mkQF('Листов','шт','qSheets','✂️'));
    qGrid.appendChild(mkQF('Метров кромки','м.п.','qEdge','📐'));
    qGrid.appendChild(mkQF('Деталей','шт','qParts','🔩'));
    modal.appendChild(qGrid);

    modal.appendChild(tx('label','flbl','Этапы производства'));
    const grid=el('div','stage-grid');
    STAGE_DEFS.forEach(def=>{
      const on=m.sel.includes(def.id);
      const item=el('div','sc-item'+(on?' on':''));
      const c=el('div','sc-c');c.style.background=def.color;
      const tc=el('div','');tc.appendChild(tx('div','sc-t',def.lbl));tc.appendChild(tx('div','sc-d',def.wd+'р.д.'));
      item.appendChild(c);item.appendChild(tc);
      item.onclick=()=>{m.sel=m.sel.includes(def.id)?m.sel.filter(x=>x!==def.id):[...m.sel,def.id];renderModal(root)};
      grid.appendChild(item);
    });
    modal.appendChild(grid);
    const delSub=el('button','btn dn');delSub.style.marginTop='12px';delSub.textContent='🗑 Удалить это изделие';
    delSub.onclick=()=>{if(confirm('Удалить изделие «'+sub.name+'»?')){order.suborders=order.suborders.filter(s=>s.id!==sub.id);closeModal()}};
    modal.appendChild(delSub);
    addFooter(modal,()=>{
      sub.name=m.subName||'Изделие';
      const oldQty=sub.qty||{};
      const newQty={sheets:+m.qSheets||0,edgeMeters:+m.qEdge||0,parts:+m.qParts||0};
      const qtyChanged=oldQty.sheets!==newQty.sheets||oldQty.edgeMeters!==newQty.edgeMeters||oldQty.parts!==newQty.parts;
      sub.qty=newQty;
      const ids=STAGE_DEFS.filter(x=>m.sel.includes(x.id)).map(x=>x.id);
      const dlDate=deadlineDate(order.deadline,order.start);
      const dlStr=dlDate?dk(dlDate):null;
      const exMap=Object.fromEntries(sub.stages.map(s=>[s.id,s]));
      const newStages=dlStr?buildStagesBackwards(ids,dlStr,undefined,order.start):buildStagesForward(ids,order.start);
      sub.stages=newStages.map(s=>{
        const ex=exMap[s.id];
        /* For calculator-driven stages, recompute durationHours from new qty
           when qty changed. Otherwise keep the user-edited value. */
        const isCalc=['cutting','edging','drilling'].includes(s.id);
        const dh=ex?.durationHours!=null
          ? (isCalc&&qtyChanged ? computeDefaultDurH(s.id,newQty) : ex.durationHours)
          : computeDefaultDurH(s.id,newQty);
        /* Если этап уже существовал в этом изделии — сохраняем его текущие
           start/end. Только что добавленные этапы (которых не было в exMap)
           получают позицию из buildStagesBackwards/Forward; пользователь сам
           их подвинет при необходимости. Это правило: добавление нового этапа
           НЕ должно сдвигать существующие. */
        const keepPosition=!!ex;
        return{...s,
          start:keepPosition?ex.start:s.start,
          end:keepPosition?ex.end:s.end,
          status:ex?.status||'pending',
          note:ex?.note||'',
          startHour:ex?.startHour??s.startHour,
          durationHours:dh,
          matDelivery:ex?.matDelivery||'',
          hwDelivery:ex?.hwDelivery||'',
          /* Сохраняем UID/ответственных/доставки этапа при перепланировании */
          uid:ex?.uid||s.uid,
          assignees:Array.isArray(ex?.assignees)?ex.assignees.slice():(Array.isArray(s.assignees)?s.assignees:[]),
          deliveries:Array.isArray(ex?.deliveries)?ex.deliveries:(Array.isArray(s.deliveries)?s.deliveries:[]),
        };
      });
      sub.stages.forEach(st=>syncStageEnd(st,sub));
      closeModal();
    },'Сохранить');
  }

  /* ── QUICK STATUS ── */
  else if(m.type==='quickStatus'){
    const order=S.orders.find(o=>o.id===m.orderId);
    const sub=order.suborders.find(s=>s.id===m.subId);
    const stage=sub.stages.find(s=>s.id===m.stageId);
    const def=STAGE_DEFS.find(s=>s.id===m.stageId);
    const t=el('div','modal-title');
    const dot=el('span','');dot.style.cssText=`display:inline-block;width:10px;height:10px;border-radius:50%;background:${def.color};margin-right:7px;vertical-align:middle`;
    t.appendChild(dot);t.appendChild(tx('span','',def.lbl));modal.appendChild(t);
    const errBox=el('div','');modal.appendChild(errBox);
    const selWrap=el('div','');selWrap.style.display='flex';selWrap.style.flexDirection='column';selWrap.style.gap='6px';selWrap.style.marginTop='8px';
    Object.entries(STAT_MAP).forEach(([k,v])=>{
      const row=el('button','btn');row.style.justifyContent='flex-start';row.style.gap='8px';
      if(k===stage.status)row.style.cssText+='border-color:var(--accent);background:var(--accent-bg)';
      const dot2=el('span','');dot2.style.cssText=`width:9px;height:9px;border-radius:50%;background:${STAT_COLORS[k]};flex-shrink:0`;
      row.appendChild(dot2);row.appendChild(tx('span','',v.lbl));
      row.onclick=()=>{
        if(k===stage.status){S.modal=null;render();return}
        if(stage.id==='assembly'&&k!=='pending'){
          const err=checkAssemblyReady(order,sub);
          if(err){errBox.innerHTML='';const b=el('div','err-box');b.textContent=err;errBox.appendChild(b);return}
        }
        stage.status=k;recalcOrderKbCol(order);S.modal=null;render();
      };
      selWrap.appendChild(row);
    });
    modal.appendChild(selWrap);
    const cancel=el('button','btn');cancel.style.marginTop='14px';cancel.textContent='Отмена';cancel.onclick=()=>{S.modal=null;render()};modal.appendChild(cancel);
  }

  /* ── EDIT STAGE ── */
  else if(m.type==='editStage'){
    const order=S.orders.find(o=>o.id===m.orderId);
    const sub=order.suborders.find(s=>s.id===m.subId);
    const stage=sub.stages.find(s=>s.id===m.stageId);
    const def=STAGE_DEFS.find(s=>s.id===m.stageId);
    const t=el('div','modal-title');
    const dot=el('span','');dot.style.cssText=`display:inline-block;width:10px;height:10px;border-radius:50%;background:${def.color};margin-right:7px;vertical-align:middle`;
    t.appendChild(dot);t.appendChild(tx('span','',def.lbl));modal.appendChild(t);
    addSelect(modal,'Статус',Object.entries(STAT_MAP).map(([k,v])=>[k,v.lbl]),m.status,v=>m.status=v);
    const wdField=addField(modal,'Рабочих дней','number',m.wd,v=>{m.wd=Math.max(1,+v||1)},{min:1,max:90});
    addField(modal,'Дата начала','date',m.start,v=>m.start=v);
    addField(modal,'Примечание','text',m.note,v=>m.note=v);
    const cd=countCal(stage.start,stage.end),we=countWE(stage.start,stage.end);
    const infoB=el('div',we>0?'warn-box':'info-box');
    infoB.textContent=we>0?`⚠ Через ${we} вых.: ${stage.wd}р.д.→${cd}кал.`:`✓ ${stage.wd}р.д. = ${cd}кал.`;
    modal.appendChild(infoB);
    /* calculators for specific stages */
    appendCalc(modal,def.id,null,wdField,null,sub.qty);
    /* delivery dates for materials stage */
    if(m.stageId==='materials'){
      const dLbl=el('div','flbl');dLbl.innerHTML='📦 Ориентировочные даты поставки';modal.appendChild(dLbl);
      const dr=el('div','row2');
      const mw=el('div','');mw.appendChild(tx('label','flbl','Материалы'));
      const mi=document.createElement('input');mi.type='date';mi.className='finput';mi.value=m.matDelivery||stage.matDelivery||'';
      mi.oninput=e=>m.matDelivery=e.target.value;mw.appendChild(mi);dr.appendChild(mw);
      const hw=el('div','');hw.appendChild(tx('label','flbl','Фурнитура'));
      const hi=document.createElement('input');hi.type='date';hi.className='finput';hi.value=m.hwDelivery||stage.hwDelivery||'';
      hi.oninput=e=>m.hwDelivery=e.target.value;hw.appendChild(hi);dr.appendChild(hw);
      modal.appendChild(dr);
    }
    addFooter(modal,()=>{
      if(stage.id==='assembly'&&m.status!=='pending'&&stage.status==='pending'){
        const err=checkAssemblyReady(order,sub);
        if(err){alert(err);return}
      }
      stage.status=m.status;stage.note=m.note;stage.wd=+m.wd||1;
      if(m.stageId==='materials'){stage.matDelivery=m.matDelivery||'';stage.hwDelivery=m.hwDelivery||'';}
      const ns=nw(new Date(m.start));stage.start=dk(ns);
      /* Convert wd → durationHours so the bar reflects new length, then sync stage.end */
      const lunchLen=Math.max(0,S.lunchEnd-S.lunchStart);
      const workHoursInDay=Math.max(1,S.workEnd-S.workStart-lunchLen);
      stage.durationHours=stage.wd*workHoursInDay;
      syncStageEnd(stage,sub);
      recalcOrderKbCol(order);
      S.modal=null;render();
    },'Сохранить');
  }

  /* ── EDIT PURCHASING (order-level) ── */
  else if(m.type==='editPurchasing'){
    const order=S.orders.find(o=>o.id===m.orderId);
    if(!order){S.modal=null;render();return}
    ensureOrderPurchasing(order);
    const ps=order.purchasing;
    if(!m._init){
      m.status=ps.status||'pending';
      m.note=ps.note||'';
      m.start=ps.start;
      m.wd=ps.wd||2;
      /* deep-clone deliveries so we can cancel without committing */
      m.deliveries=(ps.deliveries||[]).map(d=>({...d}));
      m.customTypes=(ps.customTypes||[]).map(ct=>({...ct}));
      m._init=true;
    }
    const hasPainting=order.suborders.some(sub=>sub.stages.some(s=>s.id==='painting'));
    const TYPE_META={
      mat:  {lbl:'Пильный материал', icon:'📦', color:'#3fb950'},
      hw:   {lbl:'Фурнитура',         icon:'🔧', color:'#a371f7'},
      paint:{lbl:'Материалы для покраски', icon:'🎨', color:'#fb923c'},
    };
    const t=el('div','modal-title');
    const dot=el('span','');dot.style.cssText='display:inline-block;width:10px;height:10px;border-radius:50%;background:#3fb950;margin-right:7px;vertical-align:middle';
    t.appendChild(dot);t.appendChild(document.createTextNode('🛒 Закупка — '+order.name));
    modal.appendChild(t);
    addField(modal,'Дата начала','date',m.start,v=>m.start=v);
    addField(modal,'Длительность (рабочих дней)','number',m.wd,v=>m.wd=+v||1);
    addSelect(modal,'Статус',Object.entries(STAT_MAP).map(([k,v])=>[k,v.lbl]),m.status,v=>m.status=v);

    /* === Deliveries list === */
    /* Совмещаем встроенные и пользовательские типы.
       Кастомные типы (m.customTypes) добавляются менеджером и работают так
       же, как встроенные, но без бизнес-валидаций (нельзя «привязать» к
       раскрою или покраске — это поведение зашито в логику этапов). */
    const allTypes={...TYPE_META};
    m.customTypes.forEach(ct=>{
      allTypes[ct.id]={lbl:ct.lbl,icon:ct.icon||'📋',color:ct.color||'#7d8590',custom:true};
    });
    const builtIn=hasPainting?['mat','hw','paint']:['mat','hw'];
    const types=[...builtIn,...m.customTypes.map(ct=>ct.id)];
    types.forEach(type=>{
      const meta=allTypes[type];
      if(!meta)return;
      const sec=el('div','');sec.style.cssText='margin:14px 0 6px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r)';
      const head=el('div','');head.style.cssText='display:flex;align-items:center;gap:6px;margin-bottom:8px';
      head.appendChild(tx('span','',meta.icon+' '+meta.lbl));
      const add=el('button','btn sm');add.style.marginLeft='auto';add.textContent='+ Поставка';
      add.onclick=()=>{
        m.deliveries.push({id:_id(),type,supplierId:null,date:'',fileName:'',fileId:'',filePath:'',fileDataUrl:'',notes:''});
        renderModal(root);
      };
      head.appendChild(add);
      /* Удаление кастомной категории — встроенные удалять нельзя */
      if(meta.custom){
        const del=el('button','btn ic sm');del.textContent='✕';del.title='Удалить категорию';
        del.style.cssText='color:var(--danger);padding:2px 8px';
        del.onclick=()=>{
          const used=m.deliveries.some(d=>d.type===type);
          if(used&&!confirm('В категории «'+meta.lbl+'» есть поставки. Удалить категорию вместе со всеми её поставками?'))return;
          /* собрать fileId всех поставок этой категории на удаление */
          m.deliveries.filter(d=>d.type===type&&d.fileId).forEach(d=>{
            m._filesToDelete=(m._filesToDelete||[]);m._filesToDelete.push(d.fileId);
          });
          m.deliveries=m.deliveries.filter(d=>d.type!==type);
          m.customTypes=m.customTypes.filter(ct=>ct.id!==type);
          renderModal(root);
        };
        head.appendChild(del);
      }
      sec.appendChild(head);
      const list=m.deliveries.filter(d=>d.type===type);
      if(!list.length){
        sec.appendChild(tx('div','',  'Поставок пока нет')).style.cssText='color:var(--text3);font-size:11px;text-align:center;padding:6px';
      }else{
        list.forEach((d,i)=>{
          const row=el('div','');row.style.cssText='display:grid;grid-template-columns:1fr 110px 28px;gap:6px;margin-bottom:6px;align-items:center';
          /* supplier select */
          const sup=document.createElement('select');sup.className='finput';sup.style.fontSize='12px';
          const optEmpty=document.createElement('option');optEmpty.value='';optEmpty.textContent='— поставщик —';sup.appendChild(optEmpty);
          (S.suppliers||[]).forEach(s=>{
            const op=document.createElement('option');op.value=String(s.id);op.textContent=s.name;
            if(d.supplierId===s.id)op.selected=true;sup.appendChild(op);
          });
          const optNew=document.createElement('option');optNew.value='__new';optNew.textContent='＋ Добавить нового…';sup.appendChild(optNew);
          sup.onchange=e=>{
            if(e.target.value==='__new'){
              const name=prompt('Название поставщика:');
              if(name&&name.trim()){
                const tag=prompt('Короткая метка (1-3 символа), например "ЛП":',(name.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase()))||'?';
                const colors=['#3fb950','#58a6ff','#bc8cff','#fb923c','#e3b341','#f778ba','#22d3ee','#f85149'];
                const newSup={id:_id(),name:name.trim(),tag:tag.trim().slice(0,3),color:colors[(S.suppliers.length)%colors.length],logoDataUrl:'',contactPerson:'',phone:'',email:'',address:'',notes:''};
                S.suppliers.push(newSup);
                d.supplierId=newSup.id;
              }
              renderModal(root);return;
            }
            d.supplierId=e.target.value||null;
            renderModal(root);
          };
          row.appendChild(sup);
          /* date */
          const di=document.createElement('input');di.type='date';di.className='finput';di.style.fontSize='12px';di.value=d.date||'';
          di.onchange=e=>{d.date=e.target.value;renderModal(root)};
          row.appendChild(di);
          /* delete */
          const del=el('button','btn ic sm');del.textContent='✕';del.title='Удалить поставку';
          del.onclick=()=>{
            /* Запомним fileId на удаление в БД — реальное удаление пойдёт
               при сохранении модалки, чтобы не оставить orphan file если
               пользователь нажмёт «Отмена». */
            if(d.fileId){m._filesToDelete=(m._filesToDelete||[]);m._filesToDelete.push(d.fileId)}
            m.deliveries=m.deliveries.filter(x=>x.id!==d.id);
            renderModal(root);
          };
          row.appendChild(del);
          sec.appendChild(row);
          /* file attachment row */
          const fileRow=el('div','');fileRow.style.cssText='display:flex;align-items:center;gap:6px;margin:-2px 0 8px;font-size:11px;color:var(--text2)';
          const fileLbl=el('label','btn sm');fileLbl.style.cssText='cursor:pointer;font-size:11px;padding:3px 8px';
          fileLbl.textContent=d.fileName?('📎 '+d.fileName):'📎 Прикрепить заявку';
          const fi=document.createElement('input');fi.type='file';fi.style.display='none';
          fi.onchange=async e=>{
            const f=e.target.files&&e.target.files[0];
            if(!f)return;
            fileLbl.textContent='📎 Загружаю…';fileLbl.style.opacity='.6';
            try{
              /* Если был старый файл — удаляем из delivery_files перед заменой */
              if(d.fileId){await db.deleteDeliveryFile(d.fileId);d.fileId=''}
              if(d.filePath){await db.removeDeliveryFile(d.filePath);d.filePath=''}
              /* Грузим в отдельную таблицу — НЕ в заказ */
              const fileId=await db.uploadDeliveryFileToDB(f);
              d.fileName=f.name;
              d.fileId=fileId;
              d.fileDataUrl='';  /* очищаем legacy при загрузке нового файла */
              d.filePath='';
              renderModal(root);
            }catch(err){
              alert('Ошибка загрузки файла: '+(err.message||err));
              fileLbl.textContent=d.fileName?('📎 '+d.fileName):'📎 Прикрепить заявку';
              fileLbl.style.opacity='';
            }
          };
          fileLbl.appendChild(fi);
          fileRow.appendChild(fileLbl);
          if(d.fileName){
            const rm=el('button','btn ic sm');rm.textContent='🗑';rm.title='Открепить файл';rm.style.fontSize='11px';
            rm.onclick=async()=>{
              const fileId=d.fileId,path=d.filePath;
              d.fileName='';d.fileId='';d.filePath='';d.fileDataUrl='';
              renderModal(root);
              if(fileId)try{await db.deleteDeliveryFile(fileId)}catch(e){console.warn('delete file failed',e)}
              if(path)try{await db.removeDeliveryFile(path)}catch(e){console.warn('remove failed',e)}
            };
            fileRow.appendChild(rm);
          }
          /* Live inline validation hint */
          const hasAny=d.date||d.supplierId||d.fileName||d.notes;
          if(hasAny){
            const missing=[];
            if(!d.supplierId)missing.push('поставщик');
            if(!d.date)missing.push('дата');
            if(!d.fileName)missing.push('заявка');
            if(missing.length){
              const warn=tx('span','',  '⚠ требуется: '+missing.join(', '));
              warn.style.cssText='font-size:10px;color:var(--warn);white-space:nowrap';
              fileRow.appendChild(warn);
            }
          }
          /* notes */
          const ni=document.createElement('input');ni.type='text';ni.className='finput';ni.placeholder='примечание';ni.style.cssText='flex:1;font-size:11px;padding:3px 6px;min-height:0';
          ni.value=d.notes||'';ni.oninput=e=>d.notes=e.target.value;
          fileRow.appendChild(ni);
          sec.appendChild(fileRow);
        });
      }
      modal.appendChild(sec);
    });

    /* Кнопка добавления новой категории закупки */
    const addCatRow=el('div','');addCatRow.style.cssText='margin:10px 0 6px;text-align:center';
    const addCatBtn=el('button','btn sm');addCatBtn.textContent='+ Новая категория закупки';
    addCatBtn.style.cssText='color:var(--accent);border:1px dashed var(--border2);background:transparent';
    addCatBtn.onclick=()=>{
      const name=prompt('Название новой категории закупки:','');
      if(!name||!name.trim())return;
      const lbl=name.trim();
      /* Защита от дубликатов по имени (case-insensitive) */
      const dup=m.customTypes.some(ct=>ct.lbl.toLowerCase()===lbl.toLowerCase())
        ||Object.values(TYPE_META).some(t=>t.lbl.toLowerCase()===lbl.toLowerCase());
      if(dup){alert('Категория с таким названием уже существует.');return}
      m.customTypes.push({id:'ct_'+_id(),lbl,icon:'📋',color:'#7d8590'});
      renderModal(root);
    };
    addCatRow.appendChild(addCatBtn);
    modal.appendChild(addCatRow);

    /* Кнопка удаления закупки целиком — не валидирует, не сохраняет
       остальные поля. Ставит флаг disabled у закупки. Закупка скрывается
       из Ганта/расчётов; restore — из карточки заказа. */
    const delRow=el('div','');delRow.style.cssText='margin:14px 0 6px;text-align:center';
    const delBtn=el('button','btn sm');delBtn.textContent='🗑 Удалить закупку';
    delBtn.style.cssText='color:var(--danger);border:1px solid var(--danger);background:transparent';
    delBtn.onclick=()=>{
      const cnt=m.deliveries.filter(d=>d.date&&d.supplierId&&d.fileName).length;
      const warn=cnt>0
        ?'Удалить закупку? Будут скрыты '+cnt+' поставка(-и). Восстановить можно из карточки заказа.'
        :'Удалить закупку? Восстановить можно из карточки заказа.';
      if(!confirm(warn))return;
      ps.disabled=true;
      S.modal=null;
      render();
    };
    delRow.appendChild(delBtn);
    modal.appendChild(delRow);

    addField(modal,'Примечание (общее)','text',m.note,v=>m.note=v);
    addFooter(modal,()=>{
      /* Validate: any non-empty delivery must have date + supplier + file */
      const TYPE_LBL={mat:'пильного материала',hw:'фурнитуры',paint:'материалов для покраски'};
      const lblFor=(t)=>{
        if(TYPE_LBL[t])return TYPE_LBL[t];
        const ct=m.customTypes.find(c=>c.id===t);
        return ct?('«'+ct.lbl+'»'):'категории';
      };
      for(const d of m.deliveries){
        const hasAny=d.date||d.supplierId||d.fileName||d.notes;
        if(!hasAny)continue; // empty row — skip
        if(!d.supplierId){
          alert('Невозможно сохранить поставку '+lblFor(d.type)+': не указан поставщик. Выберите поставщика или удалите запись.');
          return;
        }
        if(!d.date){
          alert('Невозможно сохранить поставку '+lblFor(d.type)+': не указана дата. Укажите дату или удалите запись.');
          return;
        }
        if(!d.fileName){
          alert('Невозможно сохранить поставку '+lblFor(d.type)+' без прикреплённой заявки. Прикрепите файл или удалите запись.');
          return;
        }
      }
      ps.status=m.status;
      ps.note=m.note;
      ps.wd=Math.max(1,+m.wd||1);
      /* Persist only fully-valid deliveries */
      ps.deliveries=m.deliveries.filter(d=>d.date&&d.supplierId&&d.fileName);
      ps.customTypes=(m.customTypes||[]).map(ct=>({...ct}));
      /* Реально удаляем файлы, которые пользователь убрал в этой сессии */
      if(m._filesToDelete&&m._filesToDelete.length){
        m._filesToDelete.forEach(fid=>{db.deleteDeliveryFile(fid).catch(_=>{})});
      }
      /* Keep legacy scalar fields in sync with the earliest entry of each type
         so any old code paths still find a value. */
      const firstOf=t=>{const a=ps.deliveries.filter(d=>d.type===t).map(d=>d.date).sort();return a[0]||''};
      ps.matDelivery=firstOf('mat');
      ps.hwDelivery=firstOf('hw');
      ps.paintDelivery=firstOf('paint');
      const ns=nw(new Date(m.start));
      ps.start=dk(ns);
      ps.end=dk(awdFromDate(ns,ps.wd));
      const lunchLen=Math.max(0,S.lunchEnd-S.lunchStart);
      const workHoursInDay=Math.max(1,S.workEnd-S.workStart-lunchLen);
      ps.durationHours=ps.wd*workHoursInDay;
      S.modal=null;render();
    },'Сохранить');
  }

  /* ── VIEW DELIVERY (one entry detail, open/print attached file) ── */
  else if(m.type==='viewDelivery'){
    const order=S.orders.find(o=>o.id===m.orderId);
    if(!order){S.modal=null;render();return}
    ensureOrderPurchasing(order);
    const d=(order.purchasing.deliveries||[]).find(x=>x.id===m.deliveryId);
    if(!d){S.modal=null;render();return}
    const sup=(S.suppliers||[]).find(s=>s.id===d.supplierId);
    const TYPE_LBL={mat:'Пильный материал',hw:'Фурнитура',paint:'Материалы для покраски'};
    const TYPE_ICON={mat:'📦',hw:'🔧',paint:'🎨'};
    /* Подхватываем кастомные типы из этого заказа */
    const customMap={};
    (order.purchasing.customTypes||[]).forEach(ct=>{customMap[ct.id]={lbl:ct.lbl,icon:ct.icon||'📋'}});
    const tIcon=(t)=>TYPE_ICON[t]||(customMap[t]&&customMap[t].icon)||'📋';
    const tLbl=(t)=>TYPE_LBL[t]||(customMap[t]&&customMap[t].lbl)||'Поставка';
    /* Header with supplier logo if available */
    const head=el('div','');head.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:14px';
    if(sup&&sup.logoDataUrl){
      const logo=document.createElement('img');logo.src=sup.logoDataUrl;
      logo.style.cssText='width:48px;height:48px;border-radius:6px;background:#fff;padding:2px;border:1px solid '+(sup.color||'var(--border2)');
      head.appendChild(logo);
    }else if(sup){
      const tag=el('div','');tag.style.cssText='width:48px;height:48px;border-radius:6px;background:'+sup.color+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px';
      tag.textContent=sup.tag||'?';head.appendChild(tag);
    }else{
      const ic=el('div','');ic.style.cssText='width:48px;height:48px;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:24px';
      ic.textContent=tIcon(d.type);head.appendChild(ic);
    }
    const titleBlock=el('div','');titleBlock.style.cssText='flex:1;min-width:0';
    const supName=tx('div','',sup?sup.name:'Поставщик не выбран');supName.style.cssText='font-size:16px;font-weight:600';
    titleBlock.appendChild(supName);
    titleBlock.appendChild(tx('div','',tIcon(d.type)+' '+tLbl(d.type))).style.cssText='font-size:12px;color:var(--text2);margin-top:2px';
    head.appendChild(titleBlock);
    modal.appendChild(head);
    /* Info rows */
    const info=el('div','');info.style.cssText='background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px';
    const addRow=(lbl,val,opts)=>{
      const r=el('div','');r.style.cssText='display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px';
      const l=tx('span','',lbl);l.style.cssText='color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.5px';
      const v=tx('span','',val||'—');v.style.cssText='color:var(--text);font-weight:'+(opts?.bold?'600':'400');
      if(opts?.color)v.style.color=opts.color;
      r.appendChild(l);r.appendChild(v);info.appendChild(r);
    };
    addRow('Заказ',order.name,{bold:true});
    addRow('Клиент',order.client);
    addRow('Дата поставки',d.date?fmtS(new Date(d.date)):'не указана',{bold:true,color:'#58a6ff'});
    if(d.notes)addRow('Примечание',d.notes);
    modal.appendChild(info);
    /* Attached file */
    const fileBox=el('div','');fileBox.style.cssText='background:var(--bg);border:1px dashed var(--border2);border-radius:var(--r);padding:12px;margin-bottom:14px';
    if(d.fileName&&(d.fileId||d.filePath||d.fileDataUrl)){
      const fr=el('div','');fr.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:10px';
      const fIcon=tx('span','','📎');fIcon.style.fontSize='18px';fr.appendChild(fIcon);
      const fn=tx('span','',d.fileName);fn.style.cssText='flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      fr.appendChild(fn);
      fileBox.appendChild(fr);
      /* Резолвим URL для просмотра/печати. Источники по приоритету:
         1) fileId — новая схема: SELECT из delivery_files, конвертим в blob URL
         2) filePath — Supabase Storage (если оживёт): public URL
         3) fileDataUrl — legacy base64-fallback (для старых заказов до миграции) */
      const dataUrlToBlobUrl=(dataUrl)=>{
        const commaIdx=dataUrl.indexOf(',');
        const meta=dataUrl.substring(5,commaIdx);  /* skip 'data:' */
        const isB64=meta.endsWith(';base64');
        const mime=isB64?meta.slice(0,-7):meta;
        const payload=dataUrl.substring(commaIdx+1);
        let blob;
        if(isB64){
          const bin=atob(payload);
          const bytes=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
          blob=new Blob([bytes],{type:mime||'application/octet-stream'});
        }else{
          blob=new Blob([decodeURIComponent(payload)],{type:mime||'text/plain'});
        }
        return URL.createObjectURL(blob);
      };
      const resolveUrl=async()=>{
        if(d.fileId){
          const row=await db.fetchDeliveryFile(d.fileId);
          if(!row||!row.data)return '';
          return dataUrlToBlobUrl(row.data);
        }
        if(d.filePath)return await db.getDeliveryFileUrl(d.filePath);
        if(d.fileDataUrl)return dataUrlToBlobUrl(d.fileDataUrl);
        return '';
      };
      const btnRow=el('div','');btnRow.style.cssText='display:flex;gap:8px';
      const openBtn=el('button','btn pr sm');openBtn.textContent='👁 Открыть';
      openBtn.style.flex='1';
      openBtn.onclick=async()=>{
        openBtn.disabled=true;openBtn.textContent='⏳ Загрузка…';
        try{
          const url=await resolveUrl();
          const w=window.open();
          if(!w){alert('Окно заблокировано браузером. Разрешите всплывающие окна.');return}
          const ext=(d.fileName.split('.').pop()||'').toLowerCase();
          const isImg=['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext);
          if(isImg){
            w.document.title=d.fileName;
            w.document.body.style.cssText='margin:0;background:#222;display:flex;align-items:center;justify-content:center;min-height:100vh';
            const img=w.document.createElement('img');img.src=url;img.style.maxWidth='100%';img.style.maxHeight='100vh';
            w.document.body.appendChild(img);
          }else{
            w.location.href=url;
          }
        }catch(e){alert('Не удалось открыть файл: '+(e.message||e))}
        finally{openBtn.disabled=false;openBtn.textContent='👁 Открыть'}
      };
      const printBtn=el('button','btn sm');printBtn.textContent='🖨 Распечатать';
      printBtn.style.flex='1';
      printBtn.onclick=async()=>{
        printBtn.disabled=true;printBtn.textContent='⏳ Загрузка…';
        try{
          const url=await resolveUrl();
          const w=window.open('','_blank','width=900,height=700');
          if(!w){alert('Окно заблокировано браузером. Разрешите всплывающие окна.');return}
          const ext=(d.fileName.split('.').pop()||'').toLowerCase();
          const isImg=['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext);
          w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+d.fileName+'<\/title>'+
            '<style>body{margin:0;font-family:sans-serif}img{max-width:100%;display:block;margin:0 auto}'+
            '@media print{@page{margin:1cm}}<\/style><\/head><body>');
          if(isImg){
            w.document.write('<img src="'+url+'" onload="setTimeout(()=>window.print(),200)">');
          }else{
            w.document.write('<iframe src="'+url+'" style="width:100%;height:95vh;border:0" onload="setTimeout(()=>{try{frames[0].focus();frames[0].print()}catch(e){window.print()}},400)"><\/iframe>');
          }
          w.document.write('<\/body><\/html>');
          w.document.close();
        }catch(e){alert('Не удалось загрузить файл: '+(e.message||e))}
        finally{printBtn.disabled=false;printBtn.textContent='🖨 Распечатать'}
      };
      btnRow.appendChild(openBtn);btnRow.appendChild(printBtn);fileBox.appendChild(btnRow);
    }else{
      const empty=tx('div','','Файл заявки не прикреплён');
      empty.style.cssText='text-align:center;color:var(--text3);font-size:12px;padding:8px';
      fileBox.appendChild(empty);
    }
    modal.appendChild(fileBox);

    /* === Delivery status: «Доставлено» + получатель === */
    const delBox=el('div','');
    delBox.style.cssText='background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px';
    const tgRow=el('div','');tgRow.style.cssText='display:flex;align-items:center;gap:10px';
    const tgLbl=tx('span','','✓ Доставлено');tgLbl.style.cssText='font-weight:500;flex:1';
    /* toggle */
    const tg=el('button','');tg.style.cssText='width:44px;height:24px;border-radius:99px;border:none;cursor:pointer;position:relative;transition:background .15s;'+
      'background:'+(d.delivered?'var(--success)':'var(--bg3)');
    const knob=el('div','');knob.style.cssText='position:absolute;top:2px;left:'+(d.delivered?'22px':'2px')+';width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s';
    tg.appendChild(knob);
    tgRow.appendChild(tgLbl);tgRow.appendChild(tg);
    delBox.appendChild(tgRow);
    /* receivedBy select (visible only when delivered=true) */
    const recvWrap=el('div','');
    const showRecv=()=>{
      recvWrap.style.display=d.delivered?'block':'none';
    };
    recvWrap.appendChild(tx('label','flbl','👤 Принял доставку'));
    const rSel=document.createElement('select');rSel.className='finput';
    const optEmpty=document.createElement('option');optEmpty.value='';optEmpty.textContent='— выберите —';rSel.appendChild(optEmpty);
    (S.users||[]).forEach(u=>{
      const val=u.name+'_'+u.role;
      const op=document.createElement('option');op.value=val;op.textContent=u.name+' · '+u.role;
      if(d.receivedBy===val)op.selected=true;rSel.appendChild(op);
    });
    rSel.onchange=e=>{
      d.receivedBy=e.target.value;
      if(!d.deliveredAt)d.deliveredAt=dk(TODAY);
      render(); /* refresh markers on the gantt */
    };
    recvWrap.appendChild(rSel);
    if(d.delivered&&d.deliveredAt){
      const meta=tx('div','',  'Отмечено: '+fmtS(new Date(d.deliveredAt)));
      meta.style.cssText='font-size:11px;color:var(--text2);margin-top:4px';
      recvWrap.appendChild(meta);
    }
    delBox.appendChild(recvWrap);
    showRecv();
    tg.onclick=()=>{
      if(!d.delivered){
        /* turning ON — require receivedBy via select (alert if still empty after the user closes without picking) */
        d.delivered=true;
        if(!d.deliveredAt)d.deliveredAt=dk(TODAY);
        /* if there's already a value (re-toggling), keep it; otherwise prompt visually */
        tg.style.background='var(--success)';knob.style.left='22px';
        showRecv();
        if(!d.receivedBy){
          /* keep delivered=true visually but tell the user that confirmation requires receivedBy */
          rSel.focus();
        }
        render();
      }else{
        /* turning OFF — clear status fields */
        if(!d.receivedBy){
          d.delivered=false;d.deliveredAt='';
        }else{
          if(!confirm('Снять отметку «Доставлено»? Получатель «'+d.receivedBy.replace('_',' · ')+'» будет очищен.'))return;
          d.delivered=false;d.deliveredAt='';d.receivedBy='';rSel.value='';
        }
        tg.style.background='var(--bg3)';knob.style.left='2px';
        showRecv();render();
      }
    };
    /* If delivered=true but no receivedBy yet — show warning */
    if(d.delivered&&!d.receivedBy){
      const wn=tx('div','',  '⚠ Укажите ответственного, иначе отметка о доставке не будет считаться подтверждённой');
      wn.style.cssText='font-size:11px;color:var(--warn);margin-top:-4px';
      delBox.appendChild(wn);
    }
    modal.appendChild(delBox);

    /* Footer: edit + close */
    const ftr=el('div','');ftr.style.cssText='display:flex;gap:8px;justify-content:flex-end';
    const editBtn=el('button','btn sm');editBtn.textContent='✏ Редактировать';
    editBtn.onclick=()=>openModal({type:'editPurchasing',orderId:order.id});
    const closeBtn=el('button','btn pr');closeBtn.textContent='Закрыть';
    closeBtn.onclick=()=>{S.modal=null;render()};
    ftr.appendChild(editBtn);ftr.appendChild(closeBtn);
    modal.appendChild(ftr);
  }

  /* ── EDIT STAGE HOUR ── */
  else if(m.type==='editStageHour'){
    const order=S.orders.find(o=>o.id===m.orderId);
    const sub=order.suborders.find(s=>s.id===m.subId);
    const stage=sub.stages.find(s=>s.id===m.stageId);
    const def=STAGE_DEFS.find(s=>s.id===m.stageId);
    const t=el('div','modal-title');
    const dot=el('span','');dot.style.cssText=`display:inline-block;width:10px;height:10px;border-radius:50%;background:${def.color};margin-right:7px;vertical-align:middle`;
    t.appendChild(dot);t.appendChild(tx('span','',def.lbl+' — часы'));modal.appendChild(t);
    addSelect(modal,'Статус',Object.entries(STAT_MAP).map(([k,v])=>[k,v.lbl]),m.status,v=>m.status=v);
    /* Ответственные за этап. UI — слоты-выпадашки. Минимум 2 слота
       видимых по умолчанию, второй заполнять не обязательно. Минимум
       один выбранный — обязательно (валидация при «Сохранить»).
       Кнопка «+ Ещё слот» добавляет дополнительные. */
    if(!Array.isArray(m._slots)){
      const ex=Array.isArray(stage.assignees)?stage.assignees.slice():[];
      m._slots=ex.length>=2?ex:[...ex,...Array(2-ex.length).fill('')];
    }
    modal.appendChild(tx('label','flbl','Ответственные'));
    const asWrap=el('div','');asWrap.style.cssText='display:flex;flex-direction:column;gap:6px;margin-top:4px';
    const refresh=()=>{
      asWrap.innerHTML='';
      m._slots.forEach((val,idx)=>{
        const row=el('div','');row.style.cssText='display:flex;align-items:center;gap:6px';
        const sel=document.createElement('select');sel.className='finput';sel.style.flex='1';
        const ph=document.createElement('option');ph.value='';ph.textContent='— выберите сотрудника —';sel.appendChild(ph);
        (S.employees||[]).forEach(u=>{
          const v=u.id;
          /* Дубли: если выбран в другом слоте — скрываем (кроме своего значения). */
          const usedElsewhere=m._slots.some((sv,si)=>si!==idx&&sv===v);
          if(usedElsewhere&&v!==val)return;
          /* Проверка занятости в другом этапе пересекающемся по времени */
          const conflict=findUserConflict(v,stage.start,stage.end,stage.uid);
          const op=document.createElement('option');op.value=v;
          const label=u.name+(u.role?' · '+u.role:'');
          if(conflict&&v!==val){
            op.disabled=true;
            const stDef=STAGE_DEFS.find(d=>d.id===conflict.stage.id);
            const stLbl=stDef?stDef.lbl:conflict.stage.id;
            op.textContent=label+' — занят: '+stLbl+' / '+conflict.order.name;
          }else{
            op.textContent=label;
          }
          if(v===val)op.selected=true;
          sel.appendChild(op);
        });
        sel.onchange=e=>{m._slots[idx]=e.target.value;refresh()};
        row.appendChild(sel);
        if(m._slots.length>2){
          const rm=el('button','btn ic sm');rm.textContent='✕';rm.title='Убрать слот';
          rm.style.cssText='padding:1px 6px;font-size:11px';
          rm.onclick=()=>{m._slots.splice(idx,1);refresh()};
          row.appendChild(rm);
        }
        asWrap.appendChild(row);
      });
      /* «+ Ещё слот» — добавляет пустой слот, если не все сотрудники уже заняты */
      const used=new Set(m._slots.filter(Boolean));
      const totalEmployees=(S.employees||[]).length;
      if(used.size<totalEmployees){
        const addBtn=el('button','btn sm');addBtn.textContent='+ Ещё слот';
        addBtn.style.cssText='align-self:flex-start;font-size:11px';
        addBtn.onclick=()=>{m._slots.push('');refresh()};
        asWrap.appendChild(addBtn);
      }
    };
    refresh();
    modal.appendChild(asWrap);
    // start hour slider
    modal.appendChild(tx('label','flbl','Начало работы'));
    const shRow=el('div','');shRow.style.cssText='display:flex;align-items:center;gap:8px;margin-top:4px';
    const shS=document.createElement('input');shS.type='range';shS.min=0;shS.max=23;shS.step=0.5;shS.value=m.startHour;shS.style.flex='1';shS.style.accentColor='var(--accent)';
    const shV=tx('span','',fmtHM(m.startHour));shV.style.cssText='font-size:12px;font-family:"JetBrains Mono",monospace;color:var(--accent);min-width:44px';
    shS.oninput=e=>{m.startHour=+e.target.value;shV.textContent=fmtHM(m.startHour);refreshOT()};
    shRow.appendChild(shS);shRow.appendChild(shV);modal.appendChild(shRow);
    // duration: slider (0.5..120, convenient) + number input (any value, unlimited)
    modal.appendChild(tx('label','flbl','Длительность (часов)'));
    const dhRow=el('div','');dhRow.style.cssText='display:flex;align-items:center;gap:8px;margin-top:4px';
    const dhS=document.createElement('input');dhS.type='range';dhS.min=0.5;dhS.max=120;dhS.step=0.5;dhS.value=Math.min(120,m.durationHours);dhS.style.flex='1';dhS.style.accentColor='var(--accent)';
    const dhN=document.createElement('input');dhN.type='number';dhN.min=0.5;dhN.step=0.5;dhN.value=m.durationHours;
    dhN.style.cssText='width:64px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:3px 5px;font-size:12px;color:var(--accent);font-family:"JetBrains Mono",monospace;text-align:center;outline:none';
    const dhU=tx('span','','ч');dhU.style.cssText='font-size:11px;color:var(--text2)';
    function setDH(v){
      v=Math.max(0.5,Math.round((+v||0.5)*2)/2);
      m.durationHours=v;
      dhS.value=Math.min(120,v);
      dhN.value=v;
      refreshOT();
    }
    dhS.oninput=e=>setDH(e.target.value);
    dhN.oninput=e=>setDH(e.target.value);
    dhRow.appendChild(dhS);dhRow.appendChild(dhN);dhRow.appendChild(dhU);modal.appendChild(dhRow);
    addField(modal,'Примечание','text',m.note,v=>m.note=v);
    /* delivery dates: only for materials stage. They mark the bar with vertical
       coloured strips and feed validation (cutting ≥ matDelivery/hwDelivery). */
    if(def.id==='materials'){
      modal.appendChild(tx('label','flbl','Ориентировочные даты поставки'));
      const dr=el('div','');dr.style.cssText='display:flex;gap:8px;margin-top:4px';
      const mw=el('div','');mw.style.flex='1';
      const ml=el('label','');ml.style.cssText='font-size:10px;color:#3fb950;display:block;margin-bottom:2px';ml.textContent='📦 Материалы';
      mw.appendChild(ml);
      const mi=document.createElement('input');mi.type='date';mi.className='finput';
      mi.value=m.matDelivery!=null?m.matDelivery:(stage.matDelivery||'');
      mi.oninput=e=>m.matDelivery=e.target.value;
      mw.appendChild(mi);dr.appendChild(mw);
      const hwd=el('div','');hwd.style.flex='1';

      hwd.appendChild(hi);dr.appendChild(hwd);

    }
    /* calculator for specific stages */
    appendCalc(modal,def.id,dhN,null,null,sub.qty);
    const otBox=el('div','');modal.appendChild(otBox);
    function refreshOT(){
      const ws=S.workStart,we=S.workEnd,ls=S.lunchStart,le=S.lunchEnd;
      /* Build working-day list anchored to the real stage.start so the resulting
         end date matches what will actually appear on the gantt. */
      const startDate=new Date(stage.start);
      const wdays=[];
      let d=new Date(startDate);
      for(let i=0;i<30;i++){if(!isWE(d))wdays.push(dk(d));d=calAdd(d,1);}
      const segs=calcStageSegments(m.startHour,m.durationHours,ws,we,ls,le,0,wdays);
      otBox.innerHTML='';
      if(!segs.length){
        const box=el('div','info-box');box.textContent='Введите параметры';otBox.appendChild(box);return;
      }
      const last=segs[segs.length-1];
      const endDate=new Date(wdays[last.di]||wdays[wdays.length-1]);
      const isMulti=segs.length>1;
      const box=el('div',isMulti?'warn-box':'info-box');
      const dayName=endDate.toLocaleDateString('ru-RU',{weekday:'short'});
      box.innerHTML=`<b>Окончание:</b> ${fmtS(endDate)} (${dayName}) в <b>${fmtHM(last.endH)}</b>`+
        (isMulti?` <span style="opacity:.7;font-size:11px">· занимает ${segs.length} раб. дн.</span>`:'');

    } else if(m.tab==='employees'){
